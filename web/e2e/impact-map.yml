    - web/src/app/(dashboard)/(validation)/validation/**
    - web/src/lib/i18n/dictionaries/en/validation.json
    - api/internal/app/validation/**
    - api/internal/infra/http/handler/validation_*
  '@vulnerabilities':
    - web/src/features/vulnerabilities/**
    - web/src/features/vuln-matching/**
    - web/src/app/(dashboard)/(prioritization)/vulnerabilities/**
    - web/src/lib/i18n/dictionaries/en/vulnPage.json
    - api/internal/infra/http/handler/vulnerability_*
  '@ticketing':
    - web/src/features/integrations/**
    - web/src/features/ticket-mapping/**
    - web/src/lib/i18n/dictionaries/en/ticket*.json
    - web/src/lib/i18n/dictionaries/en/ticketingIntegration.json
    - api/internal/app/ticketing/**
    - api/internal/app/ticketbridge/**
    - api/internal/infra/http/handler/ticket_*
  '@my-work':
    - web/src/features/my-work/**
    - web/src/app/(dashboard)/my-work/**
    - web/src/lib/i18n/dictionaries/en/myWork.json
  '@auth':
    - web/src/features/auth/**
    - web/src/app/(auth)/**
    - web/src/app/auth/**
    - web/src/app/invitations/**
    - web/src/lib/i18n/dictionaries/en/auth.json
  # The every-page request budget: any change to how a page loads its data.
  '@budget':
    - web/e2e/request-budget.json
    - web/src/features/*/hooks/**
    - web/src/features/*/api/**
    - web/src/app/**/page.tsx
