version: "2"
run:
  go: "1.27"
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - depguard
    - dupl
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gosec
    - govet
    - misspell
    - nestif
    - nilerr
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    cyclop:
      max-complexity: 30
    depguard:
      rules:
        core-domain-isolation:
          list-mode: lax
          files:
            - '**/pkg/domain/asset/**'
            - '**/pkg/domain/vulnerability/**'
            - '**/pkg/domain/component/**'
            - '**/pkg/domain/relationship/**'
            - '**/pkg/domain/findingsource/**'
          deny:
            - pkg: github.com/openctemio/openctem/api/internal/app
              desc: core domain must not depend on app services (layering violation)
            - pkg: github.com/openctemio/openctem/api/pkg/domain/pentest
              desc: core domain must not import a feature domain
            - pkg: github.com/openctemio/openctem/api/pkg/domain/remediation
              desc: core domain must not import a feature domain
            - pkg: github.com/openctemio/openctem/api/pkg/domain/compliance
              desc: core domain must not import a feature domain
            - pkg: github.com/openctemio/openctem/api/pkg/domain/simulation
              desc: core domain must not import a feature domain
    dupl:
      threshold: 300
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io.Copy
        - io.WriteTo
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (*database/sql.Rows).Close
        - encoding/json.Marshal
        - encoding/json.MarshalIndent
    errorlint:
      errorf: false
      asserts: true
      comparison: true
    funlen:
      lines: 350
      statements: 200
      ignore-comments: true
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - exitAfterDefer
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G104
        - G101
        - G402
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
      ignore-rules:
        - openctem
        - canceled
        - mitre
    nestif:
      min-complexity: 12
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - dupl
          - errcheck
          - errorlint
          - funlen
          - gocognit
          - goconst
          - gocritic
          - gosec
          - prealloc
        path: _test\.go
      - linters:
          - gochecknoglobals
          - gochecknoinits
        path: cmd/.*/main\.go
      - linters:
          - dupl
          - errcheck
        path: mock_.*\.go
      - linters:
          - dupl
          - errcheck
        path: internal/mocks/
      - linters:
          - dupl
          - errcheck
          - errorlint
        path: tests/
      - linters:
          - cyclop
          - goconst
        path: (.+)_test\.go
    paths:
      - vendor
      - third_party
      - testdata
      - internal/infra/grpc/pb
      - internal/mocks
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
severity:
  default: warning
  rules:
    - linters:
        - gosec
        - staticcheck
      severity: error
    - linters:
        - cyclop
        - dupl
        - funlen
        - gocognit
      severity: warning
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/openctemio/openctem/api
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - internal/infra/grpc/pb
      - internal/mocks
      - third_party$
      - builtin$
      - examples$
