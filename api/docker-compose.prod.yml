# =============================================================================
# Docker Compose - Production Environment (API only)
# =============================================================================
# For a complete installation (web UI + API behind ONE HTTPS port), use
# deploy/docker-compose.yml instead. This file runs the API alone and does not
# publish it; put it behind the gateway (deploy/gateway) or your own proxy.
#
# Option 1: Pull the published images from GHCR (recommended for deployment):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Option 2: Build locally:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# With specific version:
#   API_VERSION=v1.0.0 docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment variables (set in .env or shell):
#   - DB_PASSWORD          (database password of DB_USER, what the API connects as)
#
# Recommended (least-privilege database roles, docs/deployment/database-roles.md):
#   - DB_USER=openctem_app, DB_MIGRATE_USER=openctem_migrator, DB_MIGRATE_PASSWORD,
#     DB_SUPERUSER=postgres, DB_SUPERUSER_PASSWORD
#   - REDIS_PASSWORD       (redis password)
#   - AUTH_JWT_SECRET      (JWT signing secret, min 64 chars)
#   - APP_ENCRYPTION_KEY   (encryption key for credentials, hex 64 chars or base64 44 chars)
#   - CORS_ALLOWED_ORIGINS (allowed origins for CORS)
#
# Optional (for OIDC/Keycloak auth):
#   - KEYCLOAK_BASE_URL
#   - KEYCLOAK_REALM
#
# Security Features:
#   - Database/Redis NOT exposed externally
#   - no-new-privileges on all containers
#   - read_only filesystem for API
#   - Resource limits enforced
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database Migrations (one-shot, runs BEFORE the API)
  # ---------------------------------------------------------------------------
  # The production API does NOT auto-migrate — it fails fast if the schema is
  # behind the binary (see cmd/server/schema_check.go). This one-shot service
  # applies migrations first; the app waits on it via
  # `condition: service_completed_successfully`, so the API never starts against
  # a stale schema. Keep MIGRATIONS_VERSION in lock-step with API_VERSION.
  # See docs/deployment/safe-deploy-and-migrations.md.
  #
  # Least-privilege roles (D-6, docs/deployment/database-roles.md): set
  # DB_MIGRATE_USER/DB_MIGRATE_PASSWORD (the schema owner migrations run as),
  # DB_USER/DB_PASSWORD (the API: DML only) and DB_SUPERUSER/
  # DB_SUPERUSER_PASSWORD (initdb and the db-roles job). Unset, everything runs
  # as DB_USER as before.
  db-roles:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${DB_MIGRATE_USER:-}" ]; then
          echo "db-roles: DB_MIGRATE_USER is not set; single-role mode, nothing to do"
          exit 0
        fi
        if [ -z "$${DB_MIGRATE_PASSWORD:-}" ]; then
          echo "db-roles: DB_MIGRATE_USER is set but DB_MIGRATE_PASSWORD is empty" >&2; exit 1
        fi
        same() { [ "$$1" = "$$2" ]; }
        if same "$$PGPASSWORD" "$$DB_PASSWORD" || same "$$DB_MIGRATE_PASSWORD" "$$DB_PASSWORD"; then
          echo "db-roles: the superuser, migrator and app (DB_PASSWORD) need different passwords; set DB_SUPERUSER_PASSWORD and DB_MIGRATE_PASSWORD" >&2; exit 1
        fi
        exec psql -X -v ON_ERROR_STOP=1 \
          -v app_user="$$DB_USER" -v app_password="$$DB_PASSWORD" \
          -v migrator_user="$$DB_MIGRATE_USER" -v migrator_password="$$DB_MIGRATE_PASSWORD" \
          -f /bootstrap/least-privilege-roles.sql
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-openctem}
      PGSSLMODE: ${DB_SSLMODE:-require}
      PGUSER: ${DB_SUPERUSER:-${DB_USER:-openctem}}
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
    volumes:
      - ./deploy/postgres:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${MIGRATIONS_IMAGE:-ghcr.io/openctemio/migrations}:${MIGRATIONS_VERSION:-${API_VERSION:-latest}}
    build:
      context: .
      dockerfile: Dockerfile.migrations
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://${DB_MIGRATE_USER:-${DB_USER:-openctem}}:${DB_MIGRATE_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}@postgres:5432/${DB_NAME:-openctem}?sslmode=${DB_SSLMODE:-require}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # API Application (Production)
  # ---------------------------------------------------------------------------
  app:
    # Pull from GHCR by default, build locally if --build flag is used.
    # Releases from the monorepo are ghcr.io/openctemio/openctem-api; the legacy
    # name below gets identical copies during the transition window and is the
    # only one with v0.8.0 and earlier. Set API_IMAGE to switch.
    image: ${API_IMAGE:-ghcr.io/openctemio/api}:${API_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Not published: clients reach the API through the gateway on one HTTPS
    # port (deploy/docker-compose.yml, which also runs the web UI). Port 9090
    # (gRPC/metrics) is never public.
    expose:
      - "8080"
    environment:
      # Application
      APP_NAME: openctem
      APP_ENV: production
      APP_DEBUG: "false"
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_REQUEST_TIMEOUT: ${SERVER_REQUEST_TIMEOUT:-30s}
      GRPC_PORT: 9090
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-openctem}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-50}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-50}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      # Authentication
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-api}
      AUTH_ACCESS_TOKEN_DURATION: ${AUTH_ACCESS_TOKEN_DURATION:-15m}
      AUTH_REFRESH_TOKEN_DURATION: ${AUTH_REFRESH_TOKEN_DURATION:-168h}
      AUTH_SESSION_DURATION: ${AUTH_SESSION_DURATION:-720h}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-8}
      AUTH_PASSWORD_REQUIRE_UPPERCASE: ${AUTH_PASSWORD_REQUIRE_UPPERCASE:-true}
      AUTH_PASSWORD_REQUIRE_LOWERCASE: ${AUTH_PASSWORD_REQUIRE_LOWERCASE:-true}
      AUTH_PASSWORD_REQUIRE_NUMBER: ${AUTH_PASSWORD_REQUIRE_NUMBER:-true}
      AUTH_PASSWORD_REQUIRE_SPECIAL: ${AUTH_PASSWORD_REQUIRE_SPECIAL:-true}
      AUTH_MAX_LOGIN_ATTEMPTS: ${AUTH_MAX_LOGIN_ATTEMPTS:-5}
      AUTH_LOCKOUT_DURATION: ${AUTH_LOCKOUT_DURATION:-15m}
      AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:-10}
      # Who creates organizations: admin_only (platform administrator: console or
      # bootstrap-admin -org-*) or self_service (any signed-in user; SaaS/trial).
      TENANT_CREATION_MODE: ${TENANT_CREATION_MODE:-admin_only}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      # Keycloak (optional - only for oidc or hybrid auth)
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_JWKS_REFRESH_INTERVAL: ${KEYCLOAK_JWKS_REFRESH_INTERVAL:-1h}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS,PATCH}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Accept,Authorization,Content-Type,X-Request-ID}
      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-100}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-200}
      # Encryption (required in production)
      # Generate with: openssl rand -hex 32
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      # Old key(s) while rotating APP_ENCRYPTION_KEY (docs/deployment/encryption-key-rotation.md).
      APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
      # Master of the custom-template signing keys (unset: derived from APP_ENCRYPTION_KEY).
      APP_TEMPLATE_SIGNING_KEY: ${APP_TEMPLATE_SIGNING_KEY:-}
      # SMTP (optional)
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@openctem.io}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OpenCTEM}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_BASE_URL: ${SMTP_BASE_URL:-}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: always
    # Uploaded attachments and finding evidence (STORAGE_LOCAL_PATH,
    # ./data/attachments under /app). The root filesystem is read-only, so
    # without this volume every upload fails. Back it up with the database.
    volumes:
      - api-data:/app/data
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=100M
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # PostgreSQL Override (Production)
  # ---------------------------------------------------------------------------
  postgres:
    # Override base - no external ports in production
    ports: []
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:-${DB_USER:-openctem}}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      POSTGRES_DB: ${DB_NAME:-openctem}
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis Override (Production)
  # ---------------------------------------------------------------------------
  redis:
    # Override base - no external ports in production
    ports: []
    expose:
      - "6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  api-data:
