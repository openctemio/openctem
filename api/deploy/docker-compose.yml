# =============================================================================
# OpenCTEM - production stack behind ONE HTTPS port
# =============================================================================
# Only the gateway is published. The web UI (Next.js), the API (Go), Postgres
# and Redis stay on the internal network; browsers, sensors, API-key clients,
# SCIM and MCP all use https://<OPENCTEM_HOSTNAME>. Routing and TLS modes:
# gateway/Caddyfile. Guide: docs "Exposing OpenCTEM: one HTTPS port".
#
#   ./setup.sh ctem.example.com   # writes .env: host name + generated secrets
#   docker compose up -d
#
# Optional overlays:
#   docker-compose.http-redirect.yml  also publish :80: http:// redirects to
#                                     HTTPS (TLS modes internal, files, acme)
#                                     and ACME HTTP-01 (acme)
#   docker-compose.plain-http.yml     OPENCTEM_TLS_MODE=http behind your own
#                                     TLS proxy (explicit opt-in)
#   docker-compose.sensor.yml         a bundled sensor, enrolled as a shared
#                                     sensor of the instance with the
#                                     single-use SENSOR_INSTANCE_ENROLLMENT_TOKEN
#
# Never published: API :8080, web :3000, Postgres, Redis.
# =============================================================================

name: openctem

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # Gateway: the only published service
  # ---------------------------------------------------------------------------
  # Gives the gateway's volumes to its user (uid 1000) before it starts:
  # volumes written by an older gateway that ran as root hold root-owned files,
  # and Docker creates a missing ./ca as root. Offline, runs and exits on every
  # `up` (a no-op once the owner is right); only CHOWN, plus DAC_READ_SEARCH
  # to walk the gateway's own 0700 directories.
  gateway-init:
    image: ${GATEWAY_IMAGE:-ghcr.io/openctemio/openctem-gateway}:${GATEWAY_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/data", "/config", "/ca"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${OPENCTEM_CA_EXPORT_DIR:-./ca}:/ca
      - gateway-data:/data
      - gateway-config:/config
    restart: "no"
    logging: *default-logging

  # The gateway image: Caddy with the standard and layer4 modules, built with
  # the release's Go toolchain (api/deploy/gateway/Dockerfile). Runs as uid
  # 1000; binds 443 (and 80 with the redirect overlay) as non-root through
  # the namespaced sysctl below, so no-new-privileges stays on and it holds
  # no capability.
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/openctemio/openctem-gateway}:${GATEWAY_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HTTPS_PORT:-443}:443"
      # The platform console's site (OPENCTEM_ADMIN_SITE=port); it answers only
      # OPENCTEM_ADMIN_ALLOWED_CIDRS (private networks by default).
      # OPENCTEM_ADMIN_BIND puts it on one interface only (a private or VPN
      # address): a published port is not filtered by the host firewall.
      - "${OPENCTEM_ADMIN_BIND:-${GATEWAY_BIND:-0.0.0.0}}:${OPENCTEM_ADMIN_PORT:-8443}:${OPENCTEM_ADMIN_PORT:-8443}"
    environment:
      OPENCTEM_HOSTNAME: ${OPENCTEM_HOSTNAME:?OPENCTEM_HOSTNAME is required (DNS name or IP clients use)}
      OPENCTEM_TLS_MODE: ${OPENCTEM_TLS_MODE:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-tls.crt}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-tls.key}
      OPENCTEM_ALLOW_PLAIN_HTTP: ${OPENCTEM_ALLOW_PLAIN_HTTP:-false}
      OPENCTEM_TRUSTED_PROXIES: ${OPENCTEM_TRUSTED_PROXIES:-}
      OPENCTEM_CLIENT_IP_HEADERS: ${OPENCTEM_CLIENT_IP_HEADERS:-X-Forwarded-For}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-256MB}
      # The platform console on its own site (port | host | off).
      OPENCTEM_ADMIN_SITE: ${OPENCTEM_ADMIN_SITE:-port}
      OPENCTEM_ADMIN_HOST: ${OPENCTEM_ADMIN_HOST:-}
      OPENCTEM_ADMIN_PORT: ${OPENCTEM_ADMIN_PORT:-8443}
      # The main site's published port: the entrypoint refuses a console port
      # equal to it (both are published on this host).
      GATEWAY_HTTPS_PORT: ${GATEWAY_HTTPS_PORT:-443}
      OPENCTEM_ADMIN_ALLOWED_CIDRS: ${OPENCTEM_ADMIN_ALLOWED_CIDRS:-}
    volumes:
      # A directory, not single files: editors replace a file's inode on save
      # and a single-file bind mount keeps showing the old content.
      - ./gateway:/etc/caddy:ro
      # TLS mode `files`: your certificate and key (TLS_CERT_FILE/TLS_KEY_FILE).
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
      # TLS mode `internal`: the root CA certificate for sensors, 0644.
      - ${OPENCTEM_CA_EXPORT_DIR:-./ca}:/ca
      - gateway-data:/data # certificates, ACME account, internal CA (keep!)
      - gateway-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      gateway-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      console:
        condition: service_healthy
    networks:
      openctem:
        ipv4_address: ${OPENCTEM_NET_PREFIX:-172.30.80}.10
    restart: unless-stopped
    # Caddy writes only to its volumes (/data, /config, /ca) and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY_LIMIT:-512m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Web UI (Next.js): internal only
  # ---------------------------------------------------------------------------
  # Image names: releases from v0.9.0 on are published as
  # ghcr.io/openctemio/openctem-web and ghcr.io/openctemio/openctem-api. The
  # names of v0.8.0 and earlier (ghcr.io/openctemio/ui, ghcr.io/openctemio/api)
  # do not hold every later release: set UI_IMAGE / API_IMAGE to them only to
  # run such an old release with this file.
  web:
    image: ${UI_IMAGE:-ghcr.io/openctemio/openctem-web}:${UI_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8080
      # The public origin, for the Content-Security-Policy (same value as the
      # API's APP_URL).
      NEXT_PUBLIC_APP_URL: ${OPENCTEM_PUBLIC_URL:-https://${OPENCTEM_HOSTNAME}}
      # Browsers always see HTTPS (the gateway, or your TLS proxy in `http` mode).
      SECURE_COOKIES: "true"
      # The gateway overwrites X-Real-IP / X-Forwarded-For, so pass them on to
      # the API (audit log, IP allowlists). Safe only because web is not
      # published: nothing but the gateway can reach it.
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      openctem:
        ipv4_address: ${OPENCTEM_NET_PREFIX:-172.30.80}.11
    restart: unless-stopped
    # node does not reap orphaned children as PID 1; a minimal init does and
    # forwards SIGTERM, so `docker compose stop` is graceful.
    init: true
    # Read-only root filesystem: the standalone server writes only to /tmp and
    # .next/cache (see web/Dockerfile). No Linux capabilities needed.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1001,gid=1001,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-1g}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Platform console (Next.js): internal only, served by the gateway's console
  # site at its root (RFC-022 revision 21). Its own app and image: no tenant
  # page runs here and no console page in `web`.
  # ---------------------------------------------------------------------------
  console:
    image: ${CONSOLE_IMAGE:-ghcr.io/openctemio/openctem-console}:${CONSOLE_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # The console API: the API's internal console listener.
      ADMIN_API_URL: http://api:8081
      # The public API for the instance brand (name, colors, logo).
      BACKEND_API_URL: http://api:8080
      SECURE_COOKIES: "true"
      # The gateway overwrites X-Real-IP / X-Forwarded-For; passed on to the
      # API for the console's audit log. Safe only because the console is not
      # published: nothing but the gateway can reach it.
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      api:
        condition: service_healthy
    networks:
      openctem:
        ipv4_address: ${OPENCTEM_NET_PREFIX:-172.30.80}.13
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/console/.next/cache:uid=1001,gid=1001,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${CONSOLE_MEMORY_LIMIT:-512m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Least-privilege roles (D-6, docs/deployment/database-roles.md). When
  # DB_MIGRATE_USER is set, this one-shot job connects as the Postgres
  # superuser and (re)applies postgres/least-privilege-roles.sql: the migrator
  # (DB_MIGRATE_USER) owns the schema, the API's DB_USER gets DML only. It is
  # idempotent and runs on every `up`. Without DB_MIGRATE_USER it does nothing
  # and everything connects as DB_USER, as before. With DB_ADMIN_USER too, the
  # platform console's identity tables (administrators, console sessions) are
  # written by that role alone, and the API's DB_USER only reads admin_users.
  db-roles: &db-roles
    image: postgres:${POSTGRES_VERSION:-17}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$${DB_MIGRATE_USER:-}" ]; then
          echo "db-roles: DB_MIGRATE_USER is not set; single-role mode, nothing to do"
          exit 0
        fi
        if [ -z "$${DB_MIGRATE_PASSWORD:-}" ]; then
          echo "db-roles: DB_MIGRATE_USER is set but DB_MIGRATE_PASSWORD is empty" >&2; exit 1
        fi
        same() { [ "$$1" = "$$2" ]; }
        if same "$$PGPASSWORD" "$$DB_PASSWORD" || same "$$DB_MIGRATE_PASSWORD" "$$DB_PASSWORD"; then
          echo "db-roles: the superuser, migrator and app (DB_PASSWORD) need different passwords; set DB_SUPERUSER_PASSWORD and DB_MIGRATE_PASSWORD" >&2; exit 1
        fi
        set -- -v app_user="$$DB_USER" -v app_password="$$DB_PASSWORD" \
          -v migrator_user="$$DB_MIGRATE_USER" -v migrator_password="$$DB_MIGRATE_PASSWORD"
        if [ -n "$${DB_ADMIN_USER:-}" ]; then
          if [ -z "$${DB_ADMIN_PASSWORD:-}" ] || same "$$DB_ADMIN_PASSWORD" "$$DB_PASSWORD" || same "$$DB_ADMIN_PASSWORD" "$$DB_MIGRATE_PASSWORD"; then
            echo "db-roles: DB_ADMIN_USER needs its own DB_ADMIN_PASSWORD" >&2; exit 1
          fi
          set -- "$$@" -v admin_user="$$DB_ADMIN_USER" -v admin_password="$$DB_ADMIN_PASSWORD"
        fi
        exec psql -X -v ON_ERROR_STOP=1 "$$@" -f /bootstrap/least-privilege-roles.sql
    environment:
      PGHOST: ${DB_HOST:-postgres}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_NAME:-openctem}
      PGSSLMODE: ${DB_SSLMODE:-require}
      PGUSER: ${DB_SUPERUSER:-${DB_USER:-openctem}}
      PGPASSWORD: ${DB_SUPERUSER_PASSWORD:-${DB_PASSWORD}}
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-}
    volumes:
      - ./postgres:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openctem
    restart: "no"
    # A psql client only: the image's postgres user, no capabilities.
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # The same script again once the migrations ran: tables a migration just
  # created (a fresh install, a release adding a table) get their grants and
  # revokes before the API starts, not on the next `up`.
  db-grants:
    <<: *db-roles
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Database migrations (one-shot, before the API), as the schema owner
  # ---------------------------------------------------------------------------
  migrate:
    image: ${MIGRATIONS_IMAGE:-ghcr.io/openctemio/migrations}:${API_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://${DB_MIGRATE_USER:-${DB_USER:-openctem}}:${DB_MIGRATE_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-openctem}?sslmode=${DB_SSLMODE:-require}"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully
    networks:
      - openctem
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # API (Go): internal only
  # ---------------------------------------------------------------------------
  api:
    image: ${API_IMAGE:-ghcr.io/openctemio/openctem-api}:${API_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    expose:
      - "8080"
    environment:
      APP_NAME: openctem
      APP_ENV: ${APP_ENV:-production}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      # The console API on its own internal listener (plain HTTP on the stack's
      # private network, never published); the
      # main listener answers 404 for /api/v1/admin. Same allow-list as the
      # gateway's console site (empty = private networks).
      ADMIN_LISTEN_ADDR: ${OPENCTEM_NET_PREFIX:-172.30.80}.12:8081
      ADMIN_ALLOWED_CIDRS: ${OPENCTEM_ADMIN_ALLOWED_CIDRS:-}
      # The console's public origin (setup.sh writes it from the console
      # address): its WebAuthn relying party. Empty it defaults to APP_URL's
      # origin, and registering a security key in the console then fails with
      # "Error validating origin".
      ADMIN_PUBLIC_URL: ${OPENCTEM_ADMIN_PUBLIC_URL:-}
      # Health page (console > Monitoring > Health): the web and gateway
      # health URLs inside the stack, and the status file backup.sh writes.
      SYSTEM_WEB_HEALTH_URL: ${SYSTEM_WEB_HEALTH_URL:-http://web:3000/api/health}
      SYSTEM_GATEWAY_HEALTH_URL: ${SYSTEM_GATEWAY_HEALTH_URL:-http://gateway:2020/health}
      SYSTEM_BACKUP_STATUS_FILE: ${SYSTEM_BACKUP_STATUS_FILE:-/backup-status/openctem_backup.prom}
      # Only the gateway, the web UI and the console may assert a client address
      # (X-Real-IP / X-Forwarded-For). Anything else is recorded as its own
      # TCP peer, so a client cannot choose the IP in the audit log.
      SERVER_TRUSTED_PROXIES: ${OPENCTEM_NET_PREFIX:-172.30.80}.10,${OPENCTEM_NET_PREFIX:-172.30.80}.11,${OPENCTEM_NET_PREFIX:-172.30.80}.13
      # The one public origin of the UI, the API and the WebSocket. The API
      # derives from it the CORS allow-list, links in e-mails, the SSO
      # (OAuth, OIDC, SAML) callback and the sensor endpoint.
      APP_URL: ${OPENCTEM_PUBLIC_URL:-https://${OPENCTEM_HOSTNAME}}
      # /metrics answers only with this bearer token; empty = metrics off. The
      # gateway never routes /metrics: scrape api:8080 from inside the network
      # (deploy/observability). openssl rand -hex 32
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Version check (docs/architecture/version-check.md): once a day the API
      # downloads the signed release feed from GitHub and compares it with its
      # own version locally. The request sends nothing about this instance;
      # GitHub sees its IP address. false = no request (air-gapped: import the
      # file in the console instead). The URL must be https.
      VERSION_CHECK_ENABLED: ${VERSION_CHECK_ENABLED:-true}
      VERSION_CHECK_URL: ${VERSION_CHECK_URL:-}
      AUTH_COOKIE_SECURE: "true"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD}
      # The console's identity tables are written with this role (db-roles).
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-}
      DB_NAME: ${DB_NAME:-openctem}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (32+ characters)}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-/datastore-tls/ca.crt}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Go's garbage collector works to stay under this, below the memory
      # limit, instead of the container being killed at the limit. Keep it
      # about 80% of API_MEMORY_LIMIT.
      GOMEMLIMIT: ${API_GOMEMLIMIT:-1600MiB}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      # Empty: derived from APP_ENCRYPTION_KEY (rotating that key then signs
      # everyone out). Set it to rotate the two independently.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required (openssl rand -hex 32)}
      # Old key(s) while rotating APP_ENCRYPTION_KEY (docs/deployment/encryption-key-rotation.md).
      APP_ENCRYPTION_KEY_PREVIOUS: ${APP_ENCRYPTION_KEY_PREVIOUS:-}
      # Master of the custom-template signing keys (unset: derived from APP_ENCRYPTION_KEY).
      APP_TEMPLATE_SIGNING_KEY: ${APP_TEMPLATE_SIGNING_KEY:-}
      # Master of the content pack signing keys (unset: derived from APP_ENCRYPTION_KEY).
      APP_CONTENT_SIGNING_KEY: ${APP_CONTENT_SIGNING_KEY:-}
      # Key of the secret-finding fingerprint (never rotated with APP_ENCRYPTION_KEY;
      # unset in development uses APP_ENCRYPTION_KEY).
      FINGERPRINT_KEY: ${FINGERPRINT_KEY:-}
      # Sign-up ceiling (no API can change it): disabled (default; accounts and
      # organizations come from the platform administrator, invitations or
      # SSO), domain (sign-up for an organization's verified domain, joins
      # that organization) or open (hosted service: anyone signs up; needs the
      # platform e-mail, and Turnstile keys or SIGNUP_CAPTCHA in production).
      SIGNUP_MODE: ${SIGNUP_MODE:-disabled}
      # Starting limits of self-service organizations (required with self_service):
      # a JSON object of limits, or unlimited.
      SELF_SERVICE_START_LIMITS: ${SELF_SERVICE_START_LIMITS:-}
      # Platform e-mail (SMTP) is set in the admin console: System > E-mail.
      # Sensors: the install snippets on the Sensors page install the
      # gateway's internal CA (TLS mode internal; the file is absent in the
      # other modes and the snippets then skip it). Each sensor product's
      # release line is built into the API (versions.yaml), not set here.
      SENSOR_CA_CERT_FILE: /ca/openctem-root-ca.crt
      # Signed jobs (docs/architecture/job-signing.md): every job handed to a
      # sensor is signed by the signer service below, reached only through
      # this socket. Production refuses to start without it.
      SIGNER_SOCKET: /run/openctem-signer/signer.sock
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-grants:
        condition: service_completed_successfully
      signer:
        condition: service_healthy
    networks:
      openctem:
        # Fixed, so the console listener can bind this private address only.
        ipv4_address: ${OPENCTEM_NET_PREFIX:-172.30.80}.12
    restart: unless-stopped
    volumes:
      - datastore-tls:/datastore-tls:ro
      # The CA the gateway exports (public certificate, read-only here).
      - ${OPENCTEM_CA_EXPORT_DIR:-./ca}:/ca:ro
      # Uploaded attachments and finding evidence (STORAGE_LOCAL_PATH,
      # ./data/attachments under /app). The root filesystem is read-only, so
      # without this volume every upload fails. Back it up with the database.
      - api-data:/app/data
      # backup.sh writes its status file here (BACKUP_STATUS_DIR); the Health
      # page reads the time of the last successful backup from it.
      - ${BACKUP_STATUS_DIR:-./backup-status}:/backup-status:ro
      # The system temp directory, on disk: uploaded archives (finding imports
      # up to 110 MB) and form files are spooled here, and feed bundles and the
      # feed cache are staged here. A small in-memory tmpfs fills up and counts
      # against the memory limit. Not backed up.
      - api-tmp:/tmp
      # The job signer's socket (never its keys).
      - signer-socket:/run/openctem-signer
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2g}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Job signer (docs/architecture/job-signing.md, RFC-040 §5.6)
  # ---------------------------------------------------------------------------
  # Signs every job the API hands a sensor. Its own container from the API
  # image, its own user, no network at all, its own key volume never mounted
  # into the API; the API reaches it only through the socket volume. The key
  # is created on first start (SIGNER_GENERATE_KEY) and its id is logged:
  # back up the signer-keys volume offline. Key sets signed by an offline
  # root (recommended: sensors then pin the root out of band) and the scope
  # ledger are described in docker-compose.job-signer.yml and job-signing.md.
  signer:
    image: ${API_IMAGE:-ghcr.io/openctemio/openctem-api}:${API_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    entrypoint: ["/app/openctem-signer"]
    command: ["serve"]
    user: "1001:1000"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SIGNER_KEY_FILE: /var/lib/openctem-signer/keys/signer.pem
      SIGNER_GENERATE_KEY: "true"
      SIGNER_SOCKET: /run/openctem-signer/signer.sock
      SIGNER_STATE_DIR: /var/lib/openctem-signer/state
      # Scope ledger: the signer signs only inside the scope people approved.
      # A new signer enforces it at once, so on an install that already has
      # scopes run the ledger bootstrap first (docker-compose.job-signer.yml)
      # or set SIGNER_LEDGER=audit in .env until it is done.
      SIGNER_LEDGER: ${SIGNER_LEDGER:-}
      # SIGNER_KEYSET_FILE: /etc/openctem-signer/keyset.json
    volumes:
      - signer-keys:/var/lib/openctem-signer/keys
      - signer-state:/var/lib/openctem-signer/state
      - signer-socket:/run/openctem-signer
      # - ./keyset.json:/etc/openctem-signer/keyset.json:ro
    healthcheck:
      test: ["CMD", "/app/openctem-signer", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${SIGNER_MEMORY_LIMIT:-256m}
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # First administrator and organization (one-off, profile "tools")
  # ---------------------------------------------------------------------------
  # bootstrap-admin creates the sign-in account in `users`, which only the
  # schema owner (DB_MIGRATE_USER) may do; the running API has DB_USER (DML
  # only) and must not be handed the owner's credentials. So it runs as its
  # own throwaway container, with the owner credentials from .env:
  #
  #   docker compose run --rm bootstrap-admin -email=admin@example.com \
  #     -backup-email=breakglass@example.com \
  #     -org-name="Example Corp" -org-owner-email=owner@example.com
  #
  # (`-h` lists every flag.) It is not started by `up`.
  bootstrap-admin:
    profiles: [tools]
    image: ${API_IMAGE:-ghcr.io/openctemio/openctem-api}:${API_VERSION:-${OPENCTEM_VERSION:-v0.11.0}}
    entrypoint: ["/app/bootstrap-admin"]
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD}
      # The schema owner. With the single-role layout (DB_MIGRATE_USER unset)
      # the tool uses DB_USER.
      DB_MIGRATE_USER: ${DB_MIGRATE_USER:-}
      DB_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:-}
      DB_NAME: ${DB_NAME:-openctem}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required (openssl rand -hex 32)}
      # The owner's set-password link points at the public address.
      APP_URL: ${OPENCTEM_PUBLIC_URL:-https://${OPENCTEM_HOSTNAME}}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - openctem
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Postgres and Redis: internal only, TLS on the internal network
  # ---------------------------------------------------------------------------
  # The API in production refuses a database or Redis connection without TLS.
  # This one-shot job gives the bundled Postgres and Redis certificates from a
  # private CA kept in the datastore-tls volume (the API verifies Redis against
  # it). Using managed Postgres/Redis instead: set DB_HOST/REDIS_HOST (and
  # REDIS_TLS_CA_FILE if their CA is not public) and drop these services.
  datastore-tls:
    image: postgres:${POSTGRES_VERSION:-17} # only for its openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cd /tls
        if [ ! -s ca.crt ]; then
          openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -subj "/CN=OpenCTEM datastore CA" -keyout ca.key -out ca.crt
        fi
        if [ -s server.crt ] && openssl x509 -checkend 2592000 -noout -in server.crt; then
          exit 0
        fi
        openssl req -newkey rsa:2048 -nodes -subj "/CN=postgres" -keyout server.key -out server.csr
        printf 'subjectAltName=DNS:postgres,DNS:redis\n' > server.ext
        openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 -extfile server.ext -out server.crt
        cp server.key postgres.key && chown 999:999 postgres.key && chmod 0600 postgres.key
        cp server.key redis.key && chown 999:1000 redis.key && chmod 0600 redis.key
        rm -f server.key server.csr server.ext
        chmod 0600 ca.key && chmod 0644 ca.crt server.crt
        echo "datastore TLS certificates issued"
    volumes:
      - datastore-tls:/tls
    network_mode: none
    restart: "no"
    # Root inside, to give each key file to the user of the server that reads
    # it: CHOWN for that, FOWNER and DAC_OVERRIDE to renew files it no longer
    # owns. Nothing else.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/postgres.key
      # Memory and planner settings sized for a host with 8 GB (the Small
      # size in docs install/sizing): PostgreSQL's built-in defaults
      # (128 MB shared_buffers, random_page_cost 4 for spinning disks) make
      # the tenant-wide aggregates read from disk and spill sorts. Scale the
      # PG_* values with the host: shared_buffers about 25% of RAM,
      # effective_cache_size about 70%.
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-2GB}
    # Parallel queries share memory through /dev/shm (64 MB by default).
    shm_size: ${PG_SHM_SIZE:-256m}
    environment:
      # The superuser exists for initdb and the db-roles job. With
      # least-privilege roles it is DB_SUPERUSER, separate from the API's
      # DB_USER; it defaults to DB_USER (the single-role layout).
      POSTGRES_USER: ${DB_SUPERUSER:-${DB_USER:-openctem}}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-${DB_PASSWORD}}
      POSTGRES_DB: ${DB_NAME:-openctem}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - datastore-tls:/tls:ro
    depends_on:
      datastore-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER:-${DB_USER:-openctem}} -d ${DB_NAME:-openctem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - openctem
    restart: unless-stopped
    # The image's entrypoint starts as root to own the data directory, then
    # runs postgres as its own user: only the capabilities for that.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-4g}
    logging: *default-logging

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    command:
      - sh
      - -c
      # Through the image's entrypoint, which owns /data for the redis user
      # and drops to it (a bare `redis-server` here would run as root).
      - >-
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        --port 0 --tls-port 6379 --tls-auth-clients no
        --tls-cert-file /tls/server.crt --tls-key-file /tls/redis.key
        --tls-ca-cert-file /tls/ca.crt
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # redis-cli reads the password from here (the healthcheck), not argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
      - datastore-tls:/tls:ro
    depends_on:
      datastore-tls:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openctem
    restart: unless-stopped
    # CHOWN and DAC_READ_SEARCH: the entrypoint gives /data to redis, also
    # files an older stack wrote as root in 0700 directories; SETUID/SETGID
    # to drop to that user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-1g}
    logging: *default-logging

volumes:
  api-data:
  api-tmp:
  datastore-tls:
  gateway-data:
  gateway-config:
  postgres-data:
  redis-data:
  signer-keys:
  signer-state:
  signer-socket:

networks:
  openctem:
    ipam:
      config:
        # Fixed so the API can trust exactly the gateway (.10) and web (.11).
        # Change OPENCTEM_NET_PREFIX if it overlaps a network on your host.
        - subnet: ${OPENCTEM_NET_PREFIX:-172.30.80}.0/24
