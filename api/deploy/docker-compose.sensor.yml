# Bundled sensor as a shared sensor of the instance
# (docs/rfcs/RFC-100-shared-sensors.md §7): an optional overlay. The sensor
# belongs to the instance, not to an organization, and enrolls without anyone
# approving it, using the single-use token in SENSOR_INSTANCE_ENROLLMENT_TOKEN
# (setup.sh writes one into .env: octe_ and 49 letters or digits).
#
#   docker compose -f docker-compose.yml -f docker-compose.sensor.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.sensor.yml logs sensor
#     # "Enrolled: shared sensor ..."
#
# - sensor-enrollment runs once per `up` after the migrations:
#   `bootstrap-admin sensor-token -from-env SENSOR_INSTANCE_ENROLLMENT_TOKEN`
#   stores the token's keyed hash (valid one hour, single use, audited in the
#   console). A value already registered is left alone.
# - The sensor enrolls on first start with its own key and keeps its identity
#   in the sensor-data volume; afterwards it ignores the token. Back that
#   volume up like a credential.
# - Shared mode (SENSOR_SHARED_MODE=1): every tool runs sandboxed and
#   network-confined, with a fresh task directory per job, and the sensor
#   refuses to start without the tool sandbox, network confinement and a
#   local policy (./sensor/sensor-policy.yaml, which setup.sh copies from
#   sensor/sensor-policy.example.yaml: public targets only by default).
#   The platform dispatches shared jobs only to a sensor that advertises
#   shared.isolation@1, which a sensor image built with the shared-mode SDK
#   does once it confirms that isolation at runtime. A sensor image without
#   it (v0.23.0 and older) enrolls but receives no shared job.
# - What the sandbox needs, and nothing more: the sensor gives each task its
#   own user, network and mount namespaces as its own non-root user
#   (unprivileged user namespaces). No capability is added (cap_drop: ALL,
#   no-new-privileges, read-only root filesystem). The runtime's default
#   seccomp profile refuses namespace flags without CAP_SYS_ADMIN, so the
#   sensor runs under sensor/seccomp.json: the sensor release's own profile
#   (sensor repository docker/seccomp/sensor.json at v0.23.0, sha256
#   97d0b0a8292012537f2474b6c200ea49bef1239a306bc6e7e8a2afe15a3895a8), which
#   is Docker's default profile plus clone/unshare with namespace flags. The
#   tools cannot use that rule: the sensor's per-task seccomp filter refuses
#   namespace creation to every tool. Keep Docker's default AppArmor profile
#   (apparmor=unconfined breaks confinement on Ubuntu), and the host must
#   allow unprivileged user namespaces (the kernel default; on Ubuntu 24.04
#   the AppArmor userns restriction applies to unconfined processes only).
#   On a host that cannot confine, the sensor refuses to start and says why.
# - Network: the sensor sits on its own bridge, sensor-net, and nowhere else.
#   Only the gateway is attached to both networks, under the name of
#   OPENCTEM_HOSTNAME, so the sensor reaches the platform at the same
#   https://<OPENCTEM_HOSTNAME> every other client uses (sensor SDK releases
#   from v0.35.0 refuse plain http to a host that is not loopback) and the
#   internet for public scans. It cannot resolve or connect to postgres,
#   redis, the signer, the api or the console service: a hostile scan response
#   that takes over the sensor process finds no datastore to talk to. The
#   gateway's console site shares the gateway's address; it answers the
#   private networks (OPENCTEM_ADMIN_ALLOWED_CIDRS) and its own sign-in, and
#   serves nothing to a sensor request. sensor-enrollment keeps the openctem
#   network because it writes the token hash to Postgres; it is a one-shot job
#   and not reachable from the sensor.
# - TLS: with OPENCTEM_TLS_MODE=internal (default) the sensor trusts the
#   gateway's internal CA, which the gateway exports to ./ca
#   (SENSOR_CA_CERT_FILE, added to the system roots). With acme or files, the
#   certificate is already publicly trusted or yours: set SENSOR_CA_CERT_FILE=
#   (empty) in .env, or point it at your CA file under /ca. OPENCTEM_HOSTNAME
#   must be a DNS name the sensor can resolve to the gateway (the network
#   alias); an IP address works only when the host's published port 443 is
#   reachable from containers on that IP.
# - Limits: SENSOR_MEMORY_LIMIT (default 2g), SENSOR_CPUS (default 2) and
#   SENSOR_PIDS_LIMIT (default 512) bound a runaway scanner. The sensor image
#   has no health probe command yet, so there is no container healthcheck;
#   restart: unless-stopped and the console's sensor status cover liveness.
# - A shared sensor takes no organization's jobs until a super administrator
#   turns shared sensors on (Console > System > Platform scanning).
# - Token expired before the sensor enrolled: put a new value in .env
#   (octe_ and 49 letters or digits) and run the `up` again.
#
# An existing install whose sensor was paired as an organization sensor keeps
# it: this overlay is new, and a sensor's scope is fixed when it is created.
# To replace that sensor with a shared one, retire it under Sensors, stop it,
# and start this overlay (its sensor-data volume is a fresh identity).
services:
  sensor-enrollment:
    image: ${API_IMAGE:-ghcr.io/openctemio/openctem-api}:${API_VERSION:-${OPENCTEM_VERSION:-v0.12.0}}
    entrypoint: ["/app/bootstrap-admin"]
    command:
      - "sensor-token"
      - "-from-env"
      - "SENSOR_INSTANCE_ENROLLMENT_TOKEN"
      - "-name=${SENSOR_NAME:-bundled-sensor}"
      - "-reason=bundled sensor of the compose install"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-openctem}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-openctem}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      # The token is stored as the keyed hash the API checks.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required (openssl rand -hex 32)}
      SENSOR_KEY_PEPPER: ${SENSOR_KEY_PEPPER:-}
      SENSOR_INSTANCE_ENROLLMENT_TOKEN: ${SENSOR_INSTANCE_ENROLLMENT_TOKEN:?SENSOR_INSTANCE_ENROLLMENT_TOKEN is required (setup.sh writes it)}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - openctem
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  sensor:
    image: ${SENSOR_IMAGE:-ghcr.io/openctemio/sensor}:${SENSOR_VERSION:-v0.23.2}
    environment:
      # The gateway, over https, like every other client. The gateway's
      # network alias on sensor-net is OPENCTEM_HOSTNAME.
      SENSOR_API_URL: https://${OPENCTEM_HOSTNAME:?OPENCTEM_HOSTNAME is required (DNS name or IP clients use)}
      # The gateway's internal CA (TLS mode internal). Set it empty for a
      # publicly trusted certificate.
      SENSOR_CA_CERT_FILE: ${SENSOR_CA_CERT_FILE-/ca/openctem-root-ca.crt}
      SENSOR_NAME: ${SENSOR_NAME:-bundled-sensor}
      SENSOR_REGION: ${SENSOR_REGION:-default}
      SENSOR_INSTANCE_ENROLLMENT_TOKEN: ${SENSOR_INSTANCE_ENROLLMENT_TOKEN:?SENSOR_INSTANCE_ENROLLMENT_TOKEN is required (setup.sh writes it)}
      # The job signer's public key, written by the signer to a volume the
      # API does not mount: the sensor pins it instead of trusting the key
      # the API serves first. A sensor older than the release that reads
      # *_FILE ignores this variable and keeps its current behaviour. For
      # production use the offline root instead (SENSOR_JOB_SIGNING_ROOT).
      SENSOR_JOB_SIGNING_KEYS_FILE: /etc/openctem/signer-pub/signer.pub
      SENSOR_STATE_DIR: /var/lib/openctem/state
      SENSOR_CONTENT_DIR: /var/lib/openctem/content
      SENSOR_OUTBOX_DIR: /var/lib/openctem/outbox
      # Shared mode: sandbox and network confinement required, a local
      # policy required, per-job task directories.
      SENSOR_SHARED_MODE: "1"
      SENSOR_SANDBOX: required
      SENSOR_SANDBOX_NETWORK: required
      SENSOR_LOCAL_POLICY: /etc/openctem/sensor-policy.yaml
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
    depends_on:
      sensor-enrollment:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    networks:
      - sensor-net
    restart: unless-stopped
    volumes:
      # The sensor's identity (state/), queued results (outbox/) and scanner
      # cache (content/). It holds a credential: back it up like one.
      - sensor-data:/var/lib/openctem
      # The network owner's local policy, read-only.
      - ./sensor/sensor-policy.yaml:/etc/openctem/sensor-policy.yaml:ro
      # The signer's public key (signer.pub), read-only. Only the signer
      # writes this volume; the API never mounts it.
      - signer-pub:/etc/openctem/signer-pub:ro
      # The gateway's internal CA certificate (public), read-only.
      - ${OPENCTEM_CA_EXPORT_DIR:-./ca}:/ca:ro
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./sensor/seccomp.json
    deploy:
      resources:
        limits:
          memory: ${SENSOR_MEMORY_LIMIT:-2g}
          cpus: ${SENSOR_CPUS:-2}
          pids: ${SENSOR_PIDS_LIMIT:-512}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # The gateway answers the sensor on both networks, under the platform's
  # host name; the sensor's network holds nothing else of the stack.
  gateway:
    networks:
      sensor-net:
        aliases:
          - ${OPENCTEM_HOSTNAME}

networks:
  sensor-net:
    driver: bridge

volumes:
  sensor-data:
  signer-pub:
