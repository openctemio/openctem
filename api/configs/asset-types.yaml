    # can be matched (RFC-042 §6.3.8 T4a: `endpoint` was a type of its own).
    sub_types: [compute, serverless, workstation]
    sub_type_inputs:
      server: {}
      linux: { attributes: { os_family: linux } }
      windows: { attributes: { os_family: windows } }
      macos: { attributes: { os_family: macos } }
      bsd: { attributes: { os_family: bsd } }
