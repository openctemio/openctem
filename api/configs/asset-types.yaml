# Core fields every type shares (RFC-042 §6.3.4). Row columns may name a core
# field or one of the type's own attributes.
core_fields: [name, type, sub_type, class, lens, criticality, effective_criticality, exposure, owner, labels, findings.open, first_seen, last_seen, status]

# Identity keys: RFC-028 identifier kinds (pkg/domain/asset/identifier.go),
# `name` (exact canonical name) or `attr.<attribute>` for a type attribute.
# Listed in match order; every type ends with `name`.
identity_kinds: [host_id, cloud_id, bios_uuid, serial_number, mac, scm_repo_id, fqdn, hostname, ip]

# Property schema (RFC-042 §6.3.9). An asset's free-form `properties` hold
# the attributes of its type (`attributes` of each type below) plus the
# platform keys every type may carry (`common_properties`). Every key either
# may hold is declared once in `properties`, with:
#
#   - label / label_vi: what the web shows (English and Vietnamese);
#   - format: how a value is shown beyond its attribute type: `ip` (each
#     value is an IP address and links to that IP asset), `url` (an http(s)
#     link) or `code` (an identifier, shown monospace);
#   - synonyms: other keys scanners and older code wrote for the same thing.
#     Every write path (ingest, REST, import) folds a synonym into the
#     canonical key and drops it; readers use the helpers of
#     pkg/domain/asset/properties.go, never a key list of their own. Only a
#     string or list value folds: an object under a synonym (the CTIS
#     technical `ip_address` block) stays where it is;
#   - classes: when set, only assets of these classes may hold the key. A
#     report that puts one on another asset (a port on a domain) has it
#     routed to the asset it belongs to (a `host:port` service), never
#     stored on the wrong type.
#
# A key outside the schema is a third-party or custom key. Ingest keeps it
# and logs it; new ones should use the `x_` prefix (x_native_sub_type is the
# platform's own). The web shows such keys under "Other".
common_properties: [discovery_source, discovery_tool, aliases, identity_hints, x_native_sub_type, business_impact_score, business_impact_notes, domain, ip_address, service, certificate]

properties:
  ip_addresses: { label: IP addresses, label_vi: Địa chỉ IP, format: ip, synonyms: [ip, ips, ip_address, resolved_ip, resolved_ips, addresses] }
  private_ip: { label: Private IP, label_vi: IP nội bộ, format: ip }
