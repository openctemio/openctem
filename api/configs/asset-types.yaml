    label: Domain
    lens: external_surface
  - id: ip_address
    label: IP address
    lens: external_surface
  - id: certificate
    label: Certificate
    lens: external_surface
  - id: service
    label: Service
    lens: external_surface
  - id: web_endpoint
    label: Web endpoint
    lens: external_surface
  - id: application
    label: Application
    lens: applications
  - id: host
    label: Host
    lens: cloud_infra
  - id: function
    label: Function
    lens: cloud_infra
  - id: cloud_account
    label: Cloud account
    lens: cloud_infra
  - id: container
    label: Container
    lens: containers_k8s
  - id: cluster
    label: Cluster
    lens: containers_k8s
  - id: artifact_registry
    label: Artifact registry
    lens: containers_k8s
  - id: code_repo
    label: Code repository
    lens: code
  - id: identity
    label: Identity
    lens: identities
  - id: data_store
    label: Data store
    lens: data
  - id: network
    label: Network
    lens: network
  - id: other
    label: Other

