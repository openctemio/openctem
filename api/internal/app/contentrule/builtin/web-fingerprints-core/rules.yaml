# Web fingerprint rules, core pack. Written for this project from what each
# product says about itself in its own responses (the Server header it
# documents, its session cookie name, its page title, the generator tag and
# asset paths it writes). Format: docs/architecture/rule-packs.md.
schema: 1
rules:
  # Web servers and proxies, from the Server header.
  - id: nginx
    name: nginx
    technology: {name: nginx, category: web_server, cpe: "cpe:2.3:a:f5:nginx:{version}:*:*:*:*:*:*:*"}
    confidence: 90
    matchers:
      - location: header
        header: server
        keywords: [nginx]
        pattern: '(?i)^nginx(?:/(?P<version>\d+(?:\.\d+){1,3}))?'
  - id: apache-http-server
    name: Apache HTTP Server
    technology: {name: Apache HTTP Server, category: web_server, cpe: "cpe:2.3:a:apache:http_server:{version}:*:*:*:*:*:*:*"}
    confidence: 90
    matchers:
      - location: header
        header: server
        keywords: [apache]
        pattern: '(?i)^apache(?:/(?P<version>\d+\.\d+(?:\.\d+)?))?(?:\s|$)'
  - id: apache-tomcat
    name: Apache Tomcat
    technology: {name: Apache Tomcat, category: web_server, cpe: "cpe:2.3:a:apache:tomcat:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [apache-coyote]
      - location: title
        keywords: [tomcat]
        pattern: '(?i)apache tomcat(?:/(?P<version>\d+\.\d+(?:\.\d+)?))?'
  - id: microsoft-iis
    name: Microsoft IIS
    technology: {name: Microsoft IIS, category: web_server, cpe: "cpe:2.3:a:microsoft:internet_information_services:{version}:*:*:*:*:*:*:*"}
    confidence: 90
    matchers:
      - location: header
        header: server
        keywords: [microsoft-iis]
        pattern: '(?i)microsoft-iis(?:/(?P<version>\d+\.\d+))?'
  - id: litespeed
    name: LiteSpeed
    technology: {name: LiteSpeed, category: web_server, cpe: "cpe:2.3:a:litespeedtech:litespeed_web_server:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [litespeed]
  - id: openresty
    name: OpenResty
    technology: {name: OpenResty, category: web_server, cpe: "cpe:2.3:a:openresty:openresty:{version}:*:*:*:*:*:*:*"}
    confidence: 90
    matchers:
      - location: header
        header: server
        keywords: [openresty]
        pattern: '(?i)openresty(?:/(?P<version>\d+(?:\.\d+){1,3}))?'
  - id: caddy
    name: Caddy
    technology: {name: Caddy, category: web_server, cpe: "cpe:2.3:a:caddyserver:caddy:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [caddy]
        pattern: '(?i)^caddy\b'
  - id: envoy
    name: Envoy
    technology: {name: Envoy, category: web_server, cpe: "cpe:2.3:a:envoyproxy:envoy:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [envoy]
        pattern: '(?i)^envoy\b'
  - id: jetty
    name: Jetty
    technology: {name: Jetty, category: web_server, cpe: "cpe:2.3:a:eclipse:jetty:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [jetty]
        pattern: '(?i)jetty(?:\((?P<version>\d+(?:\.\d+){1,3}))?'
  - id: gunicorn
    name: Gunicorn
    technology: {name: Gunicorn, category: web_server, cpe: "cpe:2.3:a:gunicorn:gunicorn:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [gunicorn]
        pattern: '(?i)gunicorn(?:/(?P<version>\d+(?:\.\d+){1,2}))?'
  - id: werkzeug
    name: Werkzeug
    technology: {name: Werkzeug, category: framework, cpe: "cpe:2.3:a:palletsprojects:werkzeug:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: header
        header: server
        keywords: [werkzeug]
        pattern: '(?i)werkzeug(?:/(?P<version>\d+(?:\.\d+){1,2}))?'
  - id: kestrel
    name: Kestrel
    technology: {name: Kestrel, category: web_server}
    matchers:
      - location: header
        header: server
        keywords: [kestrel]
        pattern: '(?i)^kestrel\b'
  - id: cloudflare
    name: Cloudflare
    technology: {name: Cloudflare, category: cdn}
    confidence: 90
    matchers:
      - location: header
        header: server
        keywords: [cloudflare]
        pattern: '(?i)^cloudflare\b'
      - location: cookie
        keywords: [__cf_bm, __cfruid]
  - id: amazon-s3
    name: Amazon S3
    technology: {name: Amazon S3, category: hosting}
    matchers:
      - location: header
        header: server
        keywords: [amazons3]
  - id: google-frontend
    name: Google Frontend
    technology: {name: Google Frontend, category: hosting}
    matchers:
      - location: header
        header: server
        keywords: [google frontend]
  - id: aws-elb
    name: AWS Elastic Load Balancing
    technology: {name: AWS Elastic Load Balancing, category: hosting}
    matchers:
      - location: cookie
        keywords: [awsalb, awselb]
        pattern: '(?i)^awsel?b(?:cors)?$'

  # Languages and frameworks, from the session cookie they name.
  - id: php
    name: PHP
    technology: {name: PHP, category: language}
    matchers:
      - location: cookie
        keywords: [phpsessid]
        pattern: '(?i)^phpsessid$'
  - id: java
    name: Java
    technology: {name: Java, category: language}
    confidence: 60
    matchers:
      - location: cookie
        keywords: [jsessionid]
        pattern: '(?i)^jsessionid$'
  - id: aspnet
    name: Microsoft ASP.NET
    technology: {name: Microsoft ASP.NET, category: framework, cpe: "cpe:2.3:a:microsoft:asp.net:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: cookie
        keywords: [asp.net_sessionid, aspxauth]
  - id: laravel
    name: Laravel
    technology: {name: Laravel, category: framework, cpe: "cpe:2.3:a:laravel:laravel:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: cookie
        keywords: [laravel_session]
  - id: codeigniter
    name: CodeIgniter
    technology: {name: CodeIgniter, category: framework, cpe: "cpe:2.3:a:codeigniter:codeigniter:{version}:*:*:*:*:*:*:*"}
    confidence: 60
    matchers:
      - location: cookie
        keywords: [ci_session]
        pattern: '(?i)^ci_session$'
  - id: django
    name: Django
    technology: {name: Django, category: framework, cpe: "cpe:2.3:a:djangoproject:django:{version}:*:*:*:*:*:*:*"}
    confidence: 50
    condition: all
    matchers:
      - location: cookie
        keywords: [csrftoken]
        pattern: '(?i)^csrftoken$'
      - location: cookie
        keywords: [sessionid]
        pattern: '(?i)^sessionid$'
  - id: express
    name: Express
    technology: {name: Express, category: framework}
    confidence: 60
    matchers:
      - location: cookie
        keywords: [connect.sid]
  - id: wordpress
    name: WordPress
    technology: {name: WordPress, category: framework, cpe: "cpe:2.3:a:wordpress:wordpress:{version}:*:*:*:*:*:*:*"}
    confidence: 90
    matchers:
      - location: body
        keywords: [generator]
        pattern: '(?i)<meta[^>]{0,64}name=["'']generator["''][^>]{0,64}content=["'']wordpress(?: (?P<version>\d+(?:\.\d+){1,2}))?'
      - location: body
        keywords: [/wp-content/, /wp-includes/]
      - location: script
        keywords: [/wp-content/, /wp-includes/]
      - location: cookie
        keywords: [wordpress_logged_in, wp-settings]
  - id: drupal
    name: Drupal
    technology: {name: Drupal, category: framework, cpe: "cpe:2.3:a:drupal:drupal:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: body
        keywords: [generator]
        pattern: '(?i)<meta[^>]{0,64}name=["'']generator["''][^>]{0,64}content=["'']drupal(?: (?P<version>\d+(?:\.\d+){0,2}))?'
      - location: script
        keywords: [/sites/default/files/, /core/misc/drupal.js]
  - id: joomla
    name: Joomla
    technology: {name: Joomla, category: framework}
    matchers:
      - location: body
        keywords: [generator]
        pattern: '(?i)<meta[^>]{0,64}name=["'']generator["''][^>]{0,64}content=["'']joomla!?'
  - id: nextjs
    name: Next.js
    technology: {name: Next.js, category: framework}
    matchers:
      - location: body
        keywords: [__next_data__]
      - location: script
        keywords: [/_next/static/]
  - id: nuxtjs
    name: Nuxt.js
    technology: {name: Nuxt.js, category: framework}
    matchers:
      - location: body
        keywords: [window.__nuxt__]
      - location: script
        keywords: [/_nuxt/]
  - id: angular
    name: Angular
    technology: {name: Angular, category: js_library}
    matchers:
      - location: body
        keywords: [ng-version]
        pattern: 'ng-version="(?P<version>\d+(?:\.\d+){1,2})"'
  - id: jquery
    name: jQuery
    technology: {name: jQuery, category: js_library, cpe: "cpe:2.3:a:jquery:jquery:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: script
        keywords: [jquery]
        pattern: '(?i)jquery[.-](?P<version>\d+\.\d+\.\d+)(?:\.min)?\.js'
      - location: body
        keywords: [jquery v]
        pattern: '(?i)jquery v(?P<version>\d+\.\d+\.\d+)'

  # Applications, from their own page title.
  - id: grafana
    name: Grafana
    technology: {name: Grafana, category: other, cpe: "cpe:2.3:a:grafana:grafana:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [grafana]
        pattern: '(?i)^grafana$'
  - id: jenkins
    name: Jenkins
    technology: {name: Jenkins, category: other, cpe: "cpe:2.3:a:jenkins:jenkins:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [jenkins]
        pattern: '(?i)\[jenkins\]|^jenkins$|sign in \[jenkins\]'
  - id: gitlab
    name: GitLab
    technology: {name: GitLab, category: other, cpe: "cpe:2.3:a:gitlab:gitlab:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [gitlab]
        pattern: '(?i)(?:sign in|signin) . gitlab$'
  - id: kibana
    name: Kibana
    technology: {name: Kibana, category: other, cpe: "cpe:2.3:a:elastic:kibana:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [kibana]
        pattern: '(?i)^(?:elastic|kibana)$'
  - id: phpmyadmin
    name: phpMyAdmin
    technology: {name: phpMyAdmin, category: other, cpe: "cpe:2.3:a:phpmyadmin:phpmyadmin:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [phpmyadmin]
  - id: roundcube
    name: Roundcube Webmail
    technology: {name: Roundcube Webmail, category: framework, cpe: "cpe:2.3:a:roundcube:webmail:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [roundcube webmail]
  - id: rabbitmq-management
    name: RabbitMQ Management
    technology: {name: RabbitMQ, category: other, cpe: "cpe:2.3:a:vmware:rabbitmq:{version}:*:*:*:*:*:*:*"}
    matchers:
      - location: title
        keywords: [rabbitmq management]
  - id: swagger-ui
    name: Swagger UI
    technology: {name: Swagger UI, category: js_library}
    matchers:
      - location: title
        keywords: [swagger ui]
      - location: script
        keywords: [swagger-ui-bundle.js]
