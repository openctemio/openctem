    type: string
    description: "`openctem-signer`: burst of `SIGNER_TENANT_RATE`."
  - name: SIGNER_TENANT_RATE
    component: tool
    group: "Administration tools"
    type: string
    description: "`openctem-signer`: signatures per second allowed per organization."
  - name: BACKEND_API_URL
    component: web
    group: "Web console"
    type: string
    default: "http://localhost:8080"
    required: yes
    description: "Internal URL of the API. The console proxies the browser's `/api/v1` calls and the WebSocket upgrade to it. Compose: `http://api:8080`."
  - name: SECURE_COOKIES
    component: web
    group: "Web console"
    type: string
    default: "true"
    description: "`Secure` flag on the cookies the console sets. Only `false` turns it off (local `http://` development)."
  - name: TRUST_PROXY_HEADERS
    component: web
    group: "Web console"
    type: string
    default: "false"
    description: "Forward `X-Real-IP` / `X-Forwarded-For` to the API. Set `true` only when a proxy in front of the console overwrites those headers (the gateway does), otherwise a browser could choose its own address."
  - name: COOKIE_MAX_AGE
    component: web
    group: "Web console"
    type: string
    default: "604800"
    description: "Lifetime in seconds of the session cookies the console sets."
  - name: NODE_ENV
    component: web
    group: "Web console"
    type: string
    default: "production"
    description: "Node.js environment."
  - name: PORT
    component: web
    group: "Web console"
    type: string
    default: "3000"
    description: "Listen port and address of the console."
  - name: HOSTNAME
    component: web
    group: "Web console"
    type: string
    default: "0.0.0.0"
    description: "Listen address of the console."
  - name: NEXT_PUBLIC_APP_URL
    component: web
    group: "Web console"
    type: string
    default: "http://localhost:3000"
    description: "Public origin of the console, used for the Content-Security-Policy and auth redirects. Set to the platform's public URL."
  - name: NEXT_PUBLIC_WS_BASE_URL
    component: web
    group: "Web console"
    type: string
    description: "WebSocket base URL. Unset: the console's own origin."
  - name: NEXT_PUBLIC_SENTRY_DSN
    component: web
    group: "Web console"
    type: string
    description: "Sentry DSN for browser and server error reporting. Unset: off."
  - name: NEXT_PUBLIC_APP_DESCRIPTION
    component: web
    group: "Web console"
    type: string
    description: "Page description meta tag."
  - name: NEXT_PUBLIC_COOKIE_DOMAIN
    component: web
    group: "Web console"
    type: string
    description: "Cookie domain for the console's cookies. Unset: the host only."
  - name: NEXT_PUBLIC_ENABLE_SIDEBAR_BADGES
    component: web
    group: "Web console"
    type: string
    default: "false"
    description: "Show live count badges in the sidebar."
  - name: NEXT_ALLOWED_DEV_ORIGINS
    component: web
    group: "Web console"
    type: string
    description: "Development server only: extra origins allowed to load the dev bundle."
  - name: OPENCTEM_TLS_MODE
    component: gateway
    group: "Gateway"
    type: string
    default: "none in the entrypoint (`internal` in Compose and the all-in-one image)"
    required: yes
    description: "`internal`, `acme`, `files` or `http`."
  - name: ACME_EMAIL
    component: gateway
    group: "Gateway"
    type: string
    description: "Let's Encrypt account contact."
  - name: ACME_CA
    component: gateway
    group: "Gateway"
    type: string
    default: "Let's Encrypt production directory"
    description: "ACME directory URL, for example a staging or private ACME CA."
  - name: TLS_CERT_FILE
    component: gateway
    group: "Gateway"
    type: string
    default: "tls.crt"
    description: "File name of the certificate (full chain, PEM) inside `OPENCTEM_CERT_DIR`."
  - name: TLS_KEY_FILE
    component: gateway
    group: "Gateway"
    type: string
    default: "tls.key"
    description: "File name of the key (PEM) inside `OPENCTEM_CERT_DIR`."
  - name: OPENCTEM_CERT_DIR
    component: gateway
    group: "Gateway"
    type: string
    default: "/certs"
    description: "Directory holding the certificate in mode `files`."
  - name: OPENCTEM_ALLOW_PLAIN_HTTP
    component: gateway
    group: "Gateway"
    type: string
    default: "false"
    description: "Must be `true` for mode `http`, which serves plain HTTP behind your own TLS proxy."
  - name: OPENCTEM_TRUSTED_PROXIES
    component: gateway
    group: "Gateway"
    type: string
    default: "127.0.0.1/32"
    description: "Space-separated CIDRs of proxies in front of the gateway whose `X-Forwarded-For` it believes."
  - name: OPENCTEM_CLIENT_IP_HEADERS
    component: gateway
    group: "Gateway"
    type: string
    default: "X-Forwarded-For"
    description: "Header(s) a proxy in `OPENCTEM_TRUSTED_PROXIES` carries the client address in, tried in order: `X-Forwarded-For` (read right to left), `Cf-Connecting-Ip` (Cloudflare Tunnel) or `True-Client-Ip`. Ignored from any other peer; the gateway then sends the API only the resolved address."
  - name: GATEWAY_MAX_BODY_SIZE
    component: gateway
    group: "Gateway"
    type: string
    default: "256MB"
    description: "Largest request body the gateway accepts. The API enforces the per-route limits."
  - name: AUTH_COOKIE_NAME
    component: gateway
    group: "Gateway"
    type: string
    default: "auth_token"
    description: "Session cookie name used by the routing rule that sends token clients to the API."
  - name: OPENCTEM_GATEWAY_DIR
    component: gateway
    group: "Gateway"
    type: string
    default: "/etc/caddy"
    description: "Directory with `Caddyfile`, `planes.caddy` and `modes/`."
  - name: XDG_DATA_HOME
    component: gateway
    group: "Gateway"
    type: string
    default: "/data"
    description: "Caddy storage: certificates, ACME account, internal CA. Keep it on a volume."
  - name: OPENCTEM_API_UPSTREAM
    component: gateway
    group: "Gateway"
    type: string
    default: "api:8080"
    description: "Address of the API."
  - name: OPENCTEM_WEB_UPSTREAM
    component: gateway
    group: "Gateway"
    type: string
    default: "web:3000"
    description: "Address of the web console."
  - name: OPENCTEM_SENSOR_GATEWAY
    component: gateway
    group: "Gateway"
    type: enum
    values: [off, alpn, passthrough]
    default: "off"
    description: "Sensor protocol v3 routing: `alpn` passes connections that offer the sensor ALPN id to the API's sensor listener; `passthrough` also routes a dedicated sensor host name (`SENSOR_PUBLIC_HOSTNAME`). Needs a TLS mode and the gateway image with the layer4 module."
  - name: SENSOR_PUBLIC_HOSTNAME
    component: gateway
    group: "Gateway"
    type: string
    description: "Dedicated DNS name sensors dial for protocol v3 (no port), with `OPENCTEM_SENSOR_GATEWAY=passthrough`."
  - name: SENSOR_MTLS_UPSTREAM
    component: gateway
    group: "Gateway"
    type: string
    default: "api:8443"
    description: "Address of the API's sensor listener the gateway passes sensor connections to."
  - name: OPENCTEM_HOSTNAME
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "none"
    required: yes
    description: "DNS name or IP address browsers and sensors use; the gateway certificate is issued for it."
  - name: OPENCTEM_CA_EXPORT_DIR
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "./ca"
    description: "Host directory the internal root CA is exported to."
  - name: OPENCTEM_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "none"
    required: yes
    description: "Release tag of the API, web and migrations images, for example `v0.9.0`."
  - name: OPENCTEM_PUBLIC_URL
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "https://<OPENCTEM_HOSTNAME>"
    required: yes
    description: "Exact origin browsers use, when it is not `https://<OPENCTEM_HOSTNAME>` (a port other than 443). Passed to the API as `APP_URL`."
  - name: API_IMAGE
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "ghcr.io/openctemio/openctem-api"
    description: "Image repository of the API."
  - name: UI_IMAGE
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "ghcr.io/openctemio/openctem-web"
    description: "Image repository of the web console."
  - name: MIGRATIONS_IMAGE
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "ghcr.io/openctemio/migrations"
    description: "Image repository of the migrations job."
  - name: API_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "OPENCTEM_VERSION"
    description: "Per-image tag override. Leave unset."
  - name: UI_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "OPENCTEM_VERSION"
    description: "Per-image tag override. Leave unset."
  - name: GATEWAY_BIND
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "0.0.0.0"
    description: "Host interface the gateway port is published on."
  - name: GATEWAY_HTTPS_PORT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "443"
    description: "Published HTTPS port."
  - name: GATEWAY_HTTP_PORT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "80"
    description: "Port published by the overlays."
  - name: TLS_CERT_DIR
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "./certs"
    description: "Host directory mounted at `/certs` (mode `files`)."
  - name: OPENCTEM_NET_PREFIX
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "172.30.80"
    description: "First three octets of the internal `/24`. The gateway is `.10`, the web console `.11`."
  - name: CADDY_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "2.11.4-alpine"
    description: "Image tag of the bundled gateway."
  - name: POSTGRES_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "17"
    description: "Image tag of the bundled PostgreSQL."
  - name: REDIS_VERSION
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "7-alpine"
    description: "Image tag of the bundled Redis."
  - name: DB_SUPERUSER
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "DB_USER"
    description: "PostgreSQL superuser, used only by `initdb` and the `db-roles` job."
  - name: DB_SUPERUSER_PASSWORD
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "DB_PASSWORD"
    secret: true
    description: "Password of `DB_SUPERUSER`."
  - name: DB_MIGRATE_USER
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "unset"
    description: "Schema-owner role the migrations run as. Set to turn on the least-privilege layout."
  - name: DB_MIGRATE_PASSWORD
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "unset"
    secret: true
    description: "Password of `DB_MIGRATE_USER`."
  - name: API_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "2g"
    description: "Memory limit of the `api` container."
  - name: WEB_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "1g"
    description: "Memory limit of the `web` container."
  - name: GATEWAY_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "512m"
    description: "Memory limit of the `gateway` container."
  - name: API_GOMEMLIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "1600MiB"
    description: "`GOMEMLIMIT` of the `api` container: the Go runtime collects garbage to stay below it. Keep it about 80% of `API_MEMORY_LIMIT`."
  - name: POSTGRES_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "4g"
    description: "Memory limit of the bundled `postgres` container; keep it above `shared_buffers` plus connections times `work_mem`."
  - name: REDIS_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "1g"
    description: "Memory limit of the bundled `redis` container."
  - name: SIGNER_MEMORY_LIMIT
    component: compose
    group: "Docker Compose stack"
    type: string
    default: "256m"
    description: "Memory limit of the `signer` container (`docker-compose.job-signer.yml`)."
  - name: GATEWAY
    component: allinone
    group: "All-in-one image"
    type: string
    default: "on"
    description: "`on`: only the gateway listens on a routable address (port 443); the API and console bind to `127.0.0.1`. `off`: the API listens on 8080 and the console on 3000, without the gateway."
  - name: MIGRATE_ON_START
    component: allinone
    group: "All-in-one image"
    type: string
    default: "true"
    description: "Apply database migrations before starting, under a PostgreSQL advisory lock so several replicas do not migrate at once."
  - name: DATABASE_MIGRATE_URL
    component: allinone
    group: "All-in-one image"
    type: string
    default: "built from `DB_MIGRATE_USER` / `DB_MIGRATE_PASSWORD`"
    description: "Connection URL of the schema owner for the start-up migrations. A password in it must be percent-encoded; the URL built from `DB_MIGRATE_USER` / `DB_MIGRATE_PASSWORD` is encoded for you."
  - name: WEB_HOSTNAME
    component: allinone
    group: "All-in-one image"
    type: string
    default: "127.0.0.1"
    description: "Listen address of the web console."
