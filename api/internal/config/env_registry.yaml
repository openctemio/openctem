    description: "Create accounts on first sign-in through the fallback."
  - name: SSO_ENTRA_CLIENT_ID
    component: api
    group: "Single sign-on and social login"
    type: string
    description: "Application (client) ID of the fallback app registration."
  - name: SSO_ENTRA_CLIENT_SECRET
    component: api
    group: "Single sign-on and social login"
    type: string
    secret: true
