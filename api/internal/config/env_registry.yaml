  - name: OAUTH_STATE_SECRET
    component: api
    group: "Single sign-on and social login"
    type: string
    secret: true
    description: "Secret that signs the OAuth `state` parameter. Unset: derived from the session secret under its own label."
  - name: SSO_ALLOWED_REDIRECT_URIS
    component: api
    group: "Single sign-on and social login"
    type: list
    default: "derived"
    description: "Comma-separated exact-match allow-list for the `redirect_uri` of the per-organization SSO flow: origins (`https://ctem.example.com`) or origin-plus-path prefixes ending in `/`. Unset: derived from `CORS_ALLOWED_ORIGINS`, `OAUTH_FRONTEND_CALLBACK_URL` and `SMTP_BASE_URL`."
  - name: SSO_ENTRA_ALLOWED_DOMAINS
