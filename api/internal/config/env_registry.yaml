  - name: MCP_OAUTH_TRUSTED_CLIENT_HOSTS
    component: api
    group: "Single sign-on and social login"
    type: list
    description: "Comma-separated hosts whose MCP client ID metadata documents every organization treats as verified. Organizations add their own on top."
  - name: CORS_ALLOWED_HEADERS
    component: api
    group: "CORS and rate limiting"
