# Environment variable registry: every variable the API server and its tools
# read, and the variables of the web console, the gateway, the Compose stack and
# the all-in-one image that may share the API's environment.
#
# The single source for:
#   - startup validation (config.Load): a set variable under one of the
#     prefixes below that is not listed here is refused with a "did you mean"
#     hint; a set api variable whose value does not parse as its type is
#     refused (secret values are never printed);
#   - api/.env.example and api/docs/configuration/environment-variables.md,
#     generated by `make env-docs` (TestEnvDocsUpToDate fails when stale);
#   - TestEnvRegistryMatchesCode: every name the api code reads is listed and
#     every api/tool entry is read, with matching literal defaults.
#
# Fields: name, component (api | tool | web | gateway | compose | allinone),
# group, type (string | int | bool | duration | float | list | url | path |
# enum), values (enum), default (as documented), required (yes | production),
# secret, example (the value api/.env.example sets for local development),
# description (Markdown, one paragraph).
#
# Retired and removed names live in config.go (retiredEnv, removedEnv).

# Prefixes the API owns: any variable under them must be listed here.
prefixes: [APP_, BRAND_, SERVER_, DB_, REDIS_, LOG_, AUTH_, SSO_, OAUTH_, KEYCLOAK_, CORS_, RATE_LIMIT_, SMTP_, STORAGE_, SENSOR_, INGEST_, SCOPE_, CERT_MONITOR_, EASM_, ASSET_, ADMIN_AUDIT_, ADMIN_SESSION_, AUDIT_, METRICS_, MCP_, AI_, WORKER_, PROGRAMFEED_, VULNFEED_, CAPTCHA_, SIGNER_, OPENCTEM_HTTPSEC_, TENANT_, INVITATION_, VERSION_CHECK_]

vars:
  - name: APP_ENV
    component: api
    group: "Application"
    type: string
    default: "production"
    example: "development"
    description: "Environment name. `production` (also when unset) turns on the production checks (TLS to PostgreSQL and Redis, strong secrets, rate limiting, secure cookies; `server -check-config` reports them). Any value other than `development` requires `APP_ENCRYPTION_KEY`, refuses the published development secrets and defaults `AUTH_COOKIE_SECURE` to `true`. Set `development` explicitly for a local or trial setup without TLS to the datastores. Up to v0.8.0 an unset value meant `development`."
  - name: APP_NAME
    component: api
    group: "Application"
    type: string
    default: "openctem"
    description: "Technical name of the service in logs. The product name users see is `BRAND_NAME`."
  - name: APP_URL
    component: api
    group: "Application"
    type: string
    example: "http://localhost:8080"
    description: "Public origin of the platform (`https://ctem.example.com`): the one URL browsers, sensors and e-mail links use. Set it in every deployment. When set, it is the default of `CORS_ALLOWED_ORIGINS`, `SMTP_BASE_URL` and `OAUTH_FRONTEND_CALLBACK_URL`, and SAML service-provider URLs and the sensor endpoint are built from it. Must be an http(s) URL without credentials, query or fragment."
  - name: DEPLOYMENT_REGION
    component: api
    group: "Application"
    type: string
    description: "Data region of this deployment (1-32 lowercase letters, digits or hyphens, e.g. `eu-central`). Every organization created here gets it, it is shown in the console and never changes. Unset: not named."
  - name: BRAND_FILE
    component: api
    group: "Brand"
    type: path
    description: "Optional YAML file with the brand settings (`name`, `short_name`, `primary_color`, `docs_url`, `website_url`, `support_url`, `support_email`, `terms_url`, `privacy_url`, `email_footer`, `powered_by`, `logo_light_file`, `logo_dark_file`, `favicon_file`; image paths relative to the file). A `BRAND_*` variable wins over the file. See `docs/architecture/brand.md`."
  - name: BRAND_NAME
    component: api
    group: "Brand"
    type: string
    description: "Default `OpenCTEM`. Product name shown in the console, emails, reports and notifications (at most 64 characters; no markup characters)."
  - name: BRAND_SHORT_NAME
    component: api
    group: "Brand"
    type: string
    description: "Short product name for narrow places (the sidebar, the browser tab). Defaults to `BRAND_NAME`."
  - name: BRAND_PRIMARY_COLOR
    component: api
    group: "Brand"
    type: string
    description: "Primary color as `#rrggbb`. Unset keeps the theme color."
  - name: BRAND_DOCS_URL
    component: api
    group: "Brand"
    type: string
    description: "Default `https://docs.openctem.io`. Documentation site (https). Documentation links in the console and API messages keep their path on this origin."
  - name: BRAND_WEBSITE_URL
    component: api
    group: "Brand"
    type: string
    description: "Default `https://openctem.io`. Product website (https)."
  - name: BRAND_SUPPORT_URL
    component: api
    group: "Brand"
    type: string
    description: "Support page (https). Unset hides the support link."
  - name: BRAND_SUPPORT_EMAIL
    component: api
    group: "Brand"
    type: string
    description: "Default `info@openctem.io`. Support email address."
  - name: BRAND_TERMS_URL
    component: api
    group: "Brand"
    type: string
    description: "Terms of service (https). The admin console legal settings win when set there."
  - name: BRAND_PRIVACY_URL
    component: api
    group: "Brand"
    type: string
    description: "Privacy policy (https). The admin console legal settings win when set there."
  - name: BRAND_EMAIL_FOOTER
    component: api
    group: "Brand"
    type: string
    description: "Plain-text line added to the footer of every email (at most 500 characters)."
  - name: BRAND_POWERED_BY
    component: api
    group: "Brand"
    type: bool
    default: "true"
    description: "Show a \"Powered by OpenCTEM\" credit next to a brand other than OpenCTEM."
  - name: BRAND_LOGO_LIGHT_FILE
    component: api
    group: "Brand"
    type: path
    description: "Logo for light backgrounds: PNG, JPEG, WebP or SVG, at most 512 KiB. SVG is reduced to drawing elements; a file with script, external references or event handlers is refused at startup. Unset keeps the built-in logo."
  - name: BRAND_LOGO_DARK_FILE
    component: api
    group: "Brand"
    type: path
    description: "Logo for dark backgrounds (same rules as `BRAND_LOGO_LIGHT_FILE`). Unset uses the light logo."
  - name: BRAND_FAVICON_FILE
    component: api
    group: "Brand"
    type: path
    description: "Browser tab icon: PNG, ICO or SVG, at most 512 KiB. Unset keeps the built-in icon."
  - name: MAX_CONCURRENT_REQUESTS
    component: api
    group: "HTTP server"
    type: int
    default: "1000"
    description: "Maximum number of requests the API handles at once; further requests are refused."
  - name: SERVER_HOST
    component: api
    group: "HTTP server"
    type: string
    default: "0.0.0.0"
    description: "Listen address of the API."
  - name: SERVER_MAX_BODY_SIZE
    component: api
    group: "HTTP server"
    type: int
    default: "10485760"
    description: "Default request body limit in bytes. Some routes (for example asset import) set their own, larger limit."
  - name: SERVER_PORT
    component: api
    group: "HTTP server"
    type: int
    default: "8080"
    description: "Listen port of the API (REST, WebSocket, `/health`, `/ready`, `/metrics`)."
  - name: SERVER_READ_TIMEOUT
    component: api
    group: "HTTP server"
    type: duration
    default: "15s"
    description: "HTTP server read timeout (Go duration)."
  - name: SERVER_REQUEST_TIMEOUT
    component: api
    group: "HTTP server"
    type: duration
    default: "30s"
    description: "Per-request handler timeout."
  - name: SERVER_SHUTDOWN_TIMEOUT
    component: api
    group: "HTTP server"
    type: duration
    default: "30s"
    description: "Grace period for in-flight requests on shutdown."
  - name: SERVER_TRUSTED_PROXIES
    component: api
    group: "HTTP server"
    type: list
    description: "Comma-separated CIDRs or IPs of proxies whose `X-Real-IP` / `X-Forwarded-For` the API believes (audit log, rate limits, IP allowlists). Empty: the API treats every peer as the client. The Compose stack lists the gateway and the web console."
  - name: SERVER_WRITE_TIMEOUT
    component: api
    group: "HTTP server"
    type: duration
    default: "15s"
    description: "HTTP server write timeout."
  - name: SESSION_TIMEOUT_MINUTES
    component: api
    group: "HTTP server"
    type: int
    default: "30"
    description: "Maximum age, in minutes, of an access token (from its issued-at time) before the API answers `401 Session has expired`. `0` turns the check off."
  - name: SERVER_TLS_CERT_FILE
    component: api
    group: "HTTP server"
    type: path
    description: "PEM certificate (full chain) for the API listener to terminate TLS itself, when no TLS proxy is in front. Set together with `SERVER_TLS_KEY_FILE`."
  - name: SERVER_TLS_KEY_FILE
    component: api
    group: "HTTP server"
    type: path
    description: "PEM key matching `SERVER_TLS_CERT_FILE`."
  - name: DB_CONN_MAX_LIFETIME
    component: api
    group: "Database (PostgreSQL)"
    type: duration
    default: "5m"
    description: "Maximum lifetime of a pooled connection."
  - name: DB_HOST
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "localhost"
    required: yes
    description: "PostgreSQL host."
  - name: DB_JIT_ENABLED
    component: api
    group: "Database (PostgreSQL)"
    type: bool
    default: "false"
    description: "PostgreSQL JIT for the API's sessions. Off by default because request-path queries pay the JIT compile cost without benefiting from it."
  - name: DB_MAX_IDLE_CONNS
    component: api
    group: "Database (PostgreSQL)"
    type: int
    default: "5"
    description: "Maximum idle connections kept in the pool."
  - name: DB_MAX_OPEN_CONNS
    component: api
    group: "Database (PostgreSQL)"
    type: int
    default: "25"
    description: "Maximum open connections in the API's pool."
  - name: DB_NAME
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "openctem"
    description: "Database name."
  - name: DB_ADMIN_PASSWORD
    component: api
    group: "Database (PostgreSQL)"
    type: string
    secret: true
    description: "Password of `DB_ADMIN_USER`. Required when `DB_ADMIN_USER` is set; must differ from `DB_PASSWORD`."
  - name: DB_ADMIN_USER
    component: api
    group: "Database (PostgreSQL)"
    type: string
    description: "Role the platform console's identity tables (administrators, console sessions and credentials, the platform identity provider) are written with, through a second small pool. The least-privilege bootstrap (`admin_user`) creates it and takes write on those tables away from `DB_USER`. Unset: one role, as before."
  - name: DB_PASSWORD
    component: api
    group: "Database (PostgreSQL)"
    type: string
    required: yes
    secret: true
    example: "secret"
    description: "Password of `DB_USER`. Required outside `APP_ENV=development`; there is no default."
  - name: DB_PORT
    component: api
    group: "Database (PostgreSQL)"
    type: int
    default: "5432"
    description: "PostgreSQL port."
  - name: DB_SSLMODE
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "disable"
    required: production
    description: "libpq `sslmode`. Production refuses `disable`: use `require`, `verify-ca` or `verify-full`."
  - name: DB_USER
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "openctem"
    required: yes
    description: "Role the API connects as. With the least-privilege layout this is the DML-only role (`openctem_app`)."
  - name: MIGRATIONS_DIR
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "migrations"
    description: "Directory the start-up schema check reads the shipped migrations from. The images set the right path; change it only for a custom layout."
  - name: SKIP_SCHEMA_CHECK
    component: api
    group: "Database (PostgreSQL)"
    type: string
    default: "unset"
    description: "`true` skips the start-up check that refuses to start when the database schema is behind the binary or dirty. Keep it unset in production."
  - name: REDIS_DB
    component: api
    group: "Redis"
    type: int
    default: "0"
    description: "Redis database number."
  - name: REDIS_DIAL_TIMEOUT
    component: api
    group: "Redis"
    type: duration
    default: "5s"
    description: "Connect timeout. Production requires at least `1s`."
  - name: REDIS_HOST
    component: api
    group: "Redis"
    type: string
    default: "localhost"
    required: yes
    description: "Redis host."
  - name: REDIS_MAX_RETRIES
    component: api
    group: "Redis"
    type: int
    default: "3"
    description: "Retries per command. Production requires 1 to 10."
  - name: REDIS_MAX_RETRY_DELAY
    component: api
    group: "Redis"
    type: duration
    default: "3s"
    description: "Maximum back-off between retries."
  - name: REDIS_MIN_IDLE_CONNS
    component: api
    group: "Redis"
    type: int
    default: "2"
    description: "Minimum idle connections."
  - name: REDIS_MIN_RETRY_DELAY
    component: api
    group: "Redis"
    type: duration
    default: "100ms"
    description: "Minimum back-off between retries."
  - name: REDIS_PASSWORD
    component: api
    group: "Redis"
    type: string
    required: production
    secret: true
    description: "Redis password. Production requires at least 32 characters."
  - name: REDIS_POOL_SIZE
    component: api
    group: "Redis"
    type: int
    default: "10"
    description: "Connection pool size. Production requires 10 to 500."
  - name: REDIS_PORT
    component: api
    group: "Redis"
    type: int
    default: "6379"
    description: "Redis port."
  - name: REDIS_READ_TIMEOUT
    component: api
    group: "Redis"
    type: duration
    default: "3s"
    description: "Read timeout. Production requires at least `1s`."
  - name: REDIS_TLS_CA_FILE
    component: api
    group: "Redis"
    type: string
    description: "CA certificate (PEM) to verify Redis with, when its certificate is not publicly trusted."
  - name: REDIS_TLS_CERT_FILE
    component: api
    group: "Redis"
    type: string
    description: "Client certificate (PEM) for mutual TLS."
  - name: REDIS_TLS_ENABLED
    component: api
    group: "Redis"
    type: bool
    default: "false"
    required: production
    description: "Connect to Redis over TLS. Required in production."
  - name: REDIS_TLS_KEY_FILE
    component: api
    group: "Redis"
    type: string
    description: "Client private key (PEM) for mutual TLS."
  - name: REDIS_TLS_SKIP_VERIFY
    component: api
    group: "Redis"
    type: bool
    default: "false"
    description: "Skip certificate verification. Production refuses `true`."
  - name: REDIS_WRITE_TIMEOUT
    component: api
    group: "Redis"
    type: duration
    default: "3s"
    description: "Write timeout. Production requires at least `1s`."
  - name: LOG_ERROR_SAMPLING_RATE
    component: api
    group: "Logging"
    type: float
    default: "1.0"
    description: "Fraction (0.0 to 1.0) of error records kept above the threshold."
  - name: LOG_FORMAT
    component: api
    group: "Logging"
    type: string
    default: "json"
    description: "`json` or `text`."
  - name: LOG_LEVEL
    component: api
    group: "Logging"
    type: string
    default: "info"
    example: "debug"
    description: "`debug`, `info`, `warn` or `error`. Production refuses `debug`."
  - name: LOG_SAMPLING_ENABLED
    component: api
    group: "Logging"
    type: bool
    default: "false"
    description: "Sample repeated log records (same level and message) to bound log volume."
  - name: LOG_SAMPLING_RATE
    component: api
    group: "Logging"
    type: float
    default: "0.1"
    description: "Fraction (0.0 to 1.0) of records kept above the threshold."
  - name: LOG_SAMPLING_THRESHOLD
    component: api
    group: "Logging"
    type: int
    default: "100"
    description: "Identical records per second always written before sampling starts."
  - name: LOG_SLOW_REQUEST_SECONDS
    component: api
    group: "Logging"
    type: int
    default: "5"
    description: "A request slower than this is logged at WARN as `slow http request`. `0` turns it off."
  - name: APP_ENCRYPTION_KEY
    component: api
    group: "Encryption keys"
    type: string
    required: yes
    secret: true
    example: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    description: "AES-256-GCM key for stored credentials (integration tokens, SMTP passwords, identity-provider secrets). 32 raw, 64 hex or 44 base64 characters: `openssl rand -hex 32`. Required unless `APP_ENV=development`. Back it up with the database: without it the stored credentials cannot be decrypted."
  - name: APP_ENCRYPTION_KEY_FORMAT
    component: api
    group: "Encryption keys"
    type: string
    description: "`raw`, `hex` or `base64`. Detected from the key length when unset."
  - name: APP_ENCRYPTION_KEY_PREVIOUS
    component: api
    group: "Encryption keys"
    type: list
    secret: true
    description: "Comma-separated earlier keys, only while a key rotation is in progress. Values encrypted under them stay readable. Remove them when the rotation is finished."
  - name: APP_TEMPLATE_SIGNING_KEY
    component: api
    group: "Encryption keys"
    type: string
    secret: true
    description: "Master secret the per-organization signing keys of custom scanner templates are derived from. Same formats as `APP_ENCRYPTION_KEY` and must differ from it. Set it to rotate template keys independently of the encryption key. Unset: derived from `APP_ENCRYPTION_KEY`."
  - name: APP_CONTENT_SIGNING_KEY
    component: api
    group: "Encryption keys"
    type: string
    secret: true
    description: "Master secret of each organization's content pack signing key (Ed25519). Same formats as `APP_ENCRYPTION_KEY` and must differ from it and from `APP_TEMPLATE_SIGNING_KEY`. Unset: derived from `APP_ENCRYPTION_KEY` under its own label."
  - name: CONTENT_TRUST_ROOT_KEY_IDS
    component: api
    group: "Encryption keys"
    type: list
    description: "Extra content catalog roots (comma-separated key ids, `SHA256:<hex>`) trusted beside the roots pinned in the release, for an operator's own catalog source (RFC-099). Setting it writes a high-severity admin audit row at startup. Unset: only the pinned roots; with none, bundle imports are refused."
  - name: CONTENT_SIGSTORE_TRUSTED_ROOT
    component: api
    group: "Encryption keys"
    type: path
    description: "Path of a Sigstore trusted root (JSON) that replaces the one embedded in the release for verifying publisher signatures of content packages (RFC-099). Setting it writes a high-severity admin audit row with the file's SHA-256 at startup. Unset: the embedded trusted root."
  - name: AUTH_ACCESS_TOKEN_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "15m"
    description: "Access token lifetime."
  - name: AUTH_COOKIE_DOMAIN
    component: api
    group: "Authentication"
    type: string
    description: "`Domain` attribute of session cookies. Unset: the current host only."
  - name: AUTH_COOKIE_SAMESITE
    component: api
    group: "Authentication"
    type: string
    default: "lax"
    description: "`strict`, `lax` or `none` (`none` needs `AUTH_COOKIE_SECURE=true`)."
  - name: AUTH_COOKIE_SECURE
    component: api
    group: "Authentication"
    type: bool
    default: "true"
    required: production
    example: "false"
    description: "`Secure` flag on session cookies. Must be `true` in production."
  - name: AUTH_EMAIL_VERIFICATION_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "24h"
    description: "Lifetime of an email verification link."
  - name: AUTH_JWT_ISSUER
    component: api
    group: "Authentication"
    type: string
    default: "api"
    description: "`iss` claim of issued tokens."
  - name: AUTH_JWT_SECRET
    component: api
    group: "Authentication"
    type: string
    secret: true
    description: "HMAC secret that signs session tokens. Unset: derived from `APP_ENCRYPTION_KEY` (HKDF, 64 bytes), so rotating the encryption key also signs every user out; set it (at least 64 characters in production: `openssl rand -hex 64`) to rotate the two independently. Changing it signs every user out."
  - name: AUTH_LOCKOUT_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "15m"
    description: "How long a locked account stays locked."
  - name: AUTH_MAX_ACTIVE_SESSIONS
    component: api
    group: "Authentication"
    type: int
    default: "10"
    description: "Concurrent sessions per user."
  - name: AUTH_MAX_LOGIN_ATTEMPTS
    component: api
    group: "Authentication"
    type: int
    default: "5"
    description: "Failed sign-ins before the account is locked."
  - name: AUTH_PASSWORD_MIN_LENGTH
    component: api
    group: "Authentication"
    type: int
    default: "12"
    description: "Minimum password length. At least 6; at least 8 in production."
  - name: AUTH_PASSWORD_REQUIRE_LOWERCASE
    component: api
    group: "Authentication"
    type: bool
    default: "true"
    description: "Require a lowercase letter."
  - name: AUTH_PASSWORD_REQUIRE_NUMBER
    component: api
    group: "Authentication"
    type: bool
    default: "true"
    description: "Require a digit."
  - name: AUTH_PASSWORD_REQUIRE_SPECIAL
    component: api
    group: "Authentication"
    type: bool
    default: "false"
    description: "Require a special character."
  - name: AUTH_PASSWORD_REQUIRE_UPPERCASE
    component: api
    group: "Authentication"
    type: bool
    default: "true"
    description: "Require an uppercase letter."
  - name: AUTH_PASSWORD_RESET_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "1h"
    description: "Lifetime of a password reset link."
  - name: AUTH_PROVIDER
    component: api
    group: "Authentication"
    type: string
    default: "local"
    description: "`local` (built-in email and password), `oidc` (an external Keycloak realm) or `hybrid` (both). Up to v0.8.0 the default was `oidc`: an installation that relied on that must now set `AUTH_PROVIDER=oidc`."
  - name: AUTH_REFRESH_TOKEN_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "168h"
    description: "Refresh token lifetime (7 days)."
  - name: AUTH_REQUIRE_EMAIL_VERIFICATION
    component: api
    group: "Authentication"
    type: bool
    default: "true"
    example: "false"
    description: "Require a verified email address. Production refuses `false` with `local` or `hybrid`."
  - name: AUTH_SESSION_DURATION
    component: api
    group: "Authentication"
    type: duration
    default: "720h"
    description: "Session lifetime (30 days)."
  - name: SCOPE_DENY_EXTRA
    component: api
    group: "Organizations and scope guardrails"
    type: list
    description: "Comma-separated domains and CIDRs that no organization may target, in addition to the built-in deny list (for example the platform's own names and ranges)."
  - name: SCOPE_PUBLIC_CODE_HOSTS_EXTRA
    component: api
    group: "Organizations and scope guardrails"
    type: list
    description: "Comma-separated code hosts shared by many organizations, in addition to the built-in list (github.com, gitlab.com, bitbucket.org and others). A repository scope entry on such a host must name a namespace (host/namespace/*), never the whole host."
  - name: SCOPE_MAX_PUBLIC_CIDR_V4
    component: api
    group: "Organizations and scope guardrails"
    type: int
    default: "16"
    description: "Largest public IPv4 range (prefix length) one scope entry may cover. Private ranges are not capped."
  - name: SCOPE_MAX_PUBLIC_CIDR_V6
    component: api
    group: "Organizations and scope guardrails"
    type: int
    default: "32"
    description: "Largest public IPv6 range one scope entry may cover."
  - name: SIGNUP_MODE
    component: api
    group: "Organizations and scope guardrails"
    type: string
    default: "disabled"
    description: "The deployment's sign-up ceiling; no API can change it, and the console sign-up policy can only stay at or below it. `disabled`: no public account creation; people get accounts from a platform administrator, an invitation or their organization's SSO, and only a platform administrator creates organizations. `domain`: public sign-up only for addresses on an organization's verified domain, who join that organization (never create one). `open`: anyone may sign up and create an organization (the hosted service). `domain` and `open` need the platform e-mail (System > E-mail) at start and verify every self-registered address; `open` in production also needs the Turnstile keys or `SIGNUP_CAPTCHA`. Any other value stops start-up. Replaces `TENANT_CREATION_MODE`."
  - name: SIGNUP_CAPTCHA
    component: api
    group: "Organizations and scope guardrails"
    type: string
    description: "Only value: `off-i-understand`, which accepts `SIGNUP_MODE=open` in production without a CAPTCHA (labs, training installs). Unset: open sign-up in production refuses to start without `CAPTCHA_TURNSTILE_SECRET` and `CAPTCHA_TURNSTILE_SITE_KEY`."
  - name: CAPTCHA_TURNSTILE_SECRET
    component: api
    group: "Organizations and scope guardrails"
    type: string
    secret: true
