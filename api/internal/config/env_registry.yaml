  - name: CORS_ALLOWED_METHODS
    component: api
    group: "CORS and rate limiting"
    type: list
    default: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    description: "Allowed methods."
  - name: CORS_ALLOWED_ORIGINS
    component: api
    group: "CORS and rate limiting"
    type: list
    default: "APP_URL origin, else http://localhost:3000"
    example: "http://localhost:3000"
    description: "Comma-separated browser origins allowed to call the API; the WebSocket `Origin` is checked against it too. Set it only when the console runs on another origin than `APP_URL`. Production refuses `*`."
  - name: CORS_MAX_AGE
    component: api
    group: "CORS and rate limiting"
    type: int
    default: "86400"
    description: "Preflight cache lifetime in seconds."
  - name: RATE_LIMIT_BURST
    component: api
    group: "CORS and rate limiting"
    type: int
    default: "200"
    description: "Burst size per client."
  - name: RATE_LIMIT_CLEANUP
    component: api
    group: "CORS and rate limiting"
    type: duration
    default: "1m"
    description: "How often idle limiter entries are removed."
  - name: RATE_LIMIT_ENABLED
    component: api
    group: "CORS and rate limiting"
    type: bool
    default: "true"
    description: "Global per-client rate limiter. Production refuses `false`."
  - name: RATE_LIMIT_READ_PER_MIN
    component: api
    group: "CORS and rate limiting"
    type: int
    default: "120"
    description: "Per-user budget (and burst) for authenticated `GET` requests. Values of 0 or less fall back to the default."
  - name: RATE_LIMIT_RPS
    component: api
    group: "CORS and rate limiting"
    type: float
    default: "100"
    description: "Requests per second per client."
  - name: SMTP_BASE_URL
    component: api
    group: "Email (SMTP)"
    type: string
    default: "APP_URL, else http://localhost:3000"
    example: "http://localhost:3000"
    description: "Base URL of links in e-mails. Set it only when the console is not at `APP_URL`."
  - name: STORAGE_ACCESS_KEY
    component: api
    group: "Attachment storage"
    type: string
    secret: true
    description: "Access key. Required with `s3` / `minio`."
  - name: STORAGE_BUCKET
    component: api
    group: "Attachment storage"
    type: string
    description: "Bucket for `s3` / `minio`. Required with those providers."
  - name: STORAGE_CLAMD_ADDRESS
    component: api
    group: "Attachment storage"
    type: string
    description: "ClamAV daemon (`host:port` or `unix:/path`, e.g. `clamav:3310` with `docker-compose.clamav.yml`) that scans new uploads. A flagged file is kept and marked, audited `attachment.malware_detected`, and downloads only after a confirmation. Unset: no scanning."
  - name: STORAGE_DIRECT_DOWNLOAD
    component: api
    group: "Attachment storage"
    type: bool
    default: "false"
    description: "Hand out 60-second signed URLs (`GET /api/v1/attachments/{id}/signed-url`) for files in an HTTPS bucket, after the same checks as a download through the API; the console uses them for file downloads. Files on local storage, in a plain-HTTP bucket and flagged files always download through the API. The bucket needs CORS only for downloads started with `fetch`."
  - name: STORAGE_ENDPOINT
    component: api
    group: "Attachment storage"
    type: string
    description: "Endpoint of an S3-compatible store, for example MinIO. Unset: AWS S3."
  - name: STORAGE_LOCAL_PATH
    component: api
    group: "Attachment storage"
    type: string
    default: "./data/attachments"
    description: "Directory for `local` storage, relative to the working directory (`/app` in the API image, so `/app/data/attachments`). Put it on a persistent volume and back it up."
  - name: STORAGE_SSE
    component: api
    group: "Attachment storage"
    type: string
    description: "Server-side encryption asked for on every object written to the server bucket: `AES256` or `aws:kms`. Unset: the bucket's default encryption. Only with `s3` / `minio`."
  - name: STORAGE_SSE_KMS_KEY_ID
    component: api
    group: "Attachment storage"
    type: string
    description: "KMS key (id or ARN) for `STORAGE_SSE=aws:kms`. Unset: the bucket's default KMS key."
  - name: STORAGE_TENANT_QUOTA_MB
    component: api
    group: "Attachment storage"
    type: int
    default: "20480"
    description: "Most attachment bytes one organization may hold, in MiB (20480 = 20 GiB). An upload that would pass it is refused with 413 `STORAGE_QUOTA_EXCEEDED`. 0 = no quota."
  - name: STORAGE_ORPHAN_GRACE_DAYS
    component: api
    group: "Attachment storage"
    type: int
    default: "7"
    description: "Days evidence files stay after their finding or campaign is deleted; then the retention sweep deletes them (audited `attachment.purged`). 0 = keep them."
  - name: STORAGE_UNLINKED_RETENTION_HOURS
    component: api
    group: "Attachment storage"
    type: int
    default: "24"
    description: "Hours an upload never linked to a finding or campaign stays before the retention sweep deletes it. Authorization letter files are never purged. 0 = keep them."
  - name: STORAGE_PROVIDER
    component: api
    group: "Attachment storage"
    type: string
    default: "local"
    description: "`local`, `s3` or `minio`. Any other value stops start-up."
  - name: STORAGE_REGION
    component: api
    group: "Attachment storage"
    type: string
    description: "Bucket region."
  - name: STORAGE_SECRET_KEY
    component: api
    group: "Attachment storage"
    type: string
    secret: true
    description: "Secret key. Required with `s3` / `minio`."
  - name: SENSOR_CA_CERT_FILE
    component: api
    group: "Sensors"
    type: string
    description: "Private CA certificate (PEM) the install snippets install on the sensor host. Set it with the gateway in TLS mode `internal` (the Compose stack points it at the exported root CA)."
  - name: CI_RUNNER_LATEST_VERSION
    component: api
    group: "Sensors"
    type: string
    default: "`versions.yaml` ci.latest, built into the API"
    description: "Newest CI runner release (openctemio/ci: the openctem-ci action and image). The console's pipeline snippets pin it, and a pipeline on an older runner shows an update. CI runners have their own release line; the sensor settings never apply to them. `none` or `off` turns the comparison off."
  - name: CI_RUNNER_MIN_VERSION
    component: api
    group: "Sensors"
    type: string
    default: "`versions.yaml` ci.min, built into the API"
    description: "Oldest accepted CI runner release. The token exchange refuses an older runner (`RUNNER_OUTDATED`) and its pipeline is shown as degraded. Empty, `none` or `off`: no minimum."
  - name: SENSOR_COMMAND_LEASE
    component: api
    group: "Sensors"
    type: duration
    default: "3m"
    description: "How long a sensor holds a claimed task without renewing it; an expired lease puts the task back in the queue."
  - name: SENSOR_CONFIG_TEMPLATES_DIR
    component: api
    group: "Sensors"
    type: string
    default: "configs/sensor-products"
    description: "Directory of the sensor install snippet templates shown in the console: one directory per snippet set (<set>/<format>.tmpl). A sensor product of your own adds a directory here."
  - name: SENSOR_PRODUCTS_FILE
    component: api
    group: "Sensors"
    type: string
    default: ""
    description: "File of extra sensor products (for example your own sensor built on the SDK), in the versions.yaml product format; added to the built-in catalog. An invalid file stops the API from starting."
  - name: SENSOR_HEALTH_SLOW_HEARTBEAT
    component: api
    group: "Sensors"
    type: duration
    default: "2s"
    description: "Heartbeat handling p95 that counts as slow. While the platform is slow, no sensor is marked offline."
  - name: SENSOR_HEALTH_STARTUP_GRACE
    component: api
    group: "Sensors"
    type: duration
    default: "0"
    description: "Time after API start during which no sensor is marked offline."
  - name: SENSOR_HEARTBEAT_BUSY_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "5s"
    description: "Interval advised while work is waiting for the sensor."
  - name: SENSOR_HEARTBEAT_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "30s"
    description: "Heartbeat interval advised to an idle sensor."
  - name: SENSOR_HEARTBEAT_MAX_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "5m"
    description: "Upper clamp of every advised interval (also capped at half of `WORKER_HEARTBEAT_TIMEOUT`)."
  - name: SENSOR_HEARTBEAT_MIN_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "5s"
    description: "Lower clamp of every advised interval."
  - name: SENSOR_HEARTBEAT_SLOW_QUERY
    component: api
    group: "Sensors"
    type: duration
    default: "250ms"
    description: "Heartbeat query latency that counts as \"platform under load\"."
  - name: SENSOR_COLLECTOR_IMAGE
    component: api
    group: "Sensors"
    type: string
    default: "ghcr.io/openctemio/asset-collector:latest"
    description: "Image, with its tag, the install snippets of a collector sensor run (the asset collector, not the scanner). Pin a collector release here."
  - name: SENSOR_IMAGE
    component: api
    group: "Sensors"
    type: string
    default: "the scanning sensor image in `versions.yaml` (ghcr.io/openctemio/sensor)"
    description: "Image repository the scanning sensor's install snippets run, for a mirror. The tag is the sensor's latest release in `versions.yaml`, never `latest`. Other sensor products always use their published image."
  - name: SENSOR_KEY_PEPPER
    component: api
    group: "Sensors"
    type: string
    secret: true
    description: "Secret the sensor API-key hashes are keyed with. At least 32 characters when set. Unset: derived from `APP_ENCRYPTION_KEY`."
  - name: SENSOR_KEY_PEPPER_PREVIOUS
    component: api
    group: "Sensors"
    type: list
    secret: true
    description: "Comma-separated earlier peppers, kept while keys move to a new `SENSOR_KEY_PEPPER`."
  - name: SENSOR_KEY_RENEW_BEFORE
    component: api
    group: "Sensors"
    type: duration
    description: "How long before expiry the heartbeat asks the sensor to rotate its key. Unset: half of `SENSOR_KEY_TTL` (24h without a TTL)."
  - name: SENSOR_KEY_RENEW_GRACE
    component: api
    group: "Sensors"
    type: duration
    default: "15m"
    description: "How long the key a sensor renewed with keeps working after the renewal. `0` retires it at once."
  - name: SENSOR_KEY_TTL
    component: api
    group: "Sensors"
    type: duration
    default: "2160h"
    description: "Validity of a sensor API key renewed by the sensor itself. `0`: renewed keys never expire. Keys created or regenerated by an administrator never expire."
  - name: SENSOR_LB_CPU_WEIGHT
    component: api
    group: "Sensors"
    type: float
    default: "0.40"
    description: "Weight of CPU usage."
  - name: SENSOR_LB_DISK_IO_WEIGHT
    component: api
    group: "Sensors"
    type: float
    default: "0.10"
    description: "Weight of disk I/O."
  - name: SENSOR_LB_JOB_WEIGHT
    component: api
    group: "Sensors"
    type: float
    default: "0.30"
    description: "Weight of the job load in the sensor load score used to place work (weights should sum to 1.0)."
  - name: SENSOR_LB_MAX_DISK_THROUGHPUT_MBPS
    component: api
    group: "Sensors"
    type: float
    default: "500"
    description: "Disk throughput (MB/s) that counts as 100% disk load."
  - name: SENSOR_LB_MAX_NETWORK_THROUGHPUT_MBPS
    component: api
    group: "Sensors"
    type: float
    default: "1000"
    description: "Network throughput (MB/s) that counts as 100% network load."
  - name: SENSOR_LB_MEMORY_WEIGHT
    component: api
    group: "Sensors"
    type: float
    default: "0.15"
    description: "Weight of memory usage."
  - name: SENSOR_LB_NETWORK_WEIGHT
    component: api
    group: "Sensors"
    type: float
    default: "0.05"
    description: "Weight of network I/O."
  - name: SENSOR_PUBLIC_API_URL
    component: api
    group: "Sensors"
    type: string
    description: "URL sensors connect to, embedded in the install snippets and configuration templates. Unset: `APP_URL`."
  - name: SENSOR_SLIM_HEARTBEAT
    component: api
    group: "Sensors"
    type: bool
    default: "true"
    description: "Let sensors with an acknowledged manifest leave their tool inventory out of heartbeats. `false` asks every sensor for full heartbeats."
  - name: WORKER_HEALTH_CHECK_ENABLED
    component: api
    group: "Sensors"
    type: bool
    default: "false"
    description: "Legacy sensor health checker. Keep it off: the sensor health controller owns liveness and the legacy checker marks every sensor offline right after an API restart."
  - name: WORKER_HEALTH_CHECK_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "1m"
    description: "Interval of the legacy checker."
  - name: WORKER_HEARTBEAT_TIMEOUT
    component: api
    group: "Sensors"
    type: duration
    default: "5m"
    description: "No heartbeat for this long marks a sensor inactive. Advised heartbeat intervals stay below half of it."
  - name: SCAN_ZONE_RESOLVER
    component: api
    group: "Sensors"
    type: string
    description: "DNS resolver scan-zone routing resolves host names with: `system` (the platform's own resolver, which may know internal names) or `host[:port]` of a recursive resolver. Unset: a public resolver when organizations are self-service, otherwise `system`."
  - name: SENSOR_MTLS_CA_CERT_FILE
    component: api
    group: "Sensors"
    type: path
    description: "Sensor CA certificate (PEM) for protocol v3 client certificates. Set together with `SENSOR_MTLS_CA_KEY_FILE`; unset, the CA is created once in `SENSOR_MTLS_CA_DIR`."
  - name: SENSOR_MTLS_CA_DIR
    component: api
    group: "Sensors"
    type: path
    default: "data/sensor-ca"
    description: "Where the sensor CA is created on first start when the two CA files are not set. Keep it on a persistent volume."
  - name: SENSOR_MTLS_CA_KEY_FILE
    component: api
    group: "Sensors"
    type: path
    description: "Sensor CA private key (PEM). Not the job signer's key."
  - name: SENSOR_MTLS_CERT_TTL
    component: api
    group: "Sensors"
    type: duration
    default: "168h"
    description: "Lifetime of sensor client certificates, clamped to 1h..720h."
  - name: SENSOR_MTLS_LISTEN_ADDR
    component: api
    group: "Sensors"
    type: string
    default: ":8443"
    description: "TLS 1.3 listener of sensor protocol v3 (gRPC). The gateway passes connections that offer the sensor ALPN id through to it."
  - name: SENSOR_MTLS_TRUSTED_PROXIES
    component: api
    group: "Sensors"
    type: list
    description: "Comma-separated CIDRs whose PROXY protocol v2 header the sensor listener believes: the gateway that passes sensor connections through."
  - name: SENSOR_PUBLIC_HOST
    component: api
    group: "Sensors"
    type: string
    description: "`host[:port]` sensors dial for protocol v3, for a dedicated sensor host name or port. Unset: the host and port of `SENSOR_PUBLIC_API_URL`, else `APP_URL`. Advertised only while the self-probe passes."
  - name: SENSOR_RESULT_QUARANTINE_PURGE_INTERVAL
    component: api
    group: "Sensors"
    type: duration
    default: "24h"
    description: "How often reviewed quarantined sensor results older than the retention are deleted. Pending items are never purged."
  - name: SENSOR_RESULT_QUARANTINE_RETENTION
    component: api
    group: "Sensors"
    type: duration
    default: "720h"
    description: "How long a reviewed quarantined sensor result is kept."
  - name: SENSOR_TRANSPORT_V3
    component: api
    group: "Sensors"
    type: enum
    values: [auto, off]
    default: "auto"
    description: "`auto` serves sensor protocol v3 and picks its bindings itself (HTTPS always, gRPC once the sensor CA loads and its self-probe passes). `off` is the emergency switch: every sensor falls back to v2 at its next call."
  - name: SIGNER_SOCKET
    component: api
    group: "Sensors"
    type: path
    description: "Unix socket of the job signer (`cmd/signer`). Set: every job handed to a sensor is signed, and a job the signer refuses is not handed out. Unset: jobs are not signed."
  - name: SIGNER_TIMEOUT
    component: api
    group: "Sensors"
    type: duration
    default: "2s"
    description: "Timeout of one call to the job signer."
  - name: INGEST_COVERAGE_AUTO_RESOLVE
    component: api
    group: "Ingest"
    type: string
    default: "dry_run"
