name: Web visual regression

# Screenshots of the key pages (dashboard, findings, assets, scans, tasks,
# My Work, settings) at 1440 light and dark and 390 light, compared with the
# baselines in web/e2e/visual/__screenshots__ (2% pixel tolerance, volatile
# values masked). Kept out of the pull request path so CI stays fast:
#   pull request  only with the `run-visual` label
#   nightly       on develop, 03:30 UTC
#   on demand     workflow_dispatch; `update: true` takes new baselines and
#                 uploads them as the `visual-baselines` artifact to commit
# A missing baseline is written, not failed (the first run seeds them), and
# every run uploads the diffs of what changed.

on:
  pull_request:
    branches: [develop]
    types: [labeled, synchronize]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      update:
        description: Take new baselines instead of comparing
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  visual:
    name: Visual regression
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-visual')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_IMAGE: local/openctem-api:e2e
      WEB_IMAGE: local/openctem-web:e2e
      ADMIN_IMAGE: local/admin-cli:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the contract files
        uses: ./.github/actions/generate-contract

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Registry login (GHCR mirror; Docker Hub when configured)
        uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The same images as the e2e suite, from develop's layer cache.
      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE_WRITE: 'false'
        with:
          source: .
          files: web/e2e/ci/docker-bake.hcl

      - name: Generate the stack's secrets
        run: bash web/e2e/ci/make-env.sh

      - name: Pull the stack's third-party images
        run: bash .github/scripts/retry.sh docker compose -f web/e2e/ci/compose.yml pull --quiet postgres redis

      - name: Start the stack
        run: docker compose -f web/e2e/ci/compose.yml up -d --wait --wait-timeout 180

      - name: Seed a tenant
        run: bash web/e2e/ci/seed.sh > web/e2e/.env

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Take or compare screenshots
        working-directory: web
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8080
          UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update }}
        run: |
          if [ "$UPDATE" = true ]; then
            npx playwright test -c playwright.visual.config.ts --update-snapshots
          else
            npx playwright test -c playwright.visual.config.ts --update-snapshots=missing
          fi

      - name: Upload baselines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: web/e2e/visual/__screenshots__/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: web/test-results/
          retention-days: 14
          if-no-files-found: ignore
