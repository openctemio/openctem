name: All-in-one CI

# Builds the three images exactly as docker-publish.yml does on a release
# (openctem-api, openctem-web, then the all-in-one `openctem` assembled FROM
# them with api/deploy/gateway as the gateway), loads them locally, and runs
# the same smoke tests: native arch + ELF + executes, and the all-in-one in
# both gateway modes against a real Postgres + Redis. Nothing is pushed.
#
# Without this, a change to a Dockerfile, the gateway or the supervisor would
# first be exercised by the release tag. Same shape as the other workflows:
# always starts, `changes` gates the job, `All-in-one OK` reports either way.
# Runs when either component (api/, web/) or a shared file (deploy/, .github/,
# the root Makefile; see .github/scripts/changed.sh) changes: both images are
# built from the whole component directory, so any change there is an image
# change. A docs-only change at the root runs nothing.
#
# FULL tier only: the merge queue and pushes to develop/main build the images
# (the image build is the single most expensive job; the queue tests the PR on
# its final base). A pull_request starts this workflow only when it changes a CI
# definition (see `paths:` below); the required `All-in-one OK` of a PR comes from
# pr-hygiene.yml.

on:
  push:
    branches: [develop]
  # A pull request runs this workflow only when it changes a CI definition (the
  # build then gives early feedback as "All-in-one (PR build)", not required).
  # Any other PR gets the required `All-in-one OK` from pr-hygiene.yml.
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - .github/actions/**
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Service containers pull the CI image mirror (ghcr.io/openctemio/mirror).
  packages: read

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the `ci:full` label (changed.sh reads it live)
      actions: read # queue-verified.sh reads the merge queue's runs of this commit
      checks: read # green-base.sh and release-provenance.sh read a commit's check runs
    outputs:
      images: ${{ (steps.f.outputs.api == 'true' || steps.f.outputs.web == 'true') && steps.queue.outputs.verified != 'true' && steps.tree.outputs.verified != 'true' }}
      tree_note: ${{ steps.tree.outputs.note }}
      verified: ${{ steps.queue.outputs.verified }}
      full: ${{ steps.f.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/changed.sh
      # A push to develop of a commit the merge queue already passed with this
      # workflow skips the jobs below (.github/scripts/queue-verified.sh).
      - id: queue
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/queue-verified.sh

      # The exact tree of this commit already passed every required check on a
      # pull request or an earlier queue run: skip the jobs below
      # (.github/scripts/tree-verified.sh). Also records the tree this run tested.
      - id: tree
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/tree-verified.sh

  # The four images come from build-images.yml: built once per content key for
  # the whole pipeline, by digest (the all-in-one is assembled FROM the three
  # components). Only push and merge-queue runs call it: it holds packages:
  # write, which a pull request never gets.
  shared:
    name: CI images
    needs: changes
    if: needs.changes.outputs.images == 'true' && needs.changes.outputs.full == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yml
    with:
      images: allinone
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # A pull request only reads: it reuses the images develop built for the same
  # content keys (verified digests) when all four exist, and otherwise `images`
  # builds them locally. No packages: write, no id-token, no attestations: write.
  shared-pr:
    name: CI images (PR, read-only)
    needs: changes
    if: needs.changes.outputs.images == 'true' && needs.changes.outputs.full == 'true' && github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
      attestations: read
    uses: ./.github/workflows/resolve-images.yml
    with:
      images: allinone

  images:
    name: Build and smoke-test images (amd64)
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      packages: read
      actions: write
    needs: [changes, shared, shared-pr]
    if: ${{ !cancelled() && needs.changes.outputs.images == 'true' && needs.changes.outputs.full == 'true' && (needs.shared.result == 'success' || needs.shared-pr.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      SHARED: ${{ needs.shared.outputs.push == 'true' || needs.shared-pr.outputs.push == 'true' }}
    services:
      postgres:
        image: ghcr.io/openctemio/mirror/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openctem
          # Job-scoped throwaway database: no password at all (trust auth on
          # the service network), so no credential literal lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: ghcr.io/openctemio/mirror/redis:7-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry login (GHCR mirror; Docker Hub when configured)
        uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Shared images: pull the digests, tag them as the steps below expect.
      - name: Pull the shared images
        if: env.SHARED == 'true'
        env:
          API_REF: ${{ needs.shared.outputs.api || needs.shared-pr.outputs.api }}
          WEB_REF: ${{ needs.shared.outputs.web || needs.shared-pr.outputs.web }}
          CONSOLE_REF: ${{ needs.shared.outputs.console || needs.shared-pr.outputs.console }}
          ALLINONE_REF: ${{ needs.shared.outputs.allinone || needs.shared-pr.outputs.allinone }}
        run: |
          set -euo pipefail
          for pair in "$API_REF local/openctem-api:ci" "$WEB_REF local/openctem-web:ci" "$CONSOLE_REF local/openctem-console:ci" "$ALLINONE_REF local/openctem:ci"; do
            read -r ref tag <<<"$pair"
            [ -n "$ref" ] || { echo "::error::a shared image is missing"; exit 1; }
            bash .github/scripts/retry.sh docker pull -q "$ref"
            docker tag "$ref" "$tag"
          done
      # No shared images (a fork pull request): build here, with the default
      # docker driver, so images built here are visible to the next build's FROM
      # without a registry.
      - name: Build openctem-api
        if: env.SHARED != 'true'
        run: bash .github/scripts/retry.sh docker build -t local/openctem-api:ci --target production api
      # The web image compiles against the generated contract files, which are
      # not committed (api/docs/development/ci-cd.md).
      - name: Generate the contract files
        if: env.SHARED != 'true'
        uses: ./.github/actions/generate-contract
      - name: Build openctem-web
        if: env.SHARED != 'true'
        run: bash .github/scripts/retry.sh docker build -t local/openctem-web:ci web
      - name: Build openctem-console
        if: env.SHARED != 'true'
        run: bash .github/scripts/retry.sh docker build -t local/openctem-console:ci --target console web
      - name: Build openctem (all-in-one)
        if: env.SHARED != 'true'
        run: >-
          bash .github/scripts/retry.sh
          docker buildx build --load -t local/openctem:ci
          --build-context gateway=api/deploy/gateway
          --build-arg API_IMAGE=local/openctem-api:ci
          --build-arg WEB_IMAGE=local/openctem-web:ci
          --build-arg CONSOLE_IMAGE=local/openctem-console:ci
          deploy/allinone
      - name: Smoke test (arch, ELF, executes)
        run: |
          bash .github/scripts/smoke-image.sh openctem-api local/openctem-api:ci amd64
          bash .github/scripts/smoke-image.sh openctem-web local/openctem-web:ci amd64
          bash .github/scripts/smoke-image.sh openctem-console local/openctem-console:ci amd64
          bash .github/scripts/smoke-image.sh openctem local/openctem:ci amd64
      - name: Console plan (no console without the gateway)
        run: sh deploy/allinone/console-plan.test.sh
      - name: Child environments (no secret reaches web, console or gateway)
        run: bash deploy/allinone/child-env.test.sh
      - name: All-in-one, both gateway modes, against Postgres + Redis
        env:
          SMOKE_NETWORK: host
          DB_HOST: localhost
          REDIS_HOST: localhost
        run: bash .github/scripts/smoke-allinone.sh local/openctem:ci
      - name: Set up trivy (image guard)
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      # Size budget, non-root user, no setuid file, no fixable HIGH/CRITICAL
      # advisory in OS packages (.github/scripts/image-guard.sh).
      - name: Image guard
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
        run: |
          bash .github/scripts/image-guard.sh openctem-api local/openctem-api:ci
          bash .github/scripts/image-guard.sh openctem-web local/openctem-web:ci
          bash .github/scripts/image-guard.sh openctem-console local/openctem-console:ci
          bash .github/scripts/image-guard.sh openctem local/openctem:ci
      - name: Image sizes
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^local/'
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  allinone-ok:
    # `All-in-one OK` is required on develop/main and the merge queue. On a pull
    # request pr-hygiene.yml reports that name, so this one must not.
    name: ${{ github.event_name == 'pull_request' && 'All-in-one (PR build)' || 'All-in-one OK' }}
    if: always()
    needs: [changes, shared, shared-pr, images]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped; the build ran where it must
        env:
          NEEDS: ${{ toJSON(needs) }}
          IMAGES: ${{ needs.changes.outputs.images }}
          FULL: ${{ needs.changes.outputs.full }}
          EVENT: ${{ github.event_name }}
          TREE_NOTE: ${{ needs.changes.outputs.tree_note }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ -n "$TREE_NOTE" ]; then echo "$TREE_NOTE"; fi
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          r="$(echo "$NEEDS" | jq -r '.changes.result')"
          if [ "$r" != success ]; then echo "::error::changes must pass, got: $r"; exit 1; fi
          if [ "$EVENT" != pull_request ] && [ "$FULL" != true ]; then
            echo "::error::$EVENT must run the full tier (full=$FULL)"; exit 1
          fi
          if [ "$IMAGES" = true ] && [ "$FULL" = true ]; then
            r="$(echo "$NEEDS" | jq -r '.images.result')"
            if [ "$r" != success ]; then echo "::error::the image build must run and pass for $EVENT, got: $r"; exit 1; fi
          fi
