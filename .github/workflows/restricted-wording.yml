name: Restricted wording

# Refuses restricted wording in what a pull request adds:
#   - the added lines of its files (merge base..head, or the merge queue
#     group's range);
#   - every commit message it adds, its title, its body and its branch name
#     (read fresh through the API, so a re-run after an edit sees the edit; a
#     title or body edit re-runs this workflow).
# Lines that are already in the base branch are not checked.
#
# The rules are not in this repository: they come from the secret
# RESTRICTED_WORDING_RULES. Where secrets are not available (pull requests
# from forks, Dependabot) the check is skipped with a notice, and the
# merge-queue run still applies it. The output names file:line only.
#
# Security: pull_request (not pull_request_target), read-only token, no code of
# the pull request is executed. The script comes from the BASE commit. The
# pull request's commits are fetched as git objects and only ever read by
# `git diff`; titles, bodies and messages are written to files by the API
# client and read as data, never interpolated into a command. The secret
# reaches the script through its environment only and is never printed.
# The job name is stable so it can be made a required check.

on:
  pull_request:
    branches: [main, develop, next]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  restricted-wording:
    name: Restricted wording
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the checker from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/check-restricted-wording.sh
          sparse-checkout-cone-mode: false

      - name: Restricted wording
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RESTRICTED_WORDING_RULES: ${{ secrets.RESTRICTED_WORDING_RULES }}
        run: |
          set -euo pipefail
          if [ ! -f .github/scripts/check-restricted-wording.sh ]; then
            echo "::notice::the base commit has no check-restricted-wording.sh yet; nothing to check"
            exit 0
          fi
          if [ -z "$RESTRICTED_WORDING_RULES" ]; then
            echo "::notice::RESTRICTED_WORDING_RULES is not set; the restricted wording check was skipped."
            exit 0
          fi
          work="$(mktemp -d)"
          rc=0

          # Text: commit messages of base...head, then title, body and branch.
          gh api --paginate "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.commits[] | .commit.message, ""' >"$work/commits.txt"
          files=("$work/commits.txt")
          if [ -n "$PR" ]; then
            gh api "repos/$REPO/pulls/$PR" --jq '.title, "", (.body // "")' >"$work/pr.txt"
            gh api "repos/$REPO/pulls/$PR" --jq '.head.ref' >"$work/branch.txt"
            files+=("$work/pr.txt" "$work/branch.txt")
          fi

          # Files: added lines from the merge base to the head. Both commits
          # are fetched as objects; nothing of them is checked out or run.
          merge_base="$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha')"
          git fetch --quiet --no-tags --depth=1 origin "$merge_base" "$HEAD_SHA"

          bash .github/scripts/check-restricted-wording.sh --text "${files[@]}" || rc=1
          bash .github/scripts/check-restricted-wording.sh --diff "$merge_base" "$HEAD_SHA" || rc=1
          exit "$rc"
