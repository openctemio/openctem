name: Web design gate

# Keeps the shipped pages equal to their approved design boards
# (web/docs/ui/design-gate.md). For every page in web/e2e/design/manifest.ts:
#   reference pass  the real page with the design's sample data (a mock API,
#                   web/e2e/design/fixtures) at 1440 and 390 px, light and dark,
#                   compared with the images exported from the board
#                   (web/e2e/design/references); `expected: match` entries fail
#                   above their threshold, `expected: pending` entries only
#                   report their score
#   layout pass     Vietnamese with long and empty data: no sideways page
#                   scroll, no clipped text, no overlapping controls (blocks for
#                   every entry)
# Pages not in the manifest are not checked: the gate grows page by page as
# pages move to their boards.
#
# No API, database, images or secrets: `next dev` with a mock API on 127.0.0.1
# as its backend; the browser reaches nothing but the web server. Always starts
# (`Design gate OK` always reports, so it can be a required check); the gate
# job runs when web/ or a shared CI file changed (.github/scripts/changed.sh).
# Expected, actual and diff images of every comparison are uploaded as the
# `design-gate` artifact and the scores are in the job summary.

on:
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect web changes
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read # the PR's labels (changed.sh)
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/changed.sh

  gate:
    name: Design gate
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Dashboard pages import the route permission map, so the contract files
      # are generated as for every other web job.
      - name: Generate the contract files
        uses: ./.github/actions/generate-contract

      - name: Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The same browser cache as Web E2E (keyed by the Playwright version).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Compare with the design boards and check the layout
        working-directory: web
        run: npx playwright test -c playwright.design.config.ts

      - name: Job summary
        if: always()
        working-directory: web
        run: cat test-results-design/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: design-gate
          path: web/test-results-design
          retention-days: 14
          if-no-files-found: ignore

  ok:
    name: Design gate OK
    if: always()
    needs: [changes, gate]
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: The gate passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          WEB: ${{ needs.changes.outputs.web }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          if [ "$WEB" = true ] && [ "$(echo "$NEEDS" | jq -r .gate.result)" != success ]; then
            echo "::error::the design gate had to run and did not pass"; exit 1
          fi
