name: Web CI

# The Next.js app lives in web/. Same shape as api-ci.yml: always starts, the
# `changes` job gates the real jobs, `Web CI OK` is the single required check.
# The routing rules are in .github/scripts/changed.sh.
#
# The web compiles against contract files generated from the Go API: the
# OpenAPI spec (-> web/src/lib/api/generated/api.types.ts), the route
# permission map (web/src/config/api-route-permissions.json) and the route
# manifest (api/api/openapi/routes.txt). None of them is committed, so pull
# requests never conflict on them (api/docs/development/ci-cd.md, "Generated
# contract files"). The `contract` job generates them once per run and hands
# them to the other jobs as an artifact. For an API change it also generates
# the base's contract and:
#   - runs the web checks when the contract changed (tsc then proves the web
#     still compiles against the new contract);
#   - reports the difference (breaking changes, route gate changes, routes) as
#     the job summary and as a pull request comment (`contract-comment`).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Node version: web/.nvmrc, the same major web/Dockerfile ships (node:26-alpine).
defaults:
  run:
    working-directory: web

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the PR's commits and labels (changed.sh)
      checks: read # green-base.sh and release-provenance.sh read a commit's check runs
      actions: read # queue-verified.sh reads the merge queue's runs of this commit
    timeout-minutes: 5
    outputs:
      # web: application code or an English catalog (unit tests assert English
      # text; Next build). lint: anything Web checks covers (app, e2e specs,
      # catalogs). i18n: only non-English catalogs changed.
      web: ${{ steps.f.outputs.web == 'true' && (steps.scope.outputs.web_app == 'true' || steps.scope.outputs.ci_self == 'true' || steps.scope.outputs.i18n_en == 'true') && steps.tree.outputs.verified != 'true' }}
      lint: ${{ steps.f.outputs.web == 'true' && (steps.scope.outputs.web_app == 'true' || steps.scope.outputs.ci_self == 'true' || steps.scope.outputs.web_e2e == 'true' || steps.scope.outputs.web_i18n == 'true') && steps.tree.outputs.verified != 'true' }}
      i18n: ${{ steps.f.outputs.web == 'true' && steps.scope.outputs.web_i18n == 'true' && steps.scope.outputs.i18n_en != 'true' && !(steps.scope.outputs.web_app == 'true' || steps.scope.outputs.ci_self == 'true') && steps.tree.outputs.verified != 'true' }}
      i18n_files: ${{ steps.scope.outputs.i18n_files }}
      api: ${{ steps.f.outputs.api == 'true' && (steps.scope.outputs.api_code == 'true' || steps.scope.outputs.ci_self == 'true') && steps.tree.outputs.verified != 'true' }}
      tree_note: ${{ steps.tree.outputs.note }}
      verified: ${{ steps.queue.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        working-directory: .
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/changed.sh
      # Which part of the side changed (.github/scripts/scope.sh): only narrows
      # what changed.sh selected, e.g. a change to web/e2e/ alone runs no web
      # unit tests and builds no image, a CI file only the workflows that use it.
      - id: scope
        working-directory: .
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/scope.sh

      # The exact tree of this commit already passed every required check on a
      # pull request or an earlier queue run: skip the jobs below
      # (.github/scripts/tree-verified.sh). Also records the tree this run tested.
      - id: tree
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/tree-verified.sh

      # A push to develop of a commit the merge queue already passed with this
      # workflow skips Web checks and Web tests (.github/scripts/queue-verified.sh).
      # `contract` and `build` still run on such a push: the tenant-bundle check
      # runs only in `build`, and `build` keeps develop's Next.js cache current.
      - id: queue
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/queue-verified.sh

  # Generates the contract files for this commit (artifact `contract`) and, for
  # an API change, compares them with the base's.
  contract:
    name: API contract
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    needs: changes
    if: needs.changes.outputs.lint == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate the contract files
        uses: ./.github/actions/generate-contract
        with:
          web-types: 'false'

      - name: Collect them
        run: |
          mkdir -p "$RUNNER_TEMP/contract/head"
          cp api/api/openapi/swagger.yaml api/api/openapi/routes.txt web/src/config/api-route-permissions.json web/src/config/authz-matrix.json "$RUNNER_TEMP/contract/head/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract/head/
          if-no-files-found: error
          retention-days: 5

      # The commit this change is measured against: the merge base for a pull
      # request, the queue's base for a merge group, the previous tip for a push.
      - name: Resolve the base
        id: base
        if: needs.changes.outputs.api == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) git fetch --no-tags --quiet origin "$BASE_REF"; sha="$(git merge-base "origin/$BASE_REF" HEAD)" ;;
            merge_group)  sha="$MG_BASE" ;;
            push)         sha="$EVENT_BEFORE" ;;
            *)            sha="" ;;
          esac
          if [ -n "$sha" ] && ! [[ "$sha" =~ ^0+$ ]]; then
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$sha" || true
            git cat-file -e "${sha}^{commit}" 2>/dev/null && echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
          echo "base: ${sha:-none}"

      # The base is trusted code (the target branch). The commands work both
      # before and after the contract files stopped being committed.
      - name: Generate the base's contract files
        id: basegen
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        env:
          SHA: ${{ steps.base.outputs.sha }}
          GOWORK: 'off'
        run: |
          git worktree add --quiet --detach "$RUNNER_TEMP/base-src" "$SHA"
          cd "$RUNNER_TEMP/base-src/api"
          make swagger >/dev/null
          UPDATE_ROUTE_MANIFEST=1 go test ./tools/lint/openapicontract/ -run '^TestWriteRouteManifest$' -count=1 >/dev/null
          UPDATE_ROUTE_PERMISSIONS=1 go test ./tests/unit -run '^TestRoutePermissionMap' -count=1 >/dev/null
          mkdir -p "$RUNNER_TEMP/contract/base"
          cp api/openapi/swagger.yaml api/openapi/routes.txt ../web/src/config/api-route-permissions.json "$RUNNER_TEMP/contract/base/"

      - name: Compare with the base
        id: diff
        env:
          API: ${{ needs.changes.outputs.api }}
          BASEGEN: ${{ steps.basegen.outcome }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          c="$RUNNER_TEMP/contract"
          mkdir -p "$c/report"
          changed=true
          if [ "$API" != true ]; then
            changed=false # web-only change: the web checks run anyway, nothing to report
          elif [ "$BASEGEN" = success ]; then
            if cmp -s "$c/base/swagger.yaml" "$c/head/swagger.yaml" &&
               cmp -s "$c/base/routes.txt" "$c/head/routes.txt" &&
               cmp -s "$c/base/api-route-permissions.json" "$c/head/api-route-permissions.json"; then
              changed=false
            fi
            (cd api && GOWORK=off go run ./tools/openapidiff -base "$c/base" -head "$c/head" \
              -base-label "${BASE_SHA:0:9}" -head-label "${HEAD_SHA:0:9}") > "$c/report/report.md"
          else
            {
              echo "<!-- openctem-contract-diff -->"
              echo "## API contract changes"
              echo
              echo "The base contract (${BASE_SHA:-none}) could not be generated, so the change could not be compared; the web checks run against the new contract."
            } > "$c/report/report.md"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "contract changed: $changed"
          if [ -s "$c/report/report.md" ]; then
            cat "$c/report/report.md" >> "$GITHUB_STEP_SUMMARY"
            echo "${PR}" > "$c/report/pr"
            echo "report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the report
        if: github.event_name == 'pull_request' && steps.diff.outputs.report == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-report
          path: ${{ runner.temp }}/contract/report/
          retention-days: 5
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  # Posts the report on the pull request (one comment, updated in place). The
  # only job with a write token: it runs no code from the pull request, it
  # posts the report text. Pull requests from forks get a read-only token, so
  # for them the report stays in the contract job's summary.
  contract-comment:
    name: API contract report
    needs: [changes, contract]
    if: >-
      github.event_name == 'pull_request' &&
      needs.contract.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: contract-report
          path: report
      - name: Post or update the comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          f=report/report.md
          [ -s "$f" ] || { echo "no report"; exit 0; }
          marker='<!-- openctem-contract-diff -->'
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)"
          # No comment for a change that leaves the contract as it was, unless
          # an earlier push changed it (then the comment says it no longer does).
          if [ -z "$id" ] && grep -q '^No change to operations' "$f"; then echo "no contract change"; exit 0; fi
          head -c 60000 "$f" > body.md
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
          echo "posted"

  # Quality checks (type check, ESLint, Prettier, palette drift); the Vitest
  # suite runs in parallel in `tests`.
  # Runs for a web change, and for an API change that changed the contract.
  # Same on a PR, in the merge queue and on push; `next build` stays push-only
  # (All-in-one CI builds the web image in the merge queue).
  quality:
    name: Web checks
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    needs: [changes, contract]
    if: (needs.changes.outputs.lint == 'true' || needs.contract.outputs.changed == 'true') && needs.changes.outputs.verified != 'true'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check-palette-drift needs the merge base

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract

      # The contract job's files, then the web API types from the spec.
      - name: Place the generated contract files
        working-directory: .
        run: |
          cp "$RUNNER_TEMP/contract/swagger.yaml" "$RUNNER_TEMP/contract/routes.txt" api/api/openapi/
          cp "$RUNNER_TEMP/contract/api-route-permissions.json" "$RUNNER_TEMP/contract/authz-matrix.json" web/src/config/
          (cd web && npm run generate:api-types)

      # tsc needs more than the default heap: Node sizes it from the machine's
      # memory, and on a self-hosted runner that default (about 2 GB) runs out.
      - name: Run type check
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      # PR-only on purpose (see the history of web/scripts/check-palette-drift.sh).
      - name: Check palette drift
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          base="$(bash ../.github/scripts/effective-base.sh web "origin/${GITHUB_BASE_REF}")"
          bash scripts/check-palette-drift.sh "$base"
          sh scripts/check-palette-drift.test.sh

      # Page anatomy and type scale (research/244): added lines only, like the
      # palette gate. No new StatsCard or hand-built metric tiles, no arbitrary
      # text sizes, one text size per line, no margins on route tab strips.
      - name: Check page anatomy
        if: github.event_name == 'pull_request'
        run: |
          base="$(bash ../.github/scripts/effective-base.sh web "origin/${GITHUB_BASE_REF}")"
          bash scripts/check-page-anatomy.sh "$base"
          sh scripts/check-page-anatomy.test.sh

      # No separator glyphs in UI text (research/248): added lines only. Spacing
      # (MetaLine) or formatList separates facts, not a middle dot, bullet or
      # spaced em dash. Escape with `separator-ok: <reason>`.
      - name: Check separators
        if: github.event_name == 'pull_request'
        run: |
          base="$(bash ../.github/scripts/effective-base.sh web "origin/${GITHUB_BASE_REF}")"
          bash scripts/check-separators.sh "$base"
          sh scripts/check-separators.test.sh

      # Copy rules for added or changed English strings (research/237 R12,
      # R18, R19): no marketing words, "successfully", exclamation marks, em
      # dash asides or Title Case labels. `node scripts/check-copy.mjs --all`
      # lists the existing strings to clean up.
      - name: Check copy
        if: github.event_name == 'pull_request'
        run: |
          base="$(bash ../.github/scripts/effective-base.sh web "origin/${GITHUB_BASE_REF}")"
          node scripts/check-copy.mjs "$base"

      # Every e2e test carries an area tag that web/e2e/impact-map.yml knows,
      # and the selector's own tests pass (research/295). Lists tests with
      # Playwright; needs no browser or running stack.
      - name: Check e2e tags and the impact selector
        run: |
          node --test e2e/ci/select.test.mjs
          node e2e/ci/select.mjs check
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  # Only non-English catalogs changed (no app code, no English text): the
  # catalog tests (src/lib/i18n: key parity, placeholders, sort order) and every
  # test that reads a catalog by path, instead of the whole suite in three
  # shards. `vitest related` is no help here: dictionaries/index.ts imports
  # every catalog, so the module graph links nearly every UI test to any one.
  # Web checks still runs (format, sort order, tsc).
  i18n-tests:
    name: Web i18n tests
    needs: [changes, contract]
    if: needs.changes.outputs.i18n == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract

      - name: Place the generated contract files
        working-directory: .
        run: |
          cp "$RUNNER_TEMP/contract/swagger.yaml" "$RUNNER_TEMP/contract/routes.txt" api/api/openapi/
          cp "$RUNNER_TEMP/contract/api-route-permissions.json" "$RUNNER_TEMP/contract/authz-matrix.json" web/src/config/
          (cd web && npm run generate:api-types)

      - name: Run the catalog tests and the tests that read a catalog
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mapfile -t files < <(grep -rlE 'dictionaries|lib/i18n/' src --include='*.test.ts' --include='*.test.tsx' | sort)
          echo "${#files[@]} test files read a catalog"
          npx vitest run --passWithNoTests src/lib/i18n "${files[@]}"

  # The Vitest suite, in three parallel shards (vitest --shard). Same setup as
  # `Web checks`; the endpoint check reads api/api/openapi/routes.txt.
  tests:
    name: Web tests
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    needs: [changes, contract]
    if: (needs.changes.outputs.web == 'true' || needs.contract.outputs.changed == 'true') && needs.changes.outputs.verified != 'true'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract

      - name: Place the generated contract files
        working-directory: .
        run: |
          cp "$RUNNER_TEMP/contract/swagger.yaml" "$RUNNER_TEMP/contract/routes.txt" api/api/openapi/
          cp "$RUNNER_TEMP/contract/api-route-permissions.json" "$RUNNER_TEMP/contract/authz-matrix.json" web/src/config/
          (cd web && npm run generate:api-types)

      # A Vitest worker (jsdom + v8 coverage) ran out of its default heap and
      # failed a shard; 4 GB per worker fits the hosted runner's 16 GB.
      - name: Run tests (shard ${{ matrix.shard }}/3)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --run --coverage --passWithNoTests --shard=${{ matrix.shard }}/3

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: web/coverage
          flags: web
          name: web-${{ matrix.shard }}
          fail_ci_if_error: false
        continue-on-error: true
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  build:
    name: Build
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    needs: [changes, contract, quality]
    # Runs after a passing or skipped Web checks: a queue-verified push skips
    # Web checks but still builds (the tenant-bundle check below).
    if: >-
      !cancelled() && needs.contract.result == 'success' &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.changes.outputs.web == 'true' || needs.contract.outputs.changed == 'true') &&
      github.event_name == 'push'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contract
          path: ${{ runner.temp }}/contract
      - name: Place the generated contract files
        working-directory: .
        run: |
          cp "$RUNNER_TEMP/contract/swagger.yaml" "$RUNNER_TEMP/contract/routes.txt" api/api/openapi/
          cp "$RUNNER_TEMP/contract/api-route-permissions.json" "$RUNNER_TEMP/contract/authz-matrix.json" web/src/config/
          (cd web && npm run generate:api-types)
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**/*.ts', 'web/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-
            ${{ runner.os }}-nextjs-
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
      # The tenant image must not carry any of the platform console.
      - name: Tenant build holds no console routes
        run: |
          sh scripts/check-tenant-bundle.test.sh
          sh scripts/check-tenant-bundle.sh .next/server
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  web-ok:
    name: Web CI OK
    if: always()
    needs: [changes, contract, quality, tests, i18n-tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All web jobs passed or were skipped; the checks ran where they must
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
          WEB: ${{ needs.changes.outputs.web }}
          LINT: ${{ needs.changes.outputs.lint }}
          I18N: ${{ needs.changes.outputs.i18n }}
          API: ${{ needs.changes.outputs.api }}
          CHANGED: ${{ needs.contract.outputs.changed }}
          TREE_NOTE: ${{ needs.changes.outputs.tree_note }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ -n "$TREE_NOTE" ]; then echo "$TREE_NOTE"; fi
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          required="changes"
          # WEB: app code (checks + unit tests). LINT: app, e2e specs or
          # catalogs (checks). I18N: catalogs only (related tests).
          if [ "$LINT" = true ] || [ "$API" = true ]; then required="$required contract"; fi
          if [ "$VERIFIED" = true ]; then
            # A push the merge queue already passed (queue-verified.sh) skips
            # Web checks and the test jobs; it must still build.
            if [ "$WEB" = true ] || [ "$CHANGED" = true ]; then required="$required build"; fi
          else
            if [ "$LINT" = true ] || [ "$CHANGED" = true ]; then required="$required quality"; fi
            if [ "$WEB" = true ] || [ "$CHANGED" = true ]; then
              required="$required tests"
              if [ "$EVENT" = push ]; then required="$required build"; fi
            fi
            if [ "$I18N" = true ]; then required="$required i18n-tests"; fi
          fi
          for j in $required; do
            r="$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
            if [ "$r" != success ]; then echo "::error::$j must run and pass, got: $r"; exit 1; fi
          done
