name: Release

# One `v*` tag = one GitHub Release for the whole product (API + web). The
# images themselves are published by docker-publish.yml on the same tag.
# Releases v0.1.0..v0.8.0 on this repository's Releases page are the old api
# releases (same repository after the rename); the old ui releases stay on the
# archived openctemio/ui and their tags were imported here as ui/v*. Those never
# trigger this workflow or docker-publish.yml: in GitHub's filter patterns `*`
# does not match `/`, so `v*` matches v0.9.0 but not ui/v0.8.0. No workflow
# listens for ui/v*; the web app is released by the same `v*` tag as the API.

on:
  push:
    tags:
      - "v*"
  # Release Publish (release-publish.yml) dispatches this on the tag
  # (`--ref vX.Y.Z`) when it had to push the tag with GITHUB_TOKEN, whose
  # pushes start no workflow (api/docs/rfcs/RFC-037 §7).
  workflow_dispatch:

permissions:
  contents: read

# Go version: setup-go reads api/go.mod (its `toolchain` directive), the same
# version api/Dockerfile builds with. setup-go also sets GOTOOLCHAIN=local, so a
# separate pin here would silently test and govulncheck an OLDER Go than ships.
env:
  GOWORK: "off"

jobs:
  # The release archives: server, signer, migrations, gateway, web, console,
  # bootstrap-admin and the image kit (release-dist.yml, the same build a pull
  # request dry-runs).
  dist:
    name: Archives
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-dist.yml
    with:
      version: ${{ github.ref_name }}
      full: true

  release:
    name: Create Release
    permissions:
      contents: write
      # Keyless Sigstore signature of checksums-sha256.txt and the SLSA build
      # provenance of every archive (GitHub OIDC).
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs: [dist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/artifacts
          pattern: dist-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # One SPDX SBOM per archive, from its unpacked contents (Go module
      # versions of every binary, npm packages of the web bundles).
      - name: SBOMs
        working-directory: /tmp/artifacts
        run: |
          set -euo pipefail
          for a in *.tar.gz *.zip; do
            d="$(mktemp -d)"
            case "$a" in *.zip) unzip -q "$a" -d "$d" ;; *) tar -C "$d" -xzf "$a" ;; esac
            syft scan "dir:$d" --source-name "$a" -q -o spdx-json="${a}.spdx.json"
          done
      # checksums-sha256.txt pins every archive and SBOM; its Sigstore bundle
      # (checksums-sha256.txt.sigstore.json) names this workflow at this tag.
      - name: Checksums and their signature
        working-directory: /tmp/artifacts
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz *.zip *.spdx.json > checksums-sha256.txt
          cosign sign-blob --yes --bundle checksums-sha256.txt.sigstore.json checksums-sha256.txt
          cosign verify-blob checksums-sha256.txt --bundle checksums-sha256.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: /tmp/artifacts/checksums-sha256.txt
      - name: Release notes header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-header.md <<EOF
          ## Container images (multi-arch: amd64 + arm64)

          \`\`\`bash
          docker pull ghcr.io/openctemio/openctem:${TAG}      # all-in-one (API + web + console + gateway)
          docker pull ghcr.io/openctemio/openctem-api:${TAG}
          docker pull ghcr.io/openctemio/openctem-web:${TAG}
          docker pull ghcr.io/openctemio/openctem-console:${TAG}   # platform console
          docker pull ghcr.io/openctemio/migrations:${TAG}
          docker pull ghcr.io/openctemio/seed:${TAG}
          docker pull ghcr.io/openctemio/admin-cli:${TAG}
          \`\`\`

          Every image is signed with cosign (keyless, GitHub OIDC) and carries a
          signed SPDX SBOM attestation and a signed SLSA build provenance; the
          SBOMs are also attached to this release.
          Verify an image before deploying it:

          \`\`\`bash
          cosign verify ghcr.io/openctemio/openctem-api:${TAG} \\
            --certificate-identity-regexp '^https://github.com/openctemio/openctem/.github/workflows/docker-publish.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type spdxjson ghcr.io/openctemio/openctem-api:${TAG} \\
            --certificate-identity-regexp '^https://github.com/openctemio/openctem/.github/workflows/docker-publish.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify oci://ghcr.io/openctemio/openctem-api:${TAG} --owner openctemio
          \`\`\`

          ## Installing without containers, or from a private registry

          The archives below install every component as programs with systemd
          units (linux amd64/arm64; \`bootstrap-admin\` also for macOS and
          Windows): api/docs/deployment/binary-install.md. For sites whose
          clusters cannot reach the internet, each image is also attached as an
          OCI archive with its signatures (\`openctem-image-*.oci.tar\`, listed
          and signed in \`openctem-images-${TAG}.txt\`), and the image kit builds
          the images from the archives without source code:
          api/docs/deployment/air-gapped.md.

          Verify before use:

          \`\`\`bash
          cosign verify-blob checksums-sha256.txt --bundle checksums-sha256.txt.sigstore.json \\
            --certificate-identity https://github.com/openctemio/openctem/.github/workflows/release.yml@refs/tags/${TAG} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --ignore-missing -c checksums-sha256.txt
          gh attestation verify openctem-server-${TAG}-linux-amd64.tar.gz --owner openctemio
          \`\`\`

          ## Upgrading (Compose deployment, api/deploy)

          Read the upgrade notes below first. Then set \`OPENCTEM_VERSION=${TAG}\` in
          \`api/deploy/.env\` and run \`docker compose pull && docker compose up -d\`:
          the one-shot \`migrate\` service applies the database migrations before the
          API starts (the API refuses to start on an older schema). Back up the
          database and the \`api-data\` volume before upgrading.
          EOF
          sed -i 's/^          //' /tmp/release-header.md
      - name: Create the release (retried on GitHub API errors)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/publish-release.sh "$TAG" /tmp/release-header.md \
            /tmp/artifacts/*.tar.gz /tmp/artifacts/*.zip /tmp/artifacts/*.spdx.json \
            /tmp/artifacts/checksums-sha256.txt /tmp/artifacts/checksums-sha256.txt.sigstore.json
      - name: Sanitize release notes
        # Escape @mentions that are not "by @login" credits; drop raw emails
        # (.github/scripts/release/sanitize-notes.py).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/gh-retry.sh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 .github/scripts/release/sanitize-notes.py notes.md
          bash .github/scripts/release/gh-retry.sh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  release-feed:
    name: Release feed
    needs: [release]
    permissions:
      contents: write
    uses: ./.github/workflows/release-feed.yml
