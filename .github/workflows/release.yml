name: Release

# One `v*` tag = one GitHub Release for the whole product (API + web). The
# images themselves are published by docker-publish.yml on the same tag.
# Releases v0.1.0..v0.8.0 on this repository's Releases page are the old api
# releases (same repository after the rename); the old ui releases stay on the
# archived openctemio/ui and their tags were imported here as ui/v*. Those never
# trigger this workflow or docker-publish.yml: in GitHub's filter patterns `*`
# does not match `/`, so `v*` matches v0.9.0 but not ui/v0.8.0. No workflow
# listens for ui/v*; the web app is released by the same `v*` tag as the API.

on:
  push:
    tags:
      - "v*"
  # Release Publish (release-publish.yml) dispatches this on the tag
  # (`--ref vX.Y.Z`) when it had to push the tag with GITHUB_TOKEN, whose
  # pushes start no workflow (api/docs/rfcs/RFC-037 §7).
  workflow_dispatch:

permissions:
  contents: read

# Go version: setup-go reads api/go.mod (its `toolchain` directive), the same
# version api/Dockerfile builds with. setup-go also sets GOTOOLCHAIN=local, so a
# separate pin here would silently test and govulncheck an OLDER Go than ships.
env:
  GOWORK: "off"

jobs:
  build:
    name: Build bootstrap-admin (${{ matrix.os }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: windows, arch: amd64 }
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          BIN=bootstrap-admin; [ "$GOOS" = windows ] && BIN=bootstrap-admin.exe
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "bin/${BIN}" ./cmd/bootstrap-admin
          NAME="bootstrap-admin-${VERSION}-${GOOS}-${GOARCH}"
          cd bin
          if [ "$GOOS" = windows ]; then zip "../../${NAME}.zip" "$BIN"; else tar czf "../../${NAME}.tar.gz" "$BIN"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-admin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/artifacts
          pattern: bootstrap-admin-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: /tmp/artifacts
        run: sha256sum ./*.tar.gz ./*.zip > checksums-sha256.txt
      - name: Release notes header
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-header.md <<EOF
          ## Container images (multi-arch: amd64 + arm64)

          \`\`\`bash
          docker pull ghcr.io/openctemio/openctem:${TAG}      # all-in-one (API + web + gateway)
          docker pull ghcr.io/openctemio/openctem-api:${TAG}
          docker pull ghcr.io/openctemio/openctem-web:${TAG}
          docker pull ghcr.io/openctemio/migrations:${TAG}
          docker pull ghcr.io/openctemio/seed:${TAG}
          docker pull ghcr.io/openctemio/admin-cli:${TAG}
          \`\`\`

          Every image is signed with cosign (keyless, GitHub OIDC) and carries a
          signed SPDX SBOM attestation; the SBOMs are also attached to this release.
          Verify an image before deploying it:

          \`\`\`bash
          cosign verify ghcr.io/openctemio/openctem-api:${TAG} \\
            --certificate-identity-regexp '^https://github.com/openctemio/openctem/.github/workflows/docker-publish.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type spdxjson ghcr.io/openctemio/openctem-api:${TAG} \\
            --certificate-identity-regexp '^https://github.com/openctemio/openctem/.github/workflows/docker-publish.yml@refs/tags/v' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ## Upgrading (Compose deployment, api/deploy)

          Read the upgrade notes below first. Then set \`OPENCTEM_VERSION=${TAG}\` in
          \`api/deploy/.env\` and run \`docker compose pull && docker compose up -d\`:
          the one-shot \`migrate\` service applies the database migrations before the
          API starts (the API refuses to start on an older schema). Back up the
          database and the \`api-data\` volume before upgrading.
          EOF
          sed -i 's/^          //' /tmp/release-header.md
      - name: Create the release (retried on GitHub API errors)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/publish-release.sh "$TAG" /tmp/release-header.md \
            /tmp/artifacts/*.tar.gz /tmp/artifacts/*.zip /tmp/artifacts/checksums-sha256.txt
      - name: Sanitize release notes
        # Escape @mentions that are not "by @login" credits; drop raw emails
        # (.github/scripts/release/sanitize-notes.py).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release/gh-retry.sh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 .github/scripts/release/sanitize-notes.py notes.md
          bash .github/scripts/release/gh-retry.sh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
