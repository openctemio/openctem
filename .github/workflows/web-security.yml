name: Web Security

# Carried over from openctemio/ui's security.yml. CodeQL moved to codeql.yml and
# secret scanning to repo-security.yml.

# No required check lives here, so this workflow uses `paths:` and does not
# start at all for an API-only change. Same routing as .github/scripts/changed.sh
# (web/ + shared files); keep the two in step. The weekly schedule scans
# everything. No merge_group trigger: it cannot be path-filtered, the PR run
# already scanned the change, and the push to the branch scans it again.

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Node version: web/.nvmrc, the same major web/Dockerfile ships (node:26-alpine).
defaults:
  run:
    working-directory: web

jobs:
  # npm audit, Trivy (fs) and the ESLint security rules in ONE job (one runner,
  # one npm ci). Each scan runs even if an earlier one failed (`!cancelled()`).
  scan:
    name: npm audit, Trivy, ESLint security (web)
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: NPM Audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: NPM Audit (JSON output)
        if: ${{ !cancelled() }}
        run: npm audit --json > npm-audit-results.json || true
      - name: Upload audit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-results
          path: web/npm-audit-results.json
          retention-days: 30
      - name: Trivy Vulnerability Scanner (web)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'web'
          format: 'sarif'
          output: 'trivy-web.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,misconfig'
      - name: Upload Trivy scan results
        if: ${{ !cancelled() && hashFiles('trivy-web.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # The merge queue deletes its temporary gh-readonly-queue branch when a group
        # is rebuilt; an upload still in flight then fails with ref not found. The scan
        # result above already ran; only the upload is tolerated in merge_group.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        with:
          sarif_file: 'trivy-web.sarif'
          category: trivy-web
      - name: ESLint Security
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0
          npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
      - name: Upload ESLint results
        if: ${{ !cancelled() && hashFiles('web/eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: web/eslint-results.sarif
          category: eslint-web
        continue-on-error: true

  snyk:
    name: Snyk Security Scan (web)
    if: vars.ENABLE_SNYK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=web/package.json

  docker-scan:
    name: Docker Image Scan (web)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image compiles against the generated contract files (not committed).
      - name: Generate the contract files
        uses: ./.github/actions/generate-contract
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          push: false
          load: true
          tags: openctem-web:scan
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
      - name: Run Trivy on the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'openctem-web:scan'
          format: 'sarif'
          output: 'trivy-docker-web.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Docker scan results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # The merge queue deletes its temporary gh-readonly-queue branch when a group
        # is rebuilt; an upload still in flight then fails with ref not found. The scan
        # result above already ran; only the upload is tolerated in merge_group.
        continue-on-error: ${{ github.event_name == 'merge_group' }}
        with:
          sarif_file: 'trivy-docker-web.sarif'
          category: docker-web
