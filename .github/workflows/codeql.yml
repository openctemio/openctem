name: CodeQL

# Advanced setup, one matrix over the languages to analyse. Default setup is NOT used:
# it is undocumented whether it finds a go.mod in a subdirectory, and Go has
# no build-mode `none`, so the Go leg builds explicitly inside api/.
# `category` keeps the two languages' results separate (the documented
# monorepo pattern). '/language:go' is the category openctemio/api already
# used, so existing Go alerts keep matching after the move.
#
# Which languages:
#   pull_request   only the side that changed (api/ -> go, web/ ->
#                  javascript-typescript, shared files -> both; rules in
#                  .github/scripts/changed.sh). Alerts show up on the PR.
#   merge_group    none: the PR head was already analysed and gated, so a
#                  second analysis of the same code in the queue would cost a
#                  runner for no gate. `CodeQL OK` passes with the matrix skipped.
#   push develop   only the side that changed, by the pull request rules.
#                  Code scanning compares each PR against the latest analysis
#                  of every category on the base branch; a language whose code
#                  did not change keeps its last analysis, which still matches
#                  that code. Query versions change only with the pinned action
#                  or .github/codeql/ (CI files, which select both languages).
#   push main      ALWAYS both (main moves only on releases).
#   schedule       daily 03:00 UTC, ALWAYS both, on develop: GitHub runs the
#                  default branch's (main's) copy of this file, so the analyze
#                  job checks out develop and uploads for refs/heads/develop
#                  (the action's ref/sha inputs). develop's baseline is then
#                  never older than a day for either language.
#
# Gate: CodeQL never fails a run on findings, so on pull_request `CodeQL OK`
# fails when the PR introduces open alerts of severity medium or higher that
# the base branch does not have (.github/scripts/codeql-new-alerts.sh). It
# passes when the analysed side has none, when nothing was analysed, and is a
# no-op on merge_group. Do not replace this with a ruleset `code_scanning`
# rule: that rule waits forever for a side this workflow skipped.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    # merge_group analyses nothing (see the header), so do not even spend a
    # runner on detection; `CodeQL OK` passes with everything skipped.
    if: github.event_name != 'merge_group'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    outputs:
      pool: ${{ steps.pool.outputs.pool }}
      languages: ${{ steps.lang.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-gh
      - id: pool
        uses: ./.github/actions/ci-pool
        with:
          share: ${{ vars.CI_SELFHOSTED_SHARE }}
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/changed.sh
      # Which part of the side changed (.github/scripts/scope.sh): only narrows
      # what changed.sh selected, e.g. a change to web/e2e/ alone runs no web
      # unit tests and builds no image, a CI file only the workflows that use it.
      - id: scope
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/scope.sh
      - id: lang
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Shipped code only: the e2e suite and the catalogs are not analysed again.
          API: ${{ steps.f.outputs.api == 'true' && (steps.scope.outputs.api_code == 'true' || steps.scope.outputs.ci_self == 'true') }}
          WEB: ${{ steps.f.outputs.web == 'true' && (steps.scope.outputs.web_app == 'true' || steps.scope.outputs.ci_self == 'true') }}
        run: bash .github/scripts/codeql-languages.sh

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_CODEQL) || (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || needs.changes.outputs.pool || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_HEAVY || needs.changes.outputs.pool)) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The daily schedule analyses develop (see the header).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - id: target
        if: github.event_name == 'schedule'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Initialize CodeQL (go)
        if: matrix.language == 'go'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config-go.yml # go/log-injection replaced, see the file
      - name: Build (go)
        if: matrix.language == 'go'
        working-directory: api
        env:
          GOWORK: "off"
        run: go build ./...
      # The TypeScript extractor needs node on PATH. GitHub-hosted images ship
      # one; the self-hosted runner image does not.
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Initialize CodeQL (javascript-typescript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          # Analyse the web app only (api/ has a k6 script and doc snippets).
          config: |
            paths:
              - web
            paths-ignore:
              - '**/node_modules/**'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          # Empty (every event but the schedule): the event's own ref and sha.
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || '' }}
          sha: ${{ steps.target.outputs.sha }}

  codeql-ok:
    name: CodeQL OK
    if: always()
    needs: [changes, analyze]
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null
      # Only after a successful analysis on a PR: a skipped matrix has nothing to
      # compare and merge_group was gated on the PR head.
      - if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        uses: ./.github/actions/setup-gh
      - name: No new medium-or-higher alerts
        if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bash .github/scripts/codeql-new-alerts.sh
