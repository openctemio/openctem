name: CodeQL

# Advanced setup, one matrix over the languages to analyse. Default setup is NOT used:
# it is undocumented whether it finds a go.mod in a subdirectory, and Go has
# no build-mode `none`, so the Go leg builds explicitly inside api/.
# `category` keeps the two languages' results separate (the documented
# monorepo pattern). '/language:go' is the category openctemio/api already
# used, so existing Go alerts keep matching after the move.
#
# Which languages:
#   pull_request   only the side that changed (api/ -> go, web/ ->
#                  javascript-typescript, shared files -> both; rules in
#                  .github/scripts/changed.sh). Alerts show up on the PR.
#   merge_group    none: the PR head was already analysed and gated, so a
#                  second analysis of the same code in the queue would cost a
#                  runner for no gate. `CodeQL OK` passes with the matrix skipped.
#   push, weekly   ALWAYS both: code scanning compares each PR against the
#                  latest analysis of every category on the base branch, so
#                  develop/main need a fresh baseline for both languages.
#
# Gate: CodeQL never fails a run on findings, so on pull_request `CodeQL OK`
# fails when the PR introduces open alerts of severity medium or higher that
# the base branch does not have (.github/scripts/codeql-new-alerts.sh). It
# passes when the analysed side has none, when nothing was analysed, and is a
# no-op on merge_group. Do not replace this with a ruleset `code_scanning`
# rule: that rule waits forever for a side this workflow skipped.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    # merge_group analyses nothing (see the header), so do not even spend a
    # runner on detection; `CodeQL OK` passes with everything skipped.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the PR's commits and labels (changed.sh)
      checks: read # green-base.sh and release-provenance.sh read a commit's check runs
    outputs:
      languages: ${{ steps.lang.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/changed.sh
      - id: lang
        env:
          EVENT: ${{ github.event_name }}
          API: ${{ steps.f.outputs.api }}
          WEB: ${{ steps.f.outputs.web }}
        run: |
          if [[ "$EVENT" == push || "$EVENT" == schedule ]]; then API=true WEB=true; fi
          langs=()
          [[ "$API" == true ]] && langs+=('"go"')
          [[ "$WEB" == true ]] && langs+=('"javascript-typescript"')
          languages="[$(IFS=,; echo "${langs[*]}")]"
          echo "languages=$languages" | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Initialize CodeQL (go)
        if: matrix.language == 'go'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config-go.yml # go/log-injection replaced, see the file
      - name: Build (go)
        if: matrix.language == 'go'
        working-directory: api
        env:
          GOWORK: "off"
        run: go build ./...
      - name: Initialize CodeQL (javascript-typescript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          # Analyse the web app only (api/ has a k6 script and doc snippets).
          config: |
            paths:
              - web
            paths-ignore:
              - '**/node_modules/**'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  codeql-ok:
    name: CodeQL OK
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null
      # Only after a successful analysis on a PR: a skipped matrix has nothing to
      # compare and merge_group was gated on the PR head.
      - if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No new medium-or-higher alerts
        if: github.event_name == 'pull_request' && needs.analyze.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # A release pull request is compared with develop (the script decides).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/scripts/codeql-new-alerts.sh

  # Early warning (develop only): once the push analysis of both languages is
  # in, list the high or critical alerts develop has and main does not, in one
  # issue labelled `security`, so they are fixed before a release instead of at
  # release time (.github/scripts/early-warning.sh; api/docs/development/ci-cd.md,
  # "Early warning"). Never a gate: a failure here changes no required check.
  early-warning:
    name: Early warning (develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.analyze.result == 'success'
    needs: [analyze]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: read
      issues: write # open, update and close the one early-warning issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: High or critical alerts on develop that main does not have
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/early-warning.sh code
