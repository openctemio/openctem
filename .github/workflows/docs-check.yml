name: Docs check

# Markdown in this repository must be English, must not carry private
# addresses or internal host names, and its relative links must resolve.
# Links from code to docs.openctem.io and to files on GitHub must resolve too.
# Runs on every PR with no path filter so both jobs can be required checks.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Links, language and private addresses
        run: python3 scripts/docs_check.py .
      # api/docs/rfcs/README.md index table is generated from the RFC headers.
      - name: RFC index is current
        run: |
          python3 scripts/rfc_index_test.py
          python3 scripts/rfc_index.py --check

  # docs.openctem.io links (page and anchor) and github.com/openctemio file
  # links in code, against the docs site source (openctemio/docs main) and
  # the repositories they name.
  docs-links:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/docs
          ref: main
          path: .docs-site
          persist-credentials: false
      - name: Documentation links in code
        run: python3 scripts/check_docs_links.py --docs .docs-site --fetch-other --live .
