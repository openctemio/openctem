name: API CI

# The Go API lives in api/. This workflow ALWAYS starts (no `paths:` filter, which
# would leave required checks Pending); the `changes` job decides whether the
# real jobs run, and `API CI OK` is the single required check. The real jobs run
# for api/ and shared files only (rules: .github/scripts/changed.sh), so a
# web-only change costs this workflow two ~10 s jobs and nothing else.
#
# Two tiers (`changes` decides; the `full` output of .github/scripts/changed.sh):
#   fast            pull_request. `API static checks` (one job: every short gate
#                   and the linters as steps) + `Tests (Postgres + Redis)`: the
#                   whole suite against real Postgres and Redis in 6 shards
#                   without the race detector, so the tenant-isolation and other
#                   DB-backed tests fail on the PR, not first in the merge queue
#                   (owner decision D-30). `Tests (least-privilege DB role)` and
#                   `Migrations (PostgreSQL 18)` run on a PR only when it changes
#                   a migration or the role script. PR runs are cancelled by a
#                   newer push to the same PR (concurrency below).
#   full            merge_group, push, and a PR with the `ci:full` label or a
#                   changed CI definition. The suite in 8 shards with -race,
#                   the least-privilege suite (D-6), PostgreSQL 18, plus
#                   `Release Binaries` (not on a PR), and on main the Docker build.
# `API CI OK` refuses a merge_group or push run that was not the full tier, so
# nothing reaches develop/main without it.
# Job bodies are carried over from openctemio/api's ci.yml; see git log for the
# reasoning behind each gate.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

# Only a PR's older run is cancelled by a newer push to it. Never a merge-queue
# run (a cancelled required check ejects the group from the queue), a branch
# push (it is the branch's baseline), a tag or a schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Service containers pull the CI image mirror (ghcr.io/openctemio/mirror).
  packages: read

# Go version: setup-go reads api/go.mod (its `toolchain` directive), the same
# version api/Dockerfile builds with. setup-go also sets GOTOOLCHAIN=local, so a
# separate pin here would silently test and govulncheck an OLDER Go than ships.
env:
  GOWORK: "off"

defaults:
  run:
    working-directory: api

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the `ci:full` label (changed.sh reads it live)
      actions: read # queue-verified.sh reads the merge queue's runs of this commit
    outputs:
      api: ${{ steps.f.outputs.api == 'true' && steps.queue.outputs.verified != 'true' }}
      verified: ${{ steps.queue.outputs.verified }}
      full: ${{ steps.f.outputs.full }}
      migrations: ${{ steps.f.outputs.migrations }}
      test_matrix: ${{ steps.tier.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: f
        working-directory: .
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/changed.sh
      # A push to develop of a commit the merge queue already passed with this
      # workflow skips the jobs below (.github/scripts/queue-verified.sh).
      - id: queue
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/queue-verified.sh

      # The shards of `Tests (Postgres + Redis)` for this tier. Full: 8 shards
      # with -race. Fast: 6 shards without it (same tests, about half the
      # runner time; the race detector runs in the queue and on push).
      # `API static checks` proves every split covers every test exactly once.
      - id: tier
        working-directory: .
        env:
          FULL: ${{ steps.f.outputs.full }}
        run: |
          if [ "$FULL" = true ]; then n=8 race=true; else n=6 race=false; fi
          m="$(jq -nc --argjson n "$n" --argjson race "$race" \
            '[range($n) | {shard: ., total: $n, race: $race}]')"
          echo "test_matrix=$m" | tee -a "$GITHUB_OUTPUT"

      # Runs on every PR, also a docs-only one that skips the jobs below.
      # Changelog entries live one file per change in api/changelog.d/, so
      # pull requests never conflict on CHANGELOG.md. This also refuses
      # merge-conflict markers committed anywhere in the repository.
      - name: Changelog fragments
        run: python3 scripts/changelog.py check

  # Every short gate in ONE job (one runner, one checkout, one setup-go) instead
  # of six. Steps run in order and the first failure fails the job; the step
  # name says which gate it was.
  static:
    name: API static checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # base branch for the migration diff and golangci --new-from-rev

      # security-lint.sh expects <root>/{api,agent,sdk-go}. The monorepo root
      # already has api/; the two siblings are checked out next to it.
      - name: Checkout sensor (as agent/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: openctemio/sensor
          path: agent

      - name: Checkout sdk-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: openctemio/sdk-go
          path: sdk-go

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum

      # The analysis caches of golangci-lint, and the installed staticcheck
      # binary (its version is in the key), so a run only re-analyses what
      # changed. A cache is a speed-up only: a miss runs the same checks.
      - name: Cache lint tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/golangci-lint
            ~/go/bin/staticcheck
          key: lint-${{ runner.os }}-${{ hashFiles('api/go.sum', 'api/.golangci.yml', 'api/Makefile') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('api/go.sum', 'api/.golangci.yml', 'api/Makefile') }}-
            lint-${{ runner.os }}-

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}"

      # PR-only: it reads the PR's labels (allow-destructive-migration).
      - name: Migration Safety
        if: github.event_name == 'pull_request'
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }}
        run: |
          BASE_REF="$(bash ../.github/scripts/effective-base.sh api "origin/${GITHUB_BASE_REF}")"
          export BASE_REF
          bash scripts/check-migrations.sh

      # Parallel PRs pick the same "next" number (#767 and #773 both took
      # 000261). Fails on a duplicate version, and on a PR or queued group
      # that adds a version not above the base's highest: golang-migrate
      # silently skips it on databases that are already past it. In the merge
      # queue the base is merge_group.base_sha, i.e. including the groups
      # ahead, so two queued PRs with the same number cannot both land.
      # On pull_request "below the base max" is only a warning: the merge
      # queue renumbers a PR's migrations when it enqueues it. merge_group and
      # push keep it an error; duplicates fail everywhere. A push to develop is
      # compared with develop before the push (see the push branch below).
      - name: Migration Versions
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          bash .github/scripts/check-migration-versions.test.sh >/dev/null
          bash .github/scripts/pr-migration-renumber.test.sh >/dev/null
          bash api/scripts/dev-tools.test.sh >/dev/null
          bash api/deploy/backup.test.sh >/dev/null
          bash api/deploy/backup/overlay.test.sh >/dev/null
          case "$EVENT" in
            pull_request) MIGRATION_BELOW_BASE=warning bash .github/scripts/check-migration-versions.sh "origin/${BASE_REF}" ;;
            merge_group)  bash .github/scripts/check-migration-versions.sh "$MG_BASE" ;;
            *)
              # A push to develop that skipped the queue (a direct or admin
              # merge) is checked against develop as it was before the push,
              # so a migration numbered at or below develop's highest turns
              # develop red at once instead of being skipped silently on
              # databases that are already past it.
              base=""
              if [ "$PUSH_REF" = "refs/heads/develop" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                base="$PUSH_BEFORE"
              fi
              bash .github/scripts/check-migration-versions.sh ${base:+"$base"} ;;
          esac

      # PR only: a migration whose number develop has taken since is
      # renumbered in this runner (never committed) so the checks and tests
      # below see the tree the merge queue will merge. merge_group and push
      # keep the hard error above.
      - name: Renumber this PR's clashing migrations (this run only)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash .github/scripts/pr-migration-renumber.sh

      - name: SQL Schema Drift
        run: bash scripts/check-sql-schema.sh

      # RFC-042: configs/asset-types.yaml is the one definition of asset
      # types, classes and lenses. Fails when the generated Go/TS or the
      # asset_types seed in the newest registry migration drifted from it.
      # The live-schema half runs in internal/infra/postgres
      # (TestAssetTypeRegistry_*) on the full tier.
      - name: Asset Types Drift
        run: GOWORK=off go run ./cmd/gen-asset-types -check

      # The module registry (RFC-064): configs/modules/*.yaml generates the Go
      # catalog, the web constants and the modules rows (newest registry
      # migration). Fails when any of them drifted from the YAML.
      - name: Module Registry Drift
        run: GOWORK=off go run ./cmd/gen-modules -check

      # Sensor protocol v3 (RFC-059): buf lint, buf breaking against the
      # base branch, and the committed Go code matches the .proto.
      - name: Sensor Protocol v3 (buf lint, breaking, generated code)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/${BASE_REF}" ;;
            merge_group)  base="$MG_BASE" ;;
            *)            base="HEAD~1" ;;
          esac
          bash scripts/check-proto.sh "$base"

      - name: Security Gates (security lint)
        working-directory: .
        env:
          SECLINT_ROOT: ${{ github.workspace }}
          SECLINT_STRICT: "1"
        run: bash api/scripts/security-lint.sh

      - name: Security Gates (tenant-scope analyzer)
        run: go test ./tools/lint/getbyid/... -count=1

      # D-11: no SELECT/UPDATE/DELETE of a tenant-scoped row by id without a
      # tenant predicate (shrink-only allowlist). The schema half of this test
      # (tenant_tables.txt vs the migrated DB) runs on the Postgres tier.
      - name: Security Gates (tenantless SQL guard)
        run: go test ./tools/lint/tenantsql/... -count=1

      # No new SQL that decides from the raw tenant_members.role label: read
      # v_user_effective_role (shrink-only allowlist).
      - name: Security Gates (raw membership role guard)
        run: go test ./tools/lint/rawrole/... -count=1

      # No new err.Error(), lower error text or entity id in a response
      # message, stored status or audit message (shrink-only baseline;
      # docs/architecture/error-responses.md).
      - name: Security Gates (error message leak guard)
        run: go test ./tools/lint/errleak/... -count=1

      - name: Security Gates (sensor vocabulary guard)
        run: go test ./tools/lint/sensorvocab/... -count=1

      # RFC-041: every route belongs to one plane and follows the API
      # conventions; today's violations are a shrink-only baseline.
      - name: Route Style (planes and conventions)
        run: go test ./tools/lint/routestyle/... ./internal/infra/http/routes/plane/... -count=1

      # Generates the spec from the handler annotations (it is not committed),
      # then checks it against the routes (scripts/check-openapi.sh).
      - name: OpenAPI Contract
        run: bash scripts/check-openapi.sh

      # Gateway: the single public entry point (api/deploy/gateway). Validates
      # the Caddyfile in every TLS mode, the entrypoint's refusals, and the
      # routing table against stub upstreams; and that the production compose
      # renders. The all-in-one image (deploy/allinone) embeds the same files.
      - name: Gateway Routing (smoke test)
        run: bash deploy/gateway/smoke-test.sh

      - name: Gateway Routing (production compose renders)
        working-directory: api/deploy
        run: |
          # The first-start path: setup.sh writes .env (host name + generated secrets).
          ./setup.sh ctem.example.com
          test "$(stat -c %a .env)" = 600
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.http-redirect.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.plain-http.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.sensor-passthrough.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.job-signer.yml config -q
          OPENCTEM_SENSOR_GATEWAY=passthrough SENSOR_PUBLIC_HOSTNAME=sensors.example.test SENSOR_PUBLIC_HOST=sensors.example.test:443 \
            docker compose -f docker-compose.yml -f docker-compose.sensor-passthrough.yml config -q
          # Only the gateway publishes a port.
          published="$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key')"
          echo "services with published ports: $published"
          test "$published" = "gateway"
          # Every image the stack pulls by default is one a release publishes
          # (docker-publish.yml), under its current name.
          published_names="$(yq -r '.jobs.merge.strategy.matrix.image[].name' ../../.github/workflows/docker-publish.yml)"
          for img in $(docker compose -f docker-compose.yml -f docker-compose.job-signer.yml config --images | sort -u); do
            case "$img" in
              ghcr.io/openctemio/*)
                name="${img#ghcr.io/openctemio/}"; name="${name%%:*}"
                grep -qx "$name" <<<"$published_names" || { echo "::error::$img is not published by docker-publish.yml"; exit 1; } ;;
            esac
          done
          rm .env

      # The shards of the DB-backed jobs cover every package and every
      # top-level test of a split package exactly once. 8: full tier,
      # 6: fast tier and least-privilege, 3: api-pg-compat.yml.
      - name: Test shards cover every test
        run: |
          bash ../.github/scripts/go-shard.sh check 8 6 3

      # vet, staticcheck and golangci-lint: steps of this job (one runner, one
      # checkout, one setup-go) rather than a job of their own. The test shards
      # take longer, so this adds no wall time.
      - name: Lint (go vet)
        run: go vet ./...

      - name: Lint (staticcheck)
        run: |
          STATICCHECK_VERSION=v0.7.0
          if ! command -v staticcheck >/dev/null 2>&1 || ! staticcheck -version | grep -q "${STATICCHECK_VERSION#v}"; then
            go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}
          fi
          staticcheck ./...

      - name: Lint (golangci-lint on new code)
        if: github.event_name == 'pull_request'
        run: |
          base="$(bash ../.github/scripts/effective-base.sh api "origin/${GITHUB_BASE_REF}")"
          make lint-new BASE_REF="$base"

  # The OpenAPI spec, generated once and handed to the test and least-privilege
  # shards (14 shards on the full tier each generated it: ~27 runner-minutes per
  # merge group, and in the queue nothing is cached). Same wall time: the shards
  # start their tests when the spec arrives instead of generating it.
  spec:
    name: OpenAPI spec
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # Same rule as the shards: a merge-queue ref neither restores nor saves.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum
      - name: Generate the OpenAPI spec
        run: make swagger
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec
          path: api/api/openapi/swagger.yaml
          if-no-files-found: error
          retention-days: 1

  # Every event (PRs included): the whole suite against real Postgres and
  # Redis, so the DB-backed tests run too. The shard list comes from `changes`
  # (fast tier 6 shards without -race, full tier 8 with -race).
  test:
    name: Tests (Postgres + Redis)
    needs: [changes, spec]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # The suite is split into parallel shards (.github/scripts/go-shard.sh:
    # the few packages that hold most of the run time are split by test name
    # over every shard, the rest go whole to one shard each).
    # `Static checks` proves the shards together cover every test once.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    services:
      postgres:
        image: ghcr.io/openctemio/mirror/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openctem
          # Job-scoped throwaway database: no password at all (trust auth on
          # the service network), so no credential literal lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ghcr.io/openctemio/mirror/redis:7-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the test merge's base parent, for the renumber below

      - name: Renumber this PR's clashing migrations (this run only)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash .github/scripts/pr-migration-renumber.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum

      # The spec is generated, not committed; the contract tests read it. The
      # `spec` job generated it once for every shard (a shard used to spend
      # 1.5-2 minutes on it).
      - name: Download the OpenAPI spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-spec
          path: api/api/openapi

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Apply migrations to the test database
        run: migrate -path migrations -database "$DATABASE_URL" up
        env:
          DATABASE_URL: postgres://openctem@localhost:5432/app_test?sslmode=disable

      # Explicit -timeout: the default 10m per package binary is too tight for
      # the -race suite on a slow or busy runner (it takes ~5m normally).
      # OPENCTEM_TEST_DB_REQUIRED: testdb fails instead of skipping when the
      # database is missing or unreachable. -json feeds the skip check below;
      # the jq filter prints the same log that -v would.
      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        # shell: bash means -o pipefail. Without it a failing go test is hidden
        # by the pipe into tee/jq and the step goes green.
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          WITH_RACE: ${{ matrix.race }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: openctem
          DB_NAME: app_test
          DATABASE_URL: postgres://openctem@localhost:5432/app_test?sslmode=disable
          OPENCTEM_TEST_DB_REQUIRED: "1"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          race_flag=()
          if [ "$WITH_RACE" = true ]; then race_flag=(-race); fi
          bash ../.github/scripts/go-shard-run.sh "$SHARD" "$TOTAL" test.json \
            "${race_flag[@]}" -timeout 20m -coverprofile=coverage.out -covermode=atomic

      # A test that skips itself on a failed ping (t.Skipf) would otherwise let
      # this job go green without running its DB checks.
      - name: No DB-backed test was skipped
        if: ${{ !cancelled() }}
        run: bash ../.github/scripts/check-db-test-skips.sh test.json

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./api/coverage.out
          flags: api
          name: api-${{ matrix.shard }}-of-${{ matrix.total }}
          fail_ci_if_error: false

  # D-6: the API connects as a least-privilege role (docs/deployment/database-roles.md).
  # Full tier, and on a PR that changes a migration or the role script (where a
  # missing grant comes from): bootstrap a fresh database with deploy/postgres/least-privilege-roles.sql,
  # apply every migration AS THE MIGRATOR (no migration may need a superuser),
  # re-run the script (idempotent), then run the DB-backed suite AS THE APP ROLE.
  # Tests that replay a migration use DATABASE_MIGRATE_URL (testdb.MigratorURL).
  # Any runtime statement the app role may not run fails here with 42501.
  least-privilege:
    name: Tests (least-privilege DB role)
    needs: [changes, spec]
    if: needs.changes.outputs.api == 'true' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.migrations == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
        total: [6]
    services:
      postgres:
        image: ghcr.io/openctemio/mirror/postgres:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: postgres
          # Job-scoped throwaway database, trust auth on the service network:
          # no credential literal in the repo. Role separation is what is
          # under test, not passwords.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: ghcr.io/openctemio/mirror/redis:7-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPER_URL: postgres://postgres@localhost:5432/lp_test?sslmode=disable
      MIGRATOR_URL: postgres://openctem_migrator@localhost:5432/lp_test?sslmode=disable
      APP_ROLE_URL: postgres://openctem_app@localhost:5432/lp_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the test merge's base parent, for the renumber below

      - name: Renumber this PR's clashing migrations (this run only)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash .github/scripts/pr-migration-renumber.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum

      # The spec is generated, not committed; the contract tests read it. The
      # `spec` job generated it once for every shard (a shard used to spend
      # 1.5-2 minutes on it).
      - name: Download the OpenAPI spec
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openapi-spec
          path: api/api/openapi

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Bootstrap the roles on a fresh database
        run: psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f deploy/postgres/least-privilege-roles.sql

      - name: Apply every migration as the migrator (not a superuser)
        run: migrate -path migrations -database "$MIGRATOR_URL" up

      - name: Re-run the bootstrap (idempotent; verifies grants on the migrated schema)
        run: psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f deploy/postgres/least-privilege-roles.sql

      - name: The app role can reach the database (so a skip cannot pass silently)
        run: psql "$APP_ROLE_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM tenants'

      # OPENCTEM_TEST_DB_REQUIRED + the skip check: a DB test that skipped for a
      # missing database fails the job instead of passing silently. The two
      # tests that need CREATEDB (a superuser) skip here by design and run in
      # Tests (Postgres + Redis).
      - name: Run the DB-backed suite as the app role (shard ${{ matrix.shard }}/${{ matrix.total }})
        shell: bash # -o pipefail: the pipe into tee/jq must not hide a failure
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          OPENCTEM_TEST_DB_REQUIRED: "1"
          DATABASE_URL: ${{ env.APP_ROLE_URL }}
          DATABASE_MIGRATE_URL: ${{ env.MIGRATOR_URL }}
          # testdb.PrivateDatabase only: CREATE DATABASE + migrations need a superuser.
          DATABASE_ADMIN_URL: ${{ env.SUPER_URL }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: openctem_app
          DB_NAME: lp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          bash ../.github/scripts/go-shard-run.sh "$SHARD" "$TOTAL" lp-test.json -timeout 30m

      - name: No DB-backed test was skipped
        if: ${{ !cancelled() }}
        run: bash ../.github/scripts/check-db-test-skips.sh lp-test.json

  # The next PostgreSQL major: every migration on a fresh PostgreSQL 18
  # database plus the schema probes that read the catalog (PostgreSQL 18
  # records NOT NULL constraints in pg_constraint, which a catalog query must
  # allow for). The full suite runs on the supported 17 above. Same tiers as
  # the least-privilege job.
  pg18:
    name: Migrations (PostgreSQL 18)
    needs: changes
    if: needs.changes.outputs.api == 'true' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.migrations == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # postgres:18-alpine in .github/ci-images.txt (bump both together).
      PG18_DIGEST: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      DATABASE_URL: postgres://openctem@localhost:5432/app_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the test merge's base parent, for the renumber below

      - name: Renumber this PR's clashing migrations (this run only)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: bash .github/scripts/pr-migration-renumber.sh

      # The CI image mirror first; its upstream (same digest) until the mirror
      # has copied the image.
      - name: Start PostgreSQL 18
        working-directory: .
        run: |
          img="ghcr.io/openctemio/mirror/postgres:18-alpine@$PG18_DIGEST"
          if ! docker pull -q "$img"; then
            img="public.ecr.aws/docker/library/postgres:18-alpine@$PG18_DIGEST"
            bash .github/scripts/retry.sh docker pull -q "$img"
          fi
          docker run -d --name pg18 -p 5432:5432 -e POSTGRES_USER=openctem \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=app_test "$img"
          # Over TCP: the entrypoint's init server listens on the socket only.
          for _ in $(seq 1 60); do
            docker exec pg18 pg_isready -h 127.0.0.1 -U openctem -d app_test -q && exit 0
            sleep 1
          done
          docker logs pg18
          exit 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Apply every migration
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Schema probes on the migrated database
        env:
          OPENCTEM_TEST_DB_REQUIRED: "1"
        run: go test -count=1 -run 'TestCheckSensorRename' ./internal/infra/postgres/

  # A push to develop whose jobs were skipped (the merge queue passed this
  # commit) still keeps develop's Go cache current: pull requests restore it,
  # and setup-go writes it only when no cache for this go.sum exists yet.
  warm-cache:
    name: Go cache (develop)
    needs: changes
    if: needs.changes.outputs.verified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum
      - name: Fill the cache (only when there was none for this go.sum)
        if: steps.go.outputs.cache-hit != 'true'
        run: go build ./... && go vet ./...

  # Merge queue and pushes only: the release-style static binaries (the former
  # separate `Build` job).
  binaries:
    name: Release Binaries
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          # A merge-queue ref can neither read develop's cache nor share what
          # it writes, so it neither restores nor saves one.
          cache: ${{ github.event_name != 'merge_group' }}
          cache-dependency-path: api/go.sum

      - name: Build release binaries (linux/amd64, static)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/openctem ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/bootstrap-admin ./cmd/bootstrap-admin

      - name: Upload API artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-linux-amd64
          path: api/dist/openctem

      - name: Upload Bootstrap Admin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-admin-linux-amd64
          path: api/dist/bootstrap-admin

  # The ONE required status check for the API. Runs even when everything above
  # was skipped (non-API change, or a tier that does not apply to this event),
  # and fails if any job failed or was cancelled.
  api-ok:
    name: API CI OK
    if: always()
    needs: [changes, static, test, least-privilege, pg18, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: All API jobs passed or were skipped; the event's tier actually ran
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
          API: ${{ needs.changes.outputs.api }}
          FULL: ${{ needs.changes.outputs.full }}
          MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          # Skipped is fine only when the area did not change. When it did,
          # the tier for this event must have RUN and passed, so a mistyped
          # condition cannot wave a queued PR through without its tests.
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo "::error::changes must pass"; exit 1
          fi
          # Only a pull request may run the fast tier.
          if [ "$EVENT" != pull_request ] && [ "$FULL" != true ]; then
            echo "::error::$EVENT must run the full tier (full=$FULL)"; exit 1
          fi
          if [ "$API" = true ]; then
            required="changes static test"
            if [ "$FULL" = true ] || [ "$MIGRATIONS" = true ]; then required="$required least-privilege pg18"; fi
            if [ "$EVENT" != pull_request ]; then required="$required binaries"; fi
            for j in $required; do
              r="$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
              if [ "$r" != success ]; then echo "::error::$j must run and pass for $EVENT, got: $r"; exit 1; fi
            done
          fi
