name: API CI

# The Go API lives in api/. This workflow ALWAYS starts (no `paths:` filter, which
# would leave required checks Pending); the `changes` job decides whether the
# real jobs run, and `API CI OK` is the single required check. The real jobs run
# for api/ and shared files only (rules: .github/scripts/changed.sh), so a
# web-only change costs this workflow two ~10 s jobs and nothing else.
#
# Two tiers:
#   pull_request    `API static checks` (one job, every short gate as a step) +
#                   `Tests (Postgres + Redis)`: the whole suite with -race
#                   against real Postgres and Redis, so the tenant-isolation and
#                   other DB-backed tests fail on the PR, not first in the merge
#                   queue (owner decision D-30). PR runs are cancelled by a newer
#                   push to the same PR (concurrency below).
#   merge_group,    the same, plus `Release Binaries`, and on main the Docker
#   push            build.
# `API CI OK` needs the DB-backed tests on every event, so nothing reaches
# develop/main without them, and they ran on the PR already. `Tests
# (least-privilege DB role)` (D-6) runs on every event too.
# Job bodies are carried over from openctemio/api's ci.yml; see git log for the
# reasoning behind each gate.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

# Only a PR's older run is cancelled by a newer push to it. Never a merge-queue
# run (a cancelled required check ejects the group from the queue), a branch
# push (it is the branch's baseline), a tag or a schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Go version: setup-go reads api/go.mod (its `toolchain` directive), the same
# version api/Dockerfile builds with. setup-go also sets GOTOOLCHAIN=local, so a
# separate pin here would silently test and govulncheck an OLDER Go than ships.
env:
  GOWORK: "off"

defaults:
  run:
    working-directory: api

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        working-directory: .
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/changed.sh

  # Every short gate in ONE job (one runner, one checkout, one setup-go) instead
  # of six. Steps run in order and the first failure fails the job; the step
  # name says which gate it was.
  static:
    name: API static checks
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # base branch for the migration diff and golangci --new-from-rev

      # security-lint.sh expects <root>/{api,agent,sdk-go}. The monorepo root
      # already has api/; the two siblings are checked out next to it.
      - name: Checkout sensor (as agent/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/sensor
          path: agent

      - name: Checkout sdk-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openctemio/sdk-go
          path: sdk-go

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      # PR-only: it reads the PR's labels (allow-destructive-migration).
      # Changelog entries live one file per change in api/changelog.d/, so
      # pull requests never conflict on CHANGELOG.md. This also refuses
      # merge-conflict markers committed anywhere in the repository.
      - name: Changelog fragments
        run: python3 scripts/changelog.py check

      - name: Migration Safety
        if: github.event_name == 'pull_request'
        env:
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }}
        run: |
          BASE_REF="$(bash ../.github/scripts/effective-base.sh api "origin/${{ github.base_ref }}")"
          export BASE_REF
          bash scripts/check-migrations.sh

      # Parallel PRs pick the same "next" number (#767 and #773 both took
      # 000261). Fails on a duplicate version, and on a PR or queued group
      # that adds a version not above the base's highest: golang-migrate
      # silently skips it on databases that are already past it. In the merge
      # queue the base is merge_group.base_sha, i.e. including the groups
      # ahead, so two queued PRs with the same number cannot both land.
      - name: Migration Versions
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          bash .github/scripts/check-migration-versions.test.sh >/dev/null
          case "$EVENT" in
            pull_request) bash .github/scripts/check-migration-versions.sh "origin/${BASE_REF}" ;;
            merge_group)  bash .github/scripts/check-migration-versions.sh "$MG_BASE" ;;
            *)            bash .github/scripts/check-migration-versions.sh ;;
          esac

      - name: SQL Schema Drift
        run: bash scripts/check-sql-schema.sh

      # RFC-042: configs/asset-types.yaml is the one definition of asset
      # types, classes and lenses. Fails when the generated Go/TS or the
      # asset_types seed in the newest registry migration drifted from it.
      # The live-schema half runs in internal/infra/postgres
      # (TestAssetTypeRegistry_*) on the full tier.
      - name: Asset Types Drift
        run: GOWORK=off go run ./cmd/gen-asset-types -check

      # Sensor protocol v3 (RFC-059): buf lint, buf breaking against the
      # base branch, and the committed Go code matches the .proto.
      - name: Sensor Protocol v3 (buf lint, breaking, generated code)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base="origin/${BASE_REF}" ;;
            merge_group)  base="$MG_BASE" ;;
            *)            base="HEAD~1" ;;
          esac
          bash scripts/check-proto.sh "$base"

      - name: Security Gates (security lint)
        working-directory: .
        env:
          SECLINT_ROOT: ${{ github.workspace }}
          SECLINT_STRICT: "1"
        run: bash api/scripts/security-lint.sh

      - name: Security Gates (tenant-scope analyzer)
        run: go test ./tools/lint/getbyid/... -count=1

      # D-11: no SELECT/UPDATE/DELETE of a tenant-scoped row by id without a
      # tenant predicate (shrink-only allowlist). The schema half of this test
      # (tenant_tables.txt vs the migrated DB) runs on the Postgres tier.
      - name: Security Gates (tenantless SQL guard)
        run: go test ./tools/lint/tenantsql/... -count=1

      - name: Security Gates (sensor vocabulary guard)
        run: go test ./tools/lint/sensorvocab/... -count=1

      # RFC-041: every route belongs to one plane and follows the API
      # conventions; today's violations are a shrink-only baseline.
      - name: Route Style (planes and conventions)
        run: go test ./tools/lint/routestyle/... ./internal/infra/http/routes/plane/... -count=1

      # Generates the spec from the handler annotations (it is not committed),
      # then checks it against the routes (scripts/check-openapi.sh).
      - name: OpenAPI Contract
        run: bash scripts/check-openapi.sh

      # Gateway: the single public entry point (api/deploy/gateway). Validates
      # the Caddyfile in every TLS mode, the entrypoint's refusals, and the
      # routing table against stub upstreams; and that the production compose
      # renders. The all-in-one image (deploy/allinone) embeds the same files.
      - name: Gateway Routing (smoke test)
        run: bash deploy/gateway/smoke-test.sh

      - name: Gateway Routing (production compose renders)
        working-directory: api/deploy
        run: |
          cp .env.example .env
          sed -i -e 's/^DB_PASSWORD=.*/DB_PASSWORD=x/' -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=x/' \
            -e 's/^AUTH_JWT_SECRET=.*/AUTH_JWT_SECRET=x/' -e 's/^APP_ENCRYPTION_KEY=.*/APP_ENCRYPTION_KEY=x/' \
            -e 's/^CSRF_SECRET=.*/CSRF_SECRET=x/' .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.http-redirect.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.plain-http.yml config -q
          SENSOR_PUBLIC_HOSTNAME=sensors.example.test docker compose -f docker-compose.yml -f docker-compose.sensor-passthrough.yml config -q
          # Only the gateway publishes a port.
          published="$(docker compose config --format json | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length) > 0) | .key')"
          echo "services with published ports: $published"
          test "$published" = "gateway"
          rm .env

      - name: Lint (go vet)
        run: go vet ./...

      - name: Lint (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Lint (golangci-lint on new code)
        if: github.event_name == 'pull_request'
        run: |
          base="$(bash ../.github/scripts/effective-base.sh api "origin/${{ github.base_ref }}")"
          make lint-new BASE_REF="$base"

  # Every event (PRs included): the whole suite against real Postgres and
  # Redis, so the DB-backed tests run too.
  test:
    name: Tests (Postgres + Redis)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openctem
          # Job-scoped throwaway database: no password at all (trust auth on
          # the service network), so no credential literal lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      # The spec is generated, not committed; the contract tests read it.
      - name: Generate the OpenAPI spec
        run: make swagger

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Apply migrations to the test database
        run: migrate -path migrations -database "$DATABASE_URL" up
        env:
          DATABASE_URL: postgres://openctem@localhost:5432/app_test?sslmode=disable

      # Explicit -timeout: the default 10m per package binary is too tight for
      # the -race suite on a slow or busy runner (it takes ~5m normally).
      # OPENCTEM_TEST_DB_REQUIRED: testdb fails instead of skipping when the
      # database is missing or unreachable. -json feeds the skip check below;
      # the jq filter prints the same log that -v would.
      - name: Run tests
        # shell: bash means -o pipefail. Without it a failing go test is hidden
        # by the pipe into tee/jq and the step goes green.
        shell: bash
        run: |
          go test -json -race -timeout 20m -coverprofile=coverage.out -covermode=atomic ./... \
            | tee test.json \
            | jq -Rrj '. as $l | (try fromjson catch null) as $e
                | if $e == null then $l + "\n"
                  elif ($e.Action == "output" or $e.Action == "build-output") then $e.Output
                  else empty end'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: openctem
          DB_NAME: app_test
          DATABASE_URL: postgres://openctem@localhost:5432/app_test?sslmode=disable
          OPENCTEM_TEST_DB_REQUIRED: "1"
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # A test that skips itself on a failed ping (t.Skipf) would otherwise let
      # this job go green without running its DB checks.
      - name: No DB-backed test was skipped
        if: ${{ !cancelled() }}
        run: bash ../.github/scripts/check-db-test-skips.sh test.json

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./api/coverage.out
          flags: api
          fail_ci_if_error: false

  # D-6: the API connects as a least-privilege role (docs/deployment/database-roles.md).
  # Both tiers: bootstrap a fresh database with deploy/postgres/least-privilege-roles.sql,
  # apply every migration AS THE MIGRATOR (no migration may need a superuser),
  # re-run the script (idempotent), then run the DB-backed suite AS THE APP ROLE.
  # Tests that replay a migration use DATABASE_MIGRATE_URL (testdb.MigratorURL).
  # Any runtime statement the app role may not run fails here with 42501.
  least-privilege:
    name: Tests (least-privilege DB role)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Job-scoped throwaway database, trust auth on the service network:
          # no credential literal in the repo. Role separation is what is
          # under test, not passwords.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPER_URL: postgres://postgres@localhost:5432/lp_test?sslmode=disable
      MIGRATOR_URL: postgres://openctem_migrator@localhost:5432/lp_test?sslmode=disable
      APP_URL: postgres://openctem_app@localhost:5432/lp_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      # The spec is generated, not committed; the contract tests read it.
      - name: Generate the OpenAPI spec
        run: make swagger

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Bootstrap the roles on a fresh database
        run: psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f deploy/postgres/least-privilege-roles.sql

      - name: Apply every migration as the migrator (not a superuser)
        run: migrate -path migrations -database "$MIGRATOR_URL" up

      - name: Re-run the bootstrap (idempotent; verifies grants on the migrated schema)
        run: psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f deploy/postgres/least-privilege-roles.sql

      - name: The app role can reach the database (so a skip cannot pass silently)
        run: psql "$APP_URL" -X -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM tenants'

      # OPENCTEM_TEST_DB_REQUIRED + the skip check: a DB test that skipped for a
      # missing database fails the job instead of passing silently. The two
      # tests that need CREATEDB (a superuser) skip here by design and run in
      # Tests (Postgres + Redis).
      - name: Run the DB-backed suite as the app role
        shell: bash # -o pipefail: the pipe into tee/jq must not hide a failure
        run: |
          go test -json -timeout 30m ./... \
            | tee lp-test.json \
            | jq -Rrj '. as $l | (try fromjson catch null) as $e
                | if $e == null then $l + "\n"
                  elif ($e.Action == "output" or $e.Action == "build-output") then $e.Output
                  else empty end'
        env:
          OPENCTEM_TEST_DB_REQUIRED: "1"
          DATABASE_URL: ${{ env.APP_URL }}
          DATABASE_MIGRATE_URL: ${{ env.MIGRATOR_URL }}
          # testdb.PrivateDatabase only: CREATE DATABASE + migrations need a superuser.
          DATABASE_ADMIN_URL: ${{ env.SUPER_URL }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: openctem_app
          DB_NAME: lp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: No DB-backed test was skipped
        if: ${{ !cancelled() }}
        run: bash ../.github/scripts/check-db-test-skips.sh lp-test.json

  # Merge queue and pushes only: the release-style static binaries (the former
  # separate `Build` job).
  binaries:
    name: Release Binaries
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Build release binaries (linux/amd64, static)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/openctem ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/bootstrap-admin ./cmd/bootstrap-admin

      - name: Upload API artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-linux-amd64
          path: api/dist/openctem

      - name: Upload Bootstrap Admin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-admin-linux-amd64
          path: api/dist/bootstrap-admin

  docker:
    name: Docker Build
    needs: [changes, static, test]
    if: needs.changes.outputs.api == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          push: false
          tags: openctem-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  # The ONE required status check for the API. Runs even when everything above
  # was skipped (non-API change, or a tier that does not apply to this event),
  # and fails if any job failed or was cancelled.
  api-ok:
    name: API CI OK
    if: always()
    needs: [changes, static, test, least-privilege, binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All API jobs passed or were skipped; the event's tier actually ran
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
          API: ${{ needs.changes.outputs.api }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          # Skipped is fine only when the area did not change. When it did,
          # the tier for this event must have RUN and passed, so a mistyped
          # condition cannot wave a queued PR through without its tests.
          if [ "$API" = true ]; then
            if [ "$EVENT" = pull_request ]; then required="changes static test least-privilege"; else required="changes static test least-privilege binaries"; fi
            for j in $required; do
              r="$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
              if [ "$r" != success ]; then echo "::error::$j must run and pass for $EVENT, got: $r"; exit 1; fi
            done
          fi
