name: Web E2E

# Runs the Playwright suite (web/e2e) against a real stack: the production
# images of the API and the web app, Postgres, Redis and the migrations, from
# web/e2e/ci/compose.yml, seeded by web/e2e/ci/seed.sh.
#
# The required check is `E2E OK`, never the shard jobs. It always reports:
#   success  the suite was not needed (path filter, no label) or every shard passed
#   failure  the build or a shard failed, or the run was cancelled
# A job skipped by `if:` reports Success while a skipped workflow leaves a
# required check Pending forever, so the workflow always starts and `decide`
# (in the `changes` job) says whether the suite runs.
#
# When the suite runs
#   merge queue   when the queued PR (merge_group.base_sha..head_sha) changed
#                 web/, api/ or anything shared (.github/, deploy/, root
#                 Makefile, go.work): .github/scripts/changed.sh, the same
#                 rules as the other workflows. Docs-only changes skip.
#   develop       on every push, the WHOLE suite: the queue ran only the specs
#                 the change needed, so this is the net under that selection.
#                 A failure opens or updates one issue labelled
#                 `e2e-regression`.
#   nightly       the whole suite on develop (02:41 UTC), and on demand.
#   pull request  only with the `run-e2e` label, or when the suite itself
#                 (web/e2e/, this workflow) changed, and the web or the API's
#                 HTTP layer (api/internal/infra/http/) changed. With the
#                 `ci:full` label or a changed CI definition (.github/workflows/,
#                 .github/scripts/, .github/actions/): the whole suite.
#
# Which specs (pull request, merge queue): the `plan` job maps the changed
# files to area tags with web/e2e/impact-map.yml (web/e2e/ci/select.mjs). The
# @smoke specs always run; a shared or unmapped path runs everything; only
# docs and unit tests select nothing. The specs are split into 1 to 4 shards
# by their recorded durations (artifact `e2e-timings` of the last green
# develop run, the median for a spec without one), longest first, and the
# every-page request budget check runs only when the @budget specs are
# selected. Details: api/docs/development/ci-cd.md.
#
# How it stays fast
#   build    the three images are built once per run (bake, GitHub Actions layer
#            cache) and handed to the shards as one artifact, so no shard builds.
#   shards   Playwright runs the specs `plan` assigned to each shard (1 to 4)
#            plus, when selected, one job for the every-page request budget
#            check, each against its own stack; 25 minute cap each. The first
#            failing shard cancels the others (matrix fail-fast, plus
#            .github/actions/fail-fast: the other runs of the group in the
#            merge queue); a cancelled shard still uploads its blob report.
#   caches   npm (setup-node) and the Chromium download (keyed by the Playwright
#            version).
#   retries  1, in CI only (web/playwright.config.ts). A test that fails then
#            passes is "flaky": the `report` job lists these in the run summary.
#   reports  each shard writes a blob report; `report` merges them into one HTML
#            report (artifact `playwright-report`, failures only).
# Wall time: build 3-11 min (warm/cold layer cache), shards about 6-8 min in
# parallel (stack start, install, a quarter of the tests), merge about 1 min.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    # labeled: adding `run-e2e` to a pull request starts the suite.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  merge_group:

# A newer push to the same PR cancels the older run. Never a queued group (a
# cancelled check ejects it) or a develop push (the branch's baseline).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The e2e stack pulls the CI image mirror (ghcr.io/openctemio/mirror).
  packages: read

jobs:
  changes:
    name: Detect web changes
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read # the `ci:full` label (changed.sh reads it live)
      actions: read # queue-verified.sh reads the merge queue's runs of this commit
      checks: read # green-base.sh and release-provenance.sh read a commit's check runs
    outputs:
      web: ${{ steps.f.outputs.web }}
      api: ${{ steps.f.outputs.api }}
      suite: ${{ steps.suite.outputs.changed }}
      http: ${{ steps.http.outputs.changed }}
      run: ${{ steps.decide.outputs.run == 'true' && (github.event_name == 'push' || steps.tree.outputs.verified != 'true') }}
      full: ${{ steps.f.outputs.full }}
      tree_note: ${{ steps.tree.outputs.note }}
      # The shards run on a push to develop even when the merge queue or an
      # earlier run passed that commit: the queue ran only the specs the change
      # needed, the push runs them all.
      shards: ${{ steps.decide.outputs.run == 'true' && (github.event_name == 'push' || (steps.queue.outputs.verified != 'true' && steps.tree.outputs.verified != 'true')) }}
      verified: ${{ steps.queue.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # The nightly run starts from the default branch's workflow file.
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: ./.github/actions/setup-gh
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/changed.sh
      # Which part of the side changed (.github/scripts/scope.sh): only narrows
      # what changed.sh selected, e.g. a change to web/e2e/ alone runs no web
      # unit tests and builds no image, a CI file only the workflows that use it.
      - id: scope
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/scope.sh
      # The API's HTTP layer (handlers, routes, middleware) is where the contract
      # the web compiles against comes from. Its generated files are not
      # committed, so a change there no longer shows up as a web change; count
      # it here so the suite still runs for it.
      - id: http
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          # The range changed.sh measured (incremental: since the last green commit).
          RANGE: ${{ steps.f.outputs.range }}
        run: |
          if [ -n "$MG_BASE" ] && [ -n "$MG_HEAD" ]; then
            git cat-file -e "${MG_BASE}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$MG_BASE" || true
            range="${MG_BASE}..${MG_HEAD}"
          elif [ -n "$RANGE" ]; then
            range="$RANGE"
          else
            git fetch --no-tags --quiet origin "$BASE_REF"
            range="origin/${BASE_REF}...HEAD"
          fi
          if ! files="$(git diff --name-only "$range")" || grep -q '^api/internal/infra/http/' <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # Did a pull request change the suite itself? Then it runs on the PR.
      - id: suite
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          RANGE: ${{ steps.f.outputs.range }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          if git diff --name-only "${RANGE:-origin/${BASE_REF}...HEAD}" | grep -qE '^(web/e2e/|\.github/workflows/web-e2e\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # Should the suite run? One decision, read by `build`, the shards and
      # `E2E OK`.
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          # The suite needs app code, its own specs, English text (specs find
          # elements by it) or this workflow's CI files; not a vi catalog.
          WEB: ${{ steps.f.outputs.web == 'true' && (steps.scope.outputs.web_app == 'true' || steps.scope.outputs.ci_self == 'true' || steps.scope.outputs.web_e2e == 'true' || steps.scope.outputs.i18n_en == 'true') }}
          API: ${{ steps.f.outputs.api == 'true' && (steps.scope.outputs.api_code == 'true' || steps.scope.outputs.ci_self == 'true') }}
          HTTP: ${{ steps.http.outputs.changed }}
          SUITE: ${{ steps.suite.outputs.changed }}
          FULL: ${{ steps.f.outputs.full }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e') }}
        run: |
          run=false
          case "$EVENT" in
            pull_request)
              # ci:full or a changed CI definition: the merge-queue rule below.
              if [ "$FULL" = true ]; then
                if [ "$WEB" = true ] || [ "$API" = true ]; then run=true; fi
              elif { [ "$WEB" = true ] || [ "$HTTP" = true ]; } && { [ "$SUITE" = true ] || [ "$LABELED" = true ]; }; then run=true; fi ;;
            *)
              # merge_group, push: web/, api/ or a shared file changed.
              if [ "$WEB" = true ] || [ "$API" = true ]; then run=true; fi ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "suite runs: $run"
      - id: queue
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/queue-verified.sh

      # The exact tree of this commit already passed every required check on a
      # pull request or an earlier queue run: skip the jobs below
      # (.github/scripts/tree-verified.sh). Also records the tree this run tested.
      - id: tree
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/tree-verified.sh

  # Which specs this change needs, and how to split them (research/295).
  # Pull request and merge queue: the changed files through
  # web/e2e/impact-map.yml; every other event runs everything. Any doubt (a
  # path nobody mapped, a failed diff, a broken map) gives "all". The job runs
  # the PR's own selector, as it runs the PR's own workflow.
  plan:
    name: Select specs and plan shards
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    timeout-minutes: 10
    # actions: read for the timings artifact of the last green develop run;
    # write also lets the fail-fast step cancel doomed runs
    # (.github/actions/fail-fast).
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
      - uses: ./.github/actions/setup-gh
      # select.mjs needs Node.js only (no packages); the self-hosted image has none.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      # The files this run's change touches. An empty file (diff failed) makes
      # the selector run everything.
      - name: Changed files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          : > "$RUNNER_TEMP/changed.txt"
          case "$EVENT" in
            merge_group)
              git cat-file -e "${MG_BASE}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$MG_BASE" || true
              git diff --name-only "${MG_BASE}..${MG_HEAD}" > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt" ;;
            pull_request)
              git fetch --no-tags --quiet origin "$BASE_REF" || true
              git diff --name-only "origin/${BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt" ;;
          esac
          wc -l < "$RUNNER_TEMP/changed.txt"

      # Per-spec durations recorded by the newest green develop run. None found
      # (first run, expired artifact): every spec costs the same.
      - name: Recorded durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          for id in $(gh run list -R "$REPO" --workflow web-e2e.yml --branch develop --status success --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            if gh run download "$id" -R "$REPO" -n e2e-timings -D "$RUNNER_TEMP/timings" >/dev/null 2>&1; then
              echo "timings from run $id"; break
            fi
          done
          ls "$RUNNER_TEMP/timings" || true

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          # The full tier asked for: the ci:full label or a changed CI
          # definition. Only on a pull request; the merge queue always reports
          # it and selects by files.
          FULL: ${{ github.event_name == 'pull_request' && needs.changes.outputs.full == 'true' }}
        run: |
          args=(plan --changed "$RUNNER_TEMP/changed.txt" --event "$EVENT")
          if [ "$FULL" = true ]; then args+=(--full); fi
          if [ -f "$RUNNER_TEMP/timings/e2e-timings.json" ]; then args+=(--timings "$RUNNER_TEMP/timings/e2e-timings.json"); fi
          node web/e2e/ci/select.mjs "${args[@]}" > "$RUNNER_TEMP/plan.json"
          jq -c '.matrix' "$RUNNER_TEMP/plan.json" | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          jq -r '"count=\(.count)\nmode=\(.mode)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          {
            echo "### E2E selection"
            jq -r '"- mode: **\(.mode)** (\(.reason))\n- specs: \(.specs), shards: \(.shards), request budget job: \(.budget)"' "$RUNNER_TEMP/plan.json"
            jq -r '.matrix.include[] | "- \(.name): \(.files | split(" ") | length) specs, about \(.seconds) s"' "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  build:
    name: Build e2e images
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      packages: read
      actions: write
    needs: [changes, plan]
    if: needs.changes.outputs.run == 'true' && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_E2E_BUILD) || (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_HEAVY) || 'ubuntu-latest' }}
    timeout-minutes: 25
    env:
      API_IMAGE: local/openctem-api:e2e
      WEB_IMAGE: local/openctem-web:e2e
      ADMIN_IMAGE: local/admin-cli:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The web image compiles against the generated contract files, which are
      # not committed (api/docs/development/ci-cd.md).
      - name: Generate the contract files
        uses: ./.github/actions/generate-contract

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Registry login (GHCR mirror; Docker Hub when configured)
        uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The three images build in parallel (web/e2e/ci/docker-bake.hcl) with
      # the GitHub Actions layer cache. Only a push to develop writes the
      # cache: pull requests read develop's, while a cache written from a pull
      # request or a merge-queue ref is readable by that ref alone and only
      # pushed develop's caches out of the 10 GB store.
      - name: Build images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        with:
          source: .
          files: web/e2e/ci/docker-bake.hcl

      # One archive for every shard (already compressed, so no artifact
      # compression on top).
      - name: Save the images
        run: docker save "$API_IMAGE" "$WEB_IMAGE" "$ADMIN_IMAGE" | gzip -1 > e2e-images.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  e2e:
    name: Playwright e2e (${{ matrix.name }})
    # actions: write lets the fail-fast step cancel doomed runs (.github/actions/fail-fast).
    permissions:
      contents: read
      packages: read
      actions: write
    needs: [changes, plan, build]
    if: needs.changes.outputs.shards == 'true' && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    # Always GitHub-hosted: the stack publishes on 127.0.0.1 of the Docker host and
    # the tests call http://localhost, which on the self-hosted runner (Docker via
    # dind) is a different machine. Playwright's apt dependencies need sudo too.
    runs-on: ubuntu-latest
    # Stack start, install and a quarter of the tests; no image build here.
    timeout-minutes: 25
    strategy:
      # The first red shard cancels the rest: the gate fails either way.
      fail-fast: true
      # From `plan`: one entry per shard (id 1..4, `files` = its specs) and,
      # when @budget is selected, id 0 = the request budget check alone.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      API_IMAGE: local/openctem-api:e2e
      WEB_IMAGE: local/openctem-web:e2e
      ADMIN_IMAGE: local/admin-cli:e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images

      - name: Load the images built in this run
        run: gzip -dc e2e-images.tar.gz | docker load

      - name: Registry login (GHCR mirror; Docker Hub when configured)
        uses: ./.github/actions/registry-login
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Fresh random passwords and secrets for this run (masked in the log),
      # written to web/e2e/ci/.env for compose and exported to later steps.
      - name: Generate the stack's secrets
        run: bash web/e2e/ci/make-env.sh

      # postgres and redis come from the CI image mirror
      # (.github/ci-images.txt); pulled first, with retries on registry limits.
      - name: Pull the stack's third-party images
        run: bash .github/scripts/retry.sh docker compose -f web/e2e/ci/compose.yml pull --quiet postgres redis

      - name: Start the stack
        run: docker compose -f web/e2e/ci/compose.yml up -d --wait --wait-timeout 180

      - name: Seed a tenant
        run: bash web/e2e/ci/seed.sh > web/e2e/.env

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run the suite
        working-directory: web
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8080
          # Spec paths from `plan`: names from the repository's own specs
          # directory (the tag gate refuses anything but [A-Za-z0-9._/-]).
          SPECS: ${{ matrix.files }}
        run: |
          read -r -a spec_files <<< "$SPECS"
          # Quarantined flaky tests (.github/quarantine.yml) are skipped until their fix date.
          q="$(python3 ../.github/scripts/quarantine.py pw-grep-invert)"
          if [ -n "$q" ]; then echo "quarantined: $q"; fi
          npx playwright test "${spec_files[@]}" ${q:+--grep-invert "$q"}

      - name: Stack logs
        if: failure()
        run: docker compose -f web/e2e/ci/compose.yml logs --no-color --tail 300 api web > e2e-stack.log 2>&1 || true

      # The blob report is what `report` merges; traces and videos of failures
      # ride along in test-results/.
      - name: Upload the shard's blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.id }}
          path: |
            web/blob-report/
            web/test-results/
            e2e-stack.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail fast
        if: failure()
        uses: ./.github/actions/fail-fast

  report:
    name: Merge reports and list flaky tests
    needs: [changes, e2e]
    if: always() && needs.changes.outputs.run == 'true' && needs.e2e.result != 'skipped'
    permissions:
      contents: read
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          # The self-hosted runner keeps its own npm cache (ci-cd.md).
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: web/all-blobs
          merge-multiple: true
      - name: Merge the shards' reports
        working-directory: web
        run: |
          mkdir -p blobs
          # Only the blob reports: test-results/ rides in the same artifact and
          # holds the trace.zip of every failed attempt (a test that passed on
          # its retry), which are not blob reports and break the merge.
          find all-blobs -path '*/blob-report/*' -name '*.zip' -exec cp {} blobs/ \;
          if ! ls blobs/*.zip >/dev/null 2>&1; then echo "no blob reports (a shard failed before the tests ran)"; exit 0; fi
          npx playwright merge-reports --reporter html ./blobs
          npx playwright merge-reports --reporter json ./blobs > report.json
      # A test that failed and then passed on the retry is flaky: it does not
      # fail the run, but it is listed here so it gets fixed.
      - name: Flaky tests
        working-directory: web
        run: |
          [ -f report.json ] || exit 0
          flaky="$(jq -r '[.. | objects | select(has("specs")) | .specs[]? | select(.tests[]?.status == "flaky") | .title] | unique | .[]' report.json)"
          if [ -n "$flaky" ]; then
            { echo "### Flaky e2e tests (passed on retry)"; echo; while IFS= read -r t; do echo "- $t"; done <<< "$flaky"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::flaky e2e tests: $(echo "$flaky" | wc -l) (see the run summary)"
          fi
      # develop and the nightly run execute every spec, so their durations
      # are the ones `plan` balances the next shards with.
      - name: Record per-spec durations
        if: needs.e2e.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule')
        working-directory: web
        run: |
          [ -f report.json ] || exit 0
          node e2e/ci/select.mjs timings report.json > e2e-timings.json
      - name: Upload the durations
        if: needs.e2e.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings
          path: web/e2e-timings.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the merged HTML report
        if: needs.e2e.result != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # The check to require. Always reports (see the header).
  # It does not wait for `report`: the merged HTML report and the flaky list
  # are for people, so a report failure never fails the check and the queue
  # does not wait the extra minute for it.
  e2e-ok:
    name: E2E OK
    if: always()
    needs: [changes, plan, build, e2e]
    runs-on: ${{ (github.event_name == 'merge_group' && (vars.CI_RUNNER_MERGE || 'ubuntu-latest')) || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER_LIGHT) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: The suite passed, or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.changes.outputs.run }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
          SHARDS: ${{ needs.changes.outputs.shards }}
          COUNT: ${{ needs.plan.outputs.count }}
          MODE: ${{ needs.plan.outputs.mode }}
          TREE_NOTE: ${{ needs.changes.outputs.tree_note }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ -n "$TREE_NOTE" ]; then echo "$TREE_NOTE"; fi
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "::error::a job failed or was cancelled"; exit 1
          fi
          if [ "$(echo "$NEEDS" | jq -r '.changes.result')" != success ]; then
            echo "::error::the change detection did not succeed"; exit 1
          fi
          if [ "$RUN" = true ] && [ "$SHARDS" != true ]; then
            echo "the merge queue already passed this commit; the images were built for the layer cache"
          elif [ "$RUN" = true ] && [ "$COUNT" = 0 ]; then
            echo "no spec needed for this change (selection: $MODE)"
          elif [ "$RUN" = true ]; then
            for j in plan build e2e; do
              r="$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')"
              if [ "$r" != success ]; then echo "::error::$j must run and pass, got: $r"; exit 1; fi
            done
          else
            echo "suite not needed for this change"
          fi

  # A failure on develop (every push and the nightly run execute the whole
  # suite) opens one issue, or adds a comment to the open one, so a regression
  # the queue's narrower selection let through is seen and fixed. Not part of
  # `E2E OK`.
  regression:
    name: Report an e2e regression
    needs: [changes, plan, build, e2e]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'schedule')
      && (needs.plan.result == 'failure' || needs.build.result == 'failure' || needs.e2e.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          label=e2e-regression
          gh label create "$label" -R "$REPO" --color D93F0B --description "The full e2e suite failed on develop" 2>/dev/null || true
          body="The full e2e suite failed on develop (${EVENT}) at ${SHA}. Run: ${RUN_URL}"
          n="$(gh issue list -R "$REPO" --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --label "$label" --title "e2e regression on develop" \
              --body "$body

          Fix the spec or the change that broke it. This issue stays open until the suite is green again; a later failure adds a comment here."
          fi
