# Security-sensitive paths: the one list the `security-gate` check and the
# security block of .github/CODEOWNERS are built from.
#
# A pull request that changes a file matching any pattern below is labelled
# `security-sensitive`, gets an automated security review comment, and passes
# the required `security-gate` check only once a maintainer listed under
# `ackers` adds the `security-ack` label and the review has no open HIGH
# finding. How it works and how to override it in an emergency:
# server/docs/development/ci-cd.md#security-gate.
#
# Format (kept to this subset so the gate parses it without a YAML library):
# a top-level `key:` line followed by `  - pattern` lines. Patterns are
# repository-relative globs: `**` matches any number of directories, `*` and
# `?` never match `/`.
#
# The gate always reads this file from the BASE branch, so a pull request
# cannot narrow the list for itself. After editing it run
#   python3 .github/scripts/security_gate.py codeowners --write
# to refresh CODEOWNERS (the self-test job fails while they differ).

# GitHub users whose `security-ack` label counts.
ackers:
  - 0xmanhnv

# Files that count only when a change removes lines from them: adding a test
# or a guarded table strengthens a guard, removing one weakens it.
removal-only:
  - '**/*_test.go'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.spec.ts'
  - '**/testdata/**'
  - server/tools/lint/tenantsql/tenant_tables.txt

# Authentication, sessions, authorization gates and the permission model.
authn-authz:
  - server/internal/infra/http/middleware/**
  - server/internal/infra/http/routes/auth.go
  - server/internal/infra/http/routes/admin.go
  - server/internal/infra/http/internalapi/**
  - server/internal/server/internal_api.go
  - server/internal/app/entitlement/**
  - server/internal/infra/http/routes/misc.go
  - server/internal/infra/http/routes/scim.go
  - server/internal/infra/http/routes/mcp_oauth.go
  - server/internal/infra/http/routes/ci.go
  - server/internal/infra/http/handler/*auth*.go
  - server/internal/infra/http/handler/oauth*.go
  - server/internal/infra/http/handler/mcp_oauth*.go
  - server/pkg/domain/permission/**
  - server/internal/app/accesscontrol/**
  - server/internal/app/auth/**
  - server/internal/app/apikey/**
  - server/internal/app/mcpoauth/**
  - server/internal/app/scim/**
  - server/pkg/jwt/**
  - server/pkg/oidc/**
  - server/pkg/totp/**
  - server/pkg/password/**
  - server/pkg/dpop/**

# Tenant isolation and data scope, and the static guards that enforce them.
tenant-isolation:
  - server/internal/app/datascope/**
  - server/internal/app/actscope/**
  - server/internal/infra/postgres/data_scope_repository.go
  - server/internal/infra/postgres/tenant_repository.go
  - server/internal/infra/http/handler/data_scope_filter.go
  - server/tools/lint/tenantsql/**
  - server/tools/lint/getbyid/**
  - server/tools/lint/routeperm/**
  - server/scripts/security-lint.sh

# Encryption, key handling and signatures.
crypto-keys-signing:
  - server/pkg/crypto/**
  - server/pkg/jobsign/**
  - server/pkg/feedsign/**
  - server/pkg/sensorsig/**
  - server/pkg/sensorkey/**
  - server/internal/signer/**
  - server/internal/infra/signer/**
  - server/internal/app/rekey/**
  - server/cmd/signer/**
  - server/cmd/rekey/**
  - server/cmd/encrypt-credentials/**

# Sensor protocol: transports (HTTPS v2, gRPC v3 with mTLS), ALPN routing at
# the gateway, pairing and job signatures.
sensor-protocol:
  - server/internal/infra/sensortransport/**
  - server/pkg/sensorproto/**
  - server/internal/infra/http/tls.go
  - server/internal/infra/http/handler/sensor_signature*.go
  - server/internal/infra/http/handler/sensor_identity_handler.go
  - server/internal/infra/http/handler/sensor_pairing_handler.go
  - server/internal/infra/http/handler/sensor_v3_bridge.go
  - server/internal/app/sensorpairing/**
  - server/deploy/gateway/**

# The scope gate: what may be scanned, approvals and attestations.
scope-gate:
  - server/internal/app/scope/service.go
  - server/internal/app/scope/rule.go
  - server/internal/app/scope/exclusion_matcher.go
  - server/internal/app/scopeauth/**
  - server/internal/app/scangov/gate.go
  - server/internal/app/scan/dispatch_gate.go
  # Exploration leads dispatch through the coverage run path; the
  # controller decides which steps start and on which target.
  - server/internal/app/exploration/controller.go
  - server/internal/app/command/scope_recheck.go
  # The web scope of every web job (path exclusions): the command create
  # guard and its fail-closed fallback.
  - server/internal/app/scope/web_job.go
  - server/internal/infra/postgres/command_web_scope.go
  - server/pkg/domain/command/web_scope.go

# Sensor results: which existing objects a report may change (result
# binding), trusted collectors and their complete reports, and exclusions at
# ingest.
sensor-result-trust:
  - server/internal/app/ingest/binding.go
  - server/internal/app/ingest/collector_trust.go
  - server/internal/app/ingest/collector_reports.go
  - server/internal/app/ingest/exclusions.go
  - server/internal/infra/postgres/collector_asset_repository.go

# Web session, CSRF, proxying and security headers.
web-session-headers:
  - web/src/proxy.ts
  - web/src/app/api/**
  - web/src/features/*/actions/**
  - web/src/lib/server-auth-cookies.ts
  - web/src/lib/cookies-server.ts
  - web/src/lib/auth-refresh-lock.ts
  - web/src/lib/csrf-client.ts
  - web/src/lib/redirect.ts
  - web/src/lib/safe-href.ts
  - web/src/lib/sanitize-markdown.ts
  - web/src/lib/api/client.ts
  - web/src/lib/api/proxy-*.ts
  - web/src/lib/api/client-ip-headers.ts
  - web/next.config.ts
  - web/server-with-ws.mjs

# The platform console app (RFC-022 revision 21): its own site, proxy, CSP and
# API client; every change to it is reviewed, as are the console API routes
# (routes/admin.go under authn-authz) and handlers.
platform-console:
  - web/console/**
  - server/internal/infra/http/handler/admin_*.go
  - server/internal/app/adminconsole/**

# File upload, storage and download handlers.
upload-download:
  - server/internal/infra/storage/**
  - server/internal/infra/http/handler/attachment_handler.go
  - server/internal/infra/http/handler/*_import_handler.go
  - server/internal/infra/http/handler/finding_evidence*.go
  - server/internal/infra/http/handler/*export*.go
  - server/internal/infra/http/handler/pentest_export.go

# Outbound HTTP: the SSRF guard and client-IP handling.
outbound-ssrf:
  - server/pkg/httpsec/**

# CI, release tooling and this gate.
ci-release:
  - .github/workflows/**
  - .github/actions/**
  - .github/codeql/**
  - .github/scripts/**
  - .github/security-paths.yml
  - .github/quarantine.yml
  - .github/CODEOWNERS
  - .githooks/**
  - server/scripts/release-branch.sh

# Images and deployment defaults. Security-relevant defaults in
# server/internal/config/config.go are caught by the CONFIG-SECURITY-DEFAULT
# content rule instead of the whole file.
deploy-defaults:
  - '**/Dockerfile*'
  - server/deploy/**
  - deploy/**

