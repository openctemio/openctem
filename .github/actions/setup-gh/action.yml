# Makes the GitHub CLI available to the steps after it:
#
#   - uses: ./.github/actions/setup-gh
#
# GitHub-hosted runners ship `gh`; the self-hosted runner image may not
# (server/docs/development/ci-cd.md, "Self-hosted runner (opt-in)"). When `gh` is
# missing, the pinned release tarball is fetched through
# ./.github/actions/fetch-tool (Actions cache first, download on a miss),
# checked against its SHA-256 and put on PATH for this job only. Nothing is
# installed when `gh` is already there.
name: Setup gh
description: Install the GitHub CLI (pinned version and SHA-256) when the runner has none.
runs:
  using: composite
  steps:
    - name: GitHub CLI present?
      id: pin
      shell: bash
      env:
        # tool-pin: cli/cli
        GH_CLI_VERSION: 2.92.0
        GH_CLI_SHA256: b57848131bdf0c229cd35e1f2a51aa718199858b2e728410b37e89a428943ec4
      run: |
        if command -v gh >/dev/null 2>&1; then
          gh --version | head -1
          echo "missing=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo "missing=true"
          echo "version=$GH_CLI_VERSION"
          echo "sha256=$GH_CLI_SHA256"
        } >> "$GITHUB_OUTPUT"
    - name: Fetch gh
      id: gh
      if: steps.pin.outputs.missing == 'true'
      uses: ./.github/actions/fetch-tool
      with:
        name: gh
        version: ${{ steps.pin.outputs.version }}
        url: https://github.com/cli/cli/releases/download/v${{ steps.pin.outputs.version }}/gh_${{ steps.pin.outputs.version }}_linux_amd64.tar.gz
        sha256: ${{ steps.pin.outputs.sha256 }}
        extract: gh_${{ steps.pin.outputs.version }}_linux_amd64/bin/gh
    - name: Put gh on PATH
      if: steps.pin.outputs.missing == 'true'
      shell: bash
      env:
        GH_DIR: ${{ steps.gh.outputs.dir }}
      run: |
        echo "$GH_DIR" >> "$GITHUB_PATH"
        "$GH_DIR/gh" --version | head -1
