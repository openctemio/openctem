# Makes the GitHub CLI available to the steps after it:
#
#   - uses: ./.github/actions/setup-gh
#
# GitHub-hosted runners ship `gh`; the self-hosted runner image may not
# (api/docs/development/ci-cd.md, "Self-hosted runner (opt-in)"). When `gh` is
# missing, the pinned release tarball is downloaded, checked against its
# SHA-256 and put on PATH for this job only. Nothing is installed when `gh`
# is already there.
name: Setup gh
description: Install the GitHub CLI (pinned version and SHA-256) when the runner has none.
runs:
  using: composite
  steps:
    - name: GitHub CLI
      shell: bash
      env:
        # tool-pin: cli/cli
        GH_CLI_VERSION: 2.92.0
        GH_CLI_SHA256: b57848131bdf0c229cd35e1f2a51aa718199858b2e728410b37e89a428943ec4
      run: |
        if command -v gh >/dev/null 2>&1; then gh --version | head -1; exit 0; fi
        d="$RUNNER_TEMP/gh-cli"
        mkdir -p "$d"
        curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$d/gh.tgz" \
          "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
        echo "${GH_CLI_SHA256}  $d/gh.tgz" | sha256sum -c -
        tar -xzf "$d/gh.tgz" -C "$d" --strip-components=2 "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
        echo "$d" >> "$GITHUB_PATH"
        "$d/gh" --version | head -1
