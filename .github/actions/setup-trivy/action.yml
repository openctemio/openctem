name: Set up trivy
description: >
  Installs a pinned trivy release from its GitHub release asset, checked
  against the published SHA-256 on every run (through
  ./.github/actions/fetch-tool, which keeps the archive in the Actions cache).
  Used by the image guard.
runs:
  using: composite
  steps:
    - name: Pick the trivy asset for this runner
      id: pin
      shell: bash
      env:
        TRIVY_VERSION: "0.75.0"
        TRIVY_SHA256_AMD64: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        TRIVY_SHA256_ARM64: a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) asset=Linux-64bit; sum="$TRIVY_SHA256_AMD64" ;;
          aarch64|arm64) asset=Linux-ARM64; sum="$TRIVY_SHA256_ARM64" ;;
          *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac
        {
          echo "version=$TRIVY_VERSION"
          echo "sha256=$sum"
          echo "url=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
        } >> "$GITHUB_OUTPUT"
    - name: Fetch trivy
      id: trivy
      uses: ./.github/actions/fetch-tool
      with:
        name: trivy
        version: ${{ steps.pin.outputs.version }}
        url: ${{ steps.pin.outputs.url }}
        sha256: ${{ steps.pin.outputs.sha256 }}
        extract: trivy
    - name: Put trivy on PATH
      shell: bash
      env:
        TRIVY_DIR: ${{ steps.trivy.outputs.dir }}
      run: |
        echo "$TRIVY_DIR" >> "$GITHUB_PATH"
        "$TRIVY_DIR/trivy" --version
