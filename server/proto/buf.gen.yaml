# Generates the Go code of server/pkg/sensorproto/v3 (committed). Run from server/:
#   make proto
version: v2
plugins:
  - local: protoc-gen-go
    out: ..
    opt: module=github.com/openctemio/openctem/server
  - local: protoc-gen-connect-go
    out: ..
    opt: module=github.com/openctemio/openctem/server
