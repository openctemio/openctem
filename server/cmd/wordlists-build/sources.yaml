# Upstream sources of the first-party wordlist packs (research/294, D2, O2).
#
# Every file is pinned twice: the repository commit it is read at and the
# sha256 of the file itself. A file enters a pack only when its own license is
# on the allow-list (MIT, Apache-2.0, BSD-2/3-Clause, ISC, CC0-1.0, Unlicense,
# WTFPL, CC-BY-4.0). The license is decided per file from its upstream, not
# from the repository that happens to host it; `evidence` says how.
#
# To change a list: edit this file in a pull request (new commit and sha256),
# run `go run ./cmd/wordlists-build`, and read the release diff.
release: "2026.10.1"

sources:
  - id: seclists
    name: SecLists
    repo: https://github.com/danielmiessler/SecLists
    commit: fd02038d8b47e2f9d28d75ab3719f5ecf7f2d571
    raw: https://raw.githubusercontent.com/danielmiessler/SecLists/{commit}/{path}
    copyright: "Copyright (c) 2018 Daniel Miessler"
    files:
      - id: dns-top1m-5000
        path: Discovery/DNS/subdomains-top1million-5000.txt
        sha256: e331367c140298cb179114fdeefa78f58f696219f0dec017a28bb79487cfcf19
        spdx: MIT
        evidence: "Discovery/DNS/README.md: generated by the repository maintainers from DNS zone data; the repository LICENSE is MIT."
      - id: dns-top1m-110000
        path: Discovery/DNS/subdomains-top1million-110000.txt
        sha256: 7b8359732bdee838ecdb9ef2cd3bb9a792347dab0457fd9b33a9b152d8dc238d
        spdx: MIT
        evidence: "Discovery/DNS/README.md: generated by the repository maintainers from DNS zone data; the repository LICENSE is MIT."
      - id: dns-bitquark-100000
        path: Discovery/DNS/bitquark-subdomains-top100000.txt
        sha256: f5e0acdfc136bb08fa86a3b346d44780aabfe5bfac45935fdc5507578bbb8400
        spdx: MIT
        evidence: "Results of github.com/bitquark/dnspop, which is MIT (GitHub license API); the repository LICENSE is MIT."
      - id: web-params-top55
        path: Discovery/Web-Content/url-params_from-top-55-most-popular-apps.txt
        sha256: 83244d6b21515b4ac0734afc5427cb1b24a63cf4c093defe44907eb0cfae7ae0
        spdx: MIT
        evidence: "Contributed to the repository by J-GainSec (2022-06-28); the repository LICENSE is MIT."
      - id: web-graphql
        path: Discovery/Web-Content/graphql.txt
        sha256: 38db856024fd1cd858ad9e695c443e09038d2e29737eedc321749d92fdf4accd
        spdx: MIT
        evidence: "Contributed to the repository by Dominique Righetto (2019-10-11); the repository LICENSE is MIT."

  - id: api_wordlist
    name: api_wordlist
    repo: https://github.com/chrislockard/api_wordlist
    commit: 5cc5064654bead48d02481c11d4a863de64e9688
    raw: https://raw.githubusercontent.com/chrislockard/api_wordlist/{commit}/{path}
    copyright: "Copyright (c) 2015-2025 Chris Lockard"
    files:
      - id: api-actions
        path: actions.txt
        sha256: 93339d167f7384498b80a1dd273dd5979cc7096daf454a3f4c956b82e1fc6779
        spdx: MIT
        evidence: "The repository LICENSE.md is MIT."
      - id: api-objects
        path: objects.txt
        sha256: 4a0c12bb3a5da90597de70549db7b76d9b6b2f6786369e5f7296f432f9f203d9
        spdx: MIT
        evidence: "The repository LICENSE.md is MIT."
      - id: api-seen-in-wild
        path: api_seen_in_wild.txt
        sha256: 8ee7d0c1db4161433cafd4653e872ac1756d211c30a34c4679854f3998adbb8b
        spdx: MIT
        evidence: "The repository LICENSE.md is MIT."

# Files that are not bundled, with the reason. They are listed in every pack's
# NOTICE. A file moves out of this list only with evidence of a license on the
# allow-list.
excluded:
  - {source: SecLists, path: "Discovery/Web-Content/raft-*.txt", spdx: GPL-3.0-only, reason: "The RAFT lists come from the RAFT project (Google Code archive), whose license is GPL-3.0. Copyleft data inside an MIT repository is not redistributed."}
  - {source: SecLists, path: Discovery/Web-Content/common.txt, spdx: NOASSERTION, reason: "Provenance not established (the same shape as a GPL-2.0 directory list). Excluded until the origin is verified."}
  - {source: SecLists, path: Discovery/Web-Content/quickhits.txt, spdx: NOASSERTION, reason: "Provenance not established. Excluded until the origin is verified."}
  - {source: SecLists, path: Discovery/Web-Content/burp-parameter-names.txt, spdx: NOASSERTION, reason: "Provenance not established (name list taken from another tool). Excluded until the origin is verified."}
  - {source: SecLists, path: Discovery/DNS/deepmagic.com-prefixes-top50000.txt, spdx: NOASSERTION, reason: "Data of a third-party site with no license statement."}
  - {source: SecLists, path: Discovery/DNS/n0kovo_subdomains.txt, spdx: GPL-3.0-only, reason: "GPL-3.0 upstream (n0kovo), shipped inside an MIT repository."}
  - {source: SecLists, path: "Discovery/DNS/FUZZSUBS_CYFARE_*.txt", spdx: NOASSERTION, reason: "Unclear provenance (merged gists)."}
  - {source: SecLists, path: Discovery/DNS/dns-Jhaddix.txt, spdx: NOASSERTION, reason: "Unclear provenance (merge of other lists)."}
  - {source: SecLists, path: Discovery/DNS/combined_subdomains.txt, spdx: NOASSERTION, reason: "A merge of lists of unclear provenance."}
  - {source: SecLists, path: "Discovery/Web-Content/DirBuster-2007_*.txt", spdx: CC-BY-SA-3.0, reason: "ShareAlike: allowed only in an opt-in pack with attribution; not in the default packs."}
  - {source: param-miner, path: resources/params, spdx: NOASSERTION, reason: "The repository license is not machine-identifiable (NOASSERTION) and the list's own provenance is unstated."}
  - {source: OneListForAll, path: "*", spdx: NOASSERTION, reason: "No license file (all rights reserved)."}
  - {source: WordList (orwagodfather), path: "*", spdx: NOASSERTION, reason: "No license file (all rights reserved)."}
  - {source: dirsearch, path: db/dicc.txt, spdx: GPL-2.0-only, reason: "GPL."}
  - {source: Arjun, path: "db/*", spdx: AGPL-3.0-only, reason: "AGPL."}
  - {source: x8, path: "*", spdx: GPL-3.0-only, reason: "GPL."}
  - {source: puredns, path: "*", spdx: GPL-3.0-only, reason: "GPL."}

# What each pack holds. A list is the ranked union of its inputs: an entry's
# rank is its best position in any input (ties go to the earlier input), and
# the first `cap` entries are kept. Web path and file lists are not built in
# this release: no source of them has a license on the allow-list yet.
packs:
  - name: wordlists-s
    class: s
    lists:
      - {path: dns/labels-s.txt, purpose: dns-labels, cap: 5000, from: [dns-top1m-5000]}
      - {path: web/api-routes-s.txt, purpose: api-routes, cap: 1500, from: [web-graphql, api-actions]}
      - {path: web/params-s.txt, purpose: params, cap: 2000, from: [web-params-top55]}
  - name: wordlists-m
    class: m
    lists:
      - {path: dns/labels-m.txt, purpose: dns-labels, cap: 50000, from: [dns-top1m-110000, dns-bitquark-100000]}
      - {path: web/api-routes-m.txt, purpose: api-routes, cap: 12000, from: [web-graphql, api-actions, api-objects, api-seen-in-wild]}
      - {path: web/params-m.txt, purpose: params, cap: 25000, from: [web-params-top55]}
